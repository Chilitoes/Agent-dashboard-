<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Agent Village</title>
<style>
  :root{
    --bg0:#05030d; --bg1:#120a24; --ink:#efeaff; --muted:#8f86ad;
    --panel:#150f26; --panel2:#1e1536; --line:#332552;
    --pink:#e935c1; --purple:#b026ff; --cyan:#2de2e6; --gold:#ffd52e;
    --ok:#39ff88; --idle:#ff9e3d; --afk:#4dc9ff; --off:#4a4560;
  }
  *{box-sizing:border-box}
  /* lock the page: no scroll, no rubber-band — the app fills the visual viewport */
  html,body{margin:0;height:100%;width:100%;overflow:hidden;position:fixed;inset:0;
    overscroll-behavior:none;touch-action:none;
    background:
    radial-gradient(120% 60% at 50% -5%,#1c0f38 0%,transparent 60%),
    radial-gradient(130% 90% at 50% 100%,#140b28 0%,var(--bg0) 60%),var(--bg0);
    color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:none}
  /* app shell: header (auto) + stage (fills) + dock (auto) in one viewport column */
  .wrap{max-width:520px;margin:0 auto;padding:6px 10px calc(6px + env(safe-area-inset-bottom));
    height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:6px;flex:0 0 auto}
  h1{font-size:19px;margin:0;letter-spacing:6px;color:var(--gold);font-weight:800;
    text-shadow:0 0 14px rgba(255,213,46,.65),2px 2px 0 #000}
  .conn{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;gap:6px;align-items:center;font-size:10px;color:var(--muted)}
  .conn .led{width:8px;height:8px;border-radius:50%;background:var(--off)}
  .conn.live .led{background:var(--ok);box-shadow:0 0 9px var(--ok)}

  .stage{position:relative;width:100%;flex:1 1 auto;min-height:0}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #bg{z-index:1}#fg{z-index:2}
  .stage::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:4px;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),
      radial-gradient(120% 100% at 50% 45%,transparent 58%,rgba(3,2,10,.5) 100%)}
  .bubble{position:absolute;transform:translate(-50%,-100%);background:#f8f4ff;color:#17102b;
    font-size:11px;font-weight:700;padding:5px 9px;border-radius:9px;white-space:nowrap;max-width:230px;
    overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 16px rgba(233,53,193,.6);opacity:0;transition:opacity .2s;
    pointer-events:none;z-index:6}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:#f8f4ff;border-bottom:0}
  .bubble.show{opacity:1}
  /* agent's reply bubble (colored, points down from the agent) */
  .rbubble{position:absolute;transform:translate(-50%,-100%);color:#0a0614;
    font-size:11px;font-weight:700;padding:5px 9px;border-radius:9px;white-space:nowrap;max-width:210px;
    overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6;
    background:#39ff88;box-shadow:0 0 14px rgba(57,255,136,.5)}
  .rbubble::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:inherit;border-bottom:0}
  .rbubble.show{opacity:1}

  /* ---------- village feed dock (in-flow pill; body overlays upward) ---------- */
  .dock{position:relative;flex:0 0 auto;margin-top:7px;z-index:20;
    background:linear-gradient(180deg,rgba(26,16,46,.97),rgba(14,8,26,.97));
    border:1px solid rgba(233,53,193,.55);border-radius:16px;
    box-shadow:0 0 22px rgba(233,53,193,.30),0 8px 30px rgba(4,2,12,.7);backdrop-filter:blur(8px)}
  .dock .bar{display:flex;align-items:center;gap:10px;height:50px;padding:0 15px;cursor:pointer;user-select:none;position:relative}
  .dock .bar::before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(45,226,230,.6),transparent)}
  .dock .bar .pulse{width:9px;height:9px;border-radius:50%;background:var(--pink);flex:none;
    box-shadow:0 0 8px var(--pink);animation:dockpulse 2.2s ease-in-out infinite}
  @keyframes dockpulse{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
  .dock .bar .t{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--pink);text-shadow:0 0 9px rgba(233,53,193,.75);flex:none}
  .dock .bar .last{flex:1;font-size:11px;color:#cfc8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    -webkit-mask-image:linear-gradient(90deg,#000 82%,transparent)}
  .dock .bar .chev{transition:transform .25s;color:var(--cyan);font-size:11px;flex:none;
    width:24px;height:24px;border:1px solid rgba(45,226,230,.4);border-radius:50%;
    display:flex;align-items:center;justify-content:center}
  .dock.open .bar .chev{transform:rotate(180deg)}
  /* body opens upward as an overlay so it never changes the layout height */
  .dock .body{position:absolute;left:0;right:0;bottom:calc(100% + 6px);height:0;overflow:hidden;
    transition:height .28s ease;background:inherit;border:1px solid rgba(233,53,193,.5);
    border-radius:16px;box-shadow:0 -6px 26px rgba(4,2,12,.7)}
  .dock.open .body{height:min(46dvh,360px)}
  /* pulse ring when a new delegation lands while collapsed */
  .dock.ping::after{content:"";position:absolute;inset:-3px;border-radius:19px;
    border:2px solid var(--pink);animation:dockring 1.1s ease-out 3;pointer-events:none}
  @keyframes dockring{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.055)}}
  .msg.cron{align-self:center;background:transparent;border:1px dashed rgba(143,134,173,.45);
    color:var(--muted);font-size:10.5px;padding:5px 12px}
  .msg.cron b{color:#cfc8e8}
  .feed{height:100%;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:88%;padding:7px 10px;border-radius:11px;font-size:11.5px;line-height:1.45;border:1px solid var(--line);background:var(--panel2)}
  .msg .who{font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:3px;display:flex;gap:6px;align-items:center}
  .msg .when{font-weight:400;color:var(--muted);letter-spacing:0}
  .msg.general{align-self:flex-start;border-color:rgba(255,213,46,.5)}
  .msg.general .who{color:var(--gold)}
  .msg.agent{align-self:flex-end}
  .empty-feed{color:var(--muted);font-size:11px;text-align:center;margin-top:16px}

  /* ---------- room sheet ---------- */
  .sheet-back{position:fixed;inset:0;background:rgba(4,2,10,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-back.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:520px;margin:0 auto;
    background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;
    transform:translateY(102%);transition:transform .28s ease,visibility .28s;height:74vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);visibility:hidden}
  .sheet.open{transform:translateY(0);visibility:visible}
  .sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px}
  .sheet .hd{display:flex;align-items:center;gap:12px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
  .sheet .hd .em{font-size:32px;filter:drop-shadow(0 0 8px rgba(233,53,193,.5))}
  .sheet .hd h2{margin:0;font-size:16px;letter-spacing:1px}
  .sheet .hd .st{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
  .sheet .hd .st .dot{width:7px;height:7px;border-radius:50%;background:var(--off)}
  .sheet .hd .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    width:30px;height:30px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px}
  .sheet .desc{padding:8px 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
  .sheet .chat{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  .sheet .chat .lbl{text-align:center;color:var(--muted);font-size:10px;letter-spacing:2px;margin:4px 0}
  .cmsg{max-width:86%;padding:7px 10px;border-radius:11px;font-size:11.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .cmsg.user{align-self:flex-end;background:#241a42;border:1px solid var(--line)}
  .cmsg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--acc,var(--line))}
  .cmsg .when{display:block;font-size:9px;color:var(--muted);margin-top:3px}
  /* task-centric room panel */
  .curcard{border:1px solid var(--acc,var(--line));background:rgba(255,255,255,.025);border-radius:12px;
    padding:9px 11px;font-size:11.5px;line-height:1.5}
  .curcard .lab{font-size:9px;font-weight:800;letter-spacing:2px;color:var(--acc,#aaa);margin-bottom:3px}
  .trow{border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:8px 10px;font-size:11.5px;line-height:1.45}
  .trow .meta{display:flex;gap:8px;align-items:center;font-size:9.5px;color:var(--muted);margin-bottom:3px;
    font-weight:800;letter-spacing:1px}
  .trow .rep{margin-top:5px;color:#cfc8e8;font-size:11px;border-left:2px solid var(--acc,#555);padding-left:8px}
  /* Todoist popup */
  .modal-back{position:fixed;inset:0;background:rgba(4,2,10,.62);z-index:40;display:none;
    align-items:center;justify-content:center;padding:20px}
  .modal-back.open{display:flex}
  .modal{width:100%;max-width:400px;max-height:76dvh;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 12px 40px rgba(4,2,12,.8)}
  .modal .mhd{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--line);
    font-size:14px;letter-spacing:1px;color:#ff9e3d}
  .modal .mhd .cnt{color:var(--muted);font-size:11px;font-weight:400;letter-spacing:0}
  .modal .mhd .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    width:28px;height:28px;border-radius:8px;cursor:pointer;font-family:inherit}
  .modal .mbody{overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
  .modal .mlbl{text-align:center;color:var(--muted);font-size:11px;padding:18px;letter-spacing:1px}
  .titem{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:10px;
    background:var(--panel2);border:1px solid var(--line);border-left-width:3px;font-size:12px;line-height:1.4}
  .titem .box{width:13px;height:13px;border:1.5px solid var(--muted);border-radius:50%;flex:none;margin-top:1px}
  .titem .due{display:block;color:var(--muted);font-size:10px;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AGENT VILLAGE</h1>
    <div class="conn" id="conn"><span class="led"></span><span id="connText">connecting…</span></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>
    <div class="bubble" id="bubble"></div>
    <div class="rbubble" id="rbubble"></div>
  </div>
  <div class="dock" id="dock">
    <div class="bar" id="dockBar">
      <span class="pulse"></span>
      <span class="t">VILLAGE FEED</span>
      <span class="last" id="dockLast">no delegations yet</span>
      <span class="chev">▲</span>
    </div>
    <div class="body"><div class="feed" id="feed"><div class="empty-feed">no delegations yet</div></div></div>
  </div>
</div>

<div class="modal-back" id="todoBack">
  <div class="modal" id="todoModal">
    <div class="mhd"><span>📋</span><b>TODOIST</b><span id="todoCount" class="cnt"></span>
      <button class="x" onclick="closeTodoist()">✕</button></div>
    <div class="mbody" id="todoBody"><div class="mlbl">LOADING…</div></div>
  </div>
</div>

<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="hd" id="sheetHd"></div>
  <div class="desc" id="sheetDesc"></div>
  <div class="chat" id="sheetChat"></div>
</div>

<script>
'use strict';
const stage=document.getElementById('stage');
const bg=document.getElementById('bg'), fg=document.getElementById('fg');
const bctx=bg.getContext('2d'), fctx=fg.getContext('2d');
const bubble=document.getElementById('bubble');
const rbubble=document.getElementById('rbubble');
const connEl=document.getElementById('conn'), connText=document.getElementById('connText');

/* each agent works at a station in its room; act drives the working animation */
const STATION={
  general:{xf:0.50,act:'command'}, finance:{xf:0.30,act:'count'},
  memory:{xf:0.62,act:'read'},     reminders:{xf:0.34,act:'write'},
  predictions:{xf:0.40,act:'gaze'},books:{xf:0.78,act:'read'},
  health:{xf:0.24,act:'lift'},     japanese:{xf:0.52,act:'read'},
  coding:{xf:0.18,act:'type'},
};
const replyByAgent={};   // agent id -> {content, ts} latest real reply from its thread

/* acknowledgment lines used when the agent hasn't written a real reply yet —
   deterministic per event so bubble and feed always show the same text */
const ACKS=['On it! 👍','Got it — right away.','Consider it done ✅','Roger that!',
  'Leave it to me.','Copy that — starting now.','Sure thing!','Taking care of it 🔧'];
function ackFor(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return ACKS[h%ACKS.length];}
const DONES=['Done ✅','All set!','Finished 👍','Wrapped up ✨','Task complete','Sorted!',
  'Handled it ✅','That’s done!','Complete 🎉'];
function doneFor(id){let h=7;for(const c of String(id))h=(h*33+c.charCodeAt(0))>>>0;return DONES[h%DONES.length];}
const doneBubble={};   // id -> {text, until(ms)}  completion speech bubbles
const lastDone={};     // id -> last doneResult string already shown (dedupe)

let AGENTS=[], byId={}, rooms={};
let COLLAB={active:false,members:[],task:'',ts:null}, SUBAGENTS=[];   // live collab + spawned workers
let W=0,H=0,dpr=1, spineX=0, spineW=0, spineTop=0, spineBot=0;
const seenDeleg=new Set();
const DOT_HEX={working:'#39ff88',active:'#39ff88',idle:'#ff9e3d',afk:'#4dc9ff',offline:'#4a4560'};

/* Bento floor plan: full-width bands (varied heights) split into rooms of
   varied widths with OFFSET dividers, so rooms are all different sizes yet
   tile the hull with zero empty space. hf = band height as a multiple of W. */
const BANDS=[
  {hf:0.185, cols:[['general',1.00]]},
  {hf:0.300, cols:[['memory',0.58],['finance',0.42]]},
  {hf:0.250, cols:[['predictions',0.39],['reminders',0.61]]},
  {hf:0.280, cols:[['books',0.64],['health',0.36]]},
  {hf:0.300, cols:[['japanese',0.45],['coding',0.55]]},
];

/* ============ boot ============ */
async function boot(){
  const cfg=await fetch('agents.json').then(r=>r.json()).catch(()=>null);
  AGENTS=cfg?cfg.agents:[]; byId=Object.fromEntries(AGENTS.map(a=>[a.id,{...a}]));
  try{const d=await fetch('api/agents').then(r=>r.json()); d.agents.forEach(a=>byId[a.id]={...byId[a.id],...a});}catch(e){}
  layout(); initActors();
  const relayout=()=>{layout();placeActors();};
  window.addEventListener('resize',relayout);
  window.addEventListener('orientationchange',()=>setTimeout(relayout,250));
  if(window.visualViewport)window.visualViewport.addEventListener('resize',relayout);
  requestAnimationFrame(relayout);   // second pass after the shell settles
  stage.addEventListener('click',onStageClick);
  await loadFeed();
  connectSSE();
  requestAnimationFrame(loop);
}

/* ============ layout: packed bento floor plan (fits the viewport) ============ */
let HULLX=0, HULLW=0, HULLY=0, SHAFTX=0, SHAFTW=0, SHAFTCX=0, SHAFT_TOP=0, SHAFT_BOT=0;
function layout(){
  W=stage.clientWidth;
  // the flex shell already sized the stage to exactly the leftover space —
  // just read it, so this is correct on iOS regardless of the dynamic toolbar
  const avail=Math.max(320, stage.clientHeight);
  const margin=Math.round(avail*0.022);
  HULLX=5; HULLW=W-10; HULLY=margin;
  // central lift shaft runs down the middle; rooms dock on either side of it
  SHAFTW=Math.round(W*0.09); SHAFTCX=Math.round(W/2); SHAFTX=SHAFTCX-Math.round(SHAFTW/2);
  const bandsTotal=avail-2*margin;
  const hfSum=BANDS.reduce((a,b)=>a+b.hf,0);
  rooms={};
  let y=HULLY, lastFeetY=HULLY;
  BANDS.forEach((band,bi)=>{
    const last=(bi===BANDS.length-1);
    const bh=last ? (HULLY+bandsTotal-y) : Math.round(bandsTotal*band.hf/hfSum);
    const feetY=y+bh-7; lastFeetY=feetY;
    if(band.cols.length===1){
      const id=band.cols[0][0];
      rooms[id]={x:HULLX,y,w:HULLW,h:bh,feetY,cx:HULLX+HULLW/2,side:'top',
        doorX:SHAFTCX,walkMin:HULLX+HULLW*0.10,walkMax:HULLX+HULLW*0.90,amb:{}};
    }else{
      const lid=band.cols[0][0], rid=band.cols[1][0];
      const lw=SHAFTX-HULLX, rw=(HULLX+HULLW)-(SHAFTX+SHAFTW);
      rooms[lid]={x:HULLX,y,w:lw,h:bh,feetY,cx:HULLX+lw/2,side:'L',
        doorX:SHAFTX-Math.round(lw*0.10),walkMin:HULLX+lw*0.13,walkMax:SHAFTX-lw*0.10,amb:{}};
      rooms[rid]={x:SHAFTX+SHAFTW,y,w:rw,h:bh,feetY,cx:SHAFTX+SHAFTW+rw/2,side:'R',
        doorX:SHAFTX+SHAFTW+Math.round(rw*0.10),walkMin:SHAFTX+SHAFTW+rw*0.10,walkMax:SHAFTX+SHAFTW+rw*0.87,amb:{}};
    }
    y+=bh;
  });
  SHAFT_TOP=rooms.general.feetY-4;         // lift serves from General's deck…
  SHAFT_BOT=lastFeetY+6;                    // …down to the bottom floor
  H=Math.round(y+margin);
  stage.style.height=H+'px';
  dpr=Math.min(window.devicePixelRatio||1,2);
  for(const c of [bg,fg]){c.width=W*dpr;c.height=H*dpr;}
  bctx.setTransform(dpr,0,0,dpr,0,0); fctx.setTransform(dpr,0,0,dpr,0,0);
  drawBackground();
}

/* ============ paint helpers ============ */
function R(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
function vgrad(ctx,x,y,w,h,c0,c1){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c0);g.addColorStop(1,c1);
  ctx.fillStyle=g;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
function hexRGB(hex){const n=parseInt(hex.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function dim(hex,f){const[r,g,b]=hexRGB(hex);return `rgb(${r*f|0},${g*f|0},${b*f|0})`;}
function rgba(hex,a){const[r,g,b]=hexRGB(hex);return `rgba(${r},${g},${b},${a})`;}
function neonText(ctx,s,x,y,size,color,blur){
  ctx.save();ctx.font=`800 ${size}px ui-monospace,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.fillText(s,x,y);ctx.restore();}
/* rooms stay lit regardless of status — status reads from the sign dot/label */
function litFactor(st){return st==='working'||st==='active'?1:st==='idle'?0.95:st==='afk'?0.9:0.85;}
function hash2(i,j){let h=(i*374761393+j*668265263)^(i<<7);h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ============ background: packed space-station interior ============ */
function drawBackground(){
  bctx.clearRect(0,0,W,H);
  drawSpace();
  // hull outer frame
  R(bctx,HULLX-3,HULLY-3,HULLW+6,H-HULLY-W*0.02,'#0c0820');
  bctx.strokeStyle='#2b1c47';bctx.lineWidth=3;bctx.strokeRect(HULLX-2.5,HULLY-2.5,HULLW+5,H-HULLY-W*0.02-1);
  AGENTS.forEach(a=>{const r=rooms[a.id];if(r)drawRoom(a,r);});
  drawShaft();
  // hull edge neon
  bctx.save();bctx.shadowColor='#b026ff';bctx.shadowBlur=7;
  bctx.strokeStyle='rgba(176,38,255,.5)';bctx.lineWidth=1.5;
  bctx.strokeRect(HULLX-2.5,HULLY-2.5,HULLW+5,H-HULLY-W*0.02-1);bctx.restore();
}

/* central lift shaft + a sliding door on every room's shaft-facing wall */
const DOOR_H_FRAC=0.34;   // door opening height as a fraction of walk headroom
function drawShaft(){
  const x=SHAFTX, w=SHAFTW, top=SHAFT_TOP-6, bot=SHAFT_BOT+8;
  // shaft interior
  vgrad(bctx,x,top,w,bot-top,'#0e0a1c','#080512');
  R(bctx,x,top,1.5,bot-top,'#241a3d');R(bctx,x+w-1.5,top,1.5,bot-top,'#241a3d');
  // guide rails + counterweight cable
  R(bctx,x+3,top,1.5,bot-top,'#1a1330');R(bctx,x+w-4.5,top,1.5,bot-top,'#1a1330');
  R(bctx,x+w/2-0.5,top,1,bot-top,'rgba(45,226,230,.18)');
  // floor stops + call panels at each level
  AGENTS.forEach(a=>{const r=rooms[a.id];if(!r||r.side==='top')return;
    const ly=r.feetY+3;
    R(bctx,x+2,ly,w-4,1.5,'rgba(45,226,230,.35)');           // landing line
    R(bctx,x+w/2-3,ly-4,6,2,'#1a1330');                       // call button housing
    R(bctx,x+w/2-2,ly-3.4,1.6,1.6,'rgba(57,255,136,.6)');});
  // shaft header sign + top pulley
  R(bctx,x-2,top,w+4,5,'#1a1330');R(bctx,x-2,top+5,w+4,1,'rgba(45,226,230,.4)');
  bctx.fillStyle='#4a3a6a';bctx.beginPath();bctx.arc(SHAFTCX,top+3,2.4,0,7);bctx.fill();
  // doors: an opening in each room's shaft-facing wall
  AGENTS.forEach(a=>{const r=rooms[a.id];if(!r)return;
    const dh=(r.h*0.66)*DOOR_H_FRAC+r.h*0.10, dy=r.feetY+4-dh;
    let dx;
    if(r.side==='L') dx=SHAFTX-2; else if(r.side==='R') dx=SHAFTX+SHAFTW-3; else return;
    const dw=5;
    R(bctx,dx,dy,dw,dh,'#060410');                            // dark opening
    bctx.save();bctx.shadowColor='#2de2e6';bctx.shadowBlur=5;
    R(bctx,dx,dy,dw,1.5,'#2de2e6');                            // lintel light
    R(bctx,r.side==='L'?dx:dx+dw-1.5,dy,1.5,dh,'rgba(45,226,230,.6)');
    bctx.restore();
    R(bctx,dx+dw/2-0.4,dy+1.5,0.8,dh-1.5,'rgba(45,226,230,.25)'); // door seam
  });
}

function drawSpace(){
  vgrad(bctx,0,0,W,H,'#070313','#0c0620');
  for(const[nx,ny,nr,nc] of [[W*0.15,H*0.14,W*0.55,'rgba(176,38,255,.05)'],
      [W*0.9,H*0.5,W*0.5,'rgba(45,226,230,.04)'],[W*0.2,H*0.85,W*0.5,'rgba(233,53,193,.05)']]){
    const g=bctx.createRadialGradient(nx,ny,0,nx,ny,nr);g.addColorStop(0,nc);g.addColorStop(1,'transparent');
    bctx.fillStyle=g;bctx.fillRect(0,0,W,H);}
  for(let i=0;i<130;i++){const sx=(i*89)%W,sy=(i*127)%H,big=i%12===0;
    R(bctx,sx,sy,big?1.8:1,big?1.8:1,`rgba(210,200,255,${0.10+(i%6)*0.05})`);}
  // planet arc bottom
  const pg=bctx.createRadialGradient(W/2,H+W*0.55,W*0.4,W/2,H+W*0.55,W*0.72);
  pg.addColorStop(0,'#0e3a4a');pg.addColorStop(0.8,'#155a66');pg.addColorStop(1,'#2de2e6');
  bctx.fillStyle=pg;bctx.beginPath();bctx.arc(W/2,H+W*0.55,W*0.72,0,7);bctx.fill();
}

/* ---- shared room chrome ---- */
function starWindow(x,y,w,h){
  R(bctx,x,y,w,h,'#080618');
  for(let i=0;i<Math.max(3,w/16);i++)R(bctx,x+hash2(i,x|0)*w,y+hash2(x|0,i)*h,1.3,1.3,`rgba(220,210,255,${0.35+hash2(i,3)*0.4})`);
}
function roomSign(r,name,st,neon){
  const label=name.toUpperCase(), fs=Math.max(7,Math.min(9.5,r.w*0.055));
  bctx.font=`800 ${fs}px ui-monospace,monospace`;
  const tw=bctx.measureText(label).width, sw=tw+22, sx=r.x+r.w/2-sw/2, sy=r.y+5;
  R(bctx,sx,sy,sw,fs+8,'rgba(4,2,12,.9)');
  R(bctx,sx,sy,sw,1,dim(neon,0.9));
  neonText(bctx,label,r.x+r.w/2+4,sy+(fs+8)/2+0.5,fs,neon,8);
  bctx.fillStyle=DOT_HEX[st];bctx.beginPath();bctx.arc(sx+8,sy+(fs+8)/2,2.6,0,7);bctx.fill();
}
/* ---- per-room wall materials ---- */
function wallTex(id,x,y,w,hh){
  switch(id){
    case 'general': // command hall: banner pair + gold trim rail
      for(const fx of [0.10,0.84]){R(bctx,x+w*fx,y+5,9,hh*0.55,'#b5443c');
        R(bctx,x+w*fx+2.5,y+9,4,4,'#ffd52e');
        bctx.fillStyle='#b5443c';bctx.beginPath();
        bctx.moveTo(x+w*fx,y+5+hh*0.55);bctx.lineTo(x+w*fx+4.5,y+hh*0.55+11);bctx.lineTo(x+w*fx+9,y+5+hh*0.55);bctx.fill();}
      R(bctx,x,y+hh*0.72,w,1.5,'rgba(255,213,46,.35)');break;
    case 'finance': // marble veins + pilasters
      for(let i=0;i<3;i++)R(bctx,x+4,y+hh*(0.25+i*0.22)+(i%2)*3,w-8,1,'rgba(255,255,255,.07)');
      for(const fx of [0.06,0.90]){R(bctx,x+w*fx,y+4,w*0.045,hh-6,'rgba(255,255,255,.08)');
        R(bctx,x+w*fx-2,y+4,w*0.045+4,3,'rgba(255,255,255,.12)');
        R(bctx,x+w*fx-2,y+hh-5,w*0.045+4,3,'rgba(255,255,255,.12)');}break;
    case 'memory': // dark data panels + LEDs
      for(let sx2=x+10;sx2<x+w-10;sx2+=20){R(bctx,sx2,y+5,15,hh-10,'rgba(0,0,0,.2)');
        if(hash2(sx2,3)<0.5)R(bctx,sx2+2,y+8+hash2(3,sx2)*(hh-18),2,2,hash2(sx2,9)<0.5?'#c77dff':'#4dc9ff');}break;
    case 'reminders': // wainscot rail + pinned notes
      R(bctx,x,y+hh*0.55,w,hh*0.45,'rgba(255,255,255,.05)');R(bctx,x,y+hh*0.55,w,1.5,'#6a5138');
      for(let i=0;i<3;i++)R(bctx,x+w*(0.15+i*0.3),y+hh*0.2+(i%2)*5,6,6,['#e8d05a','#e06a9a','#8fd8f0'][i]);break;
    case 'predictions': // blueprint grid
      bctx.strokeStyle='rgba(77,201,255,.10)';bctx.lineWidth=1;
      for(let gx=x+12;gx<x+w;gx+=16){bctx.beginPath();bctx.moveTo(gx,y+3);bctx.lineTo(gx,y+hh);bctx.stroke();}
      for(let gy=y+10;gy<y+hh;gy+=14){bctx.beginPath();bctx.moveTo(x+3,gy);bctx.lineTo(x+w-3,gy);bctx.stroke();}break;
    case 'books': // wooden shelving planks
      for(let gy=y+8;gy<y+hh;gy+=9)R(bctx,x+4,gy,w-8,1,'rgba(90,58,34,.5)');break;
    case 'health': // padded tiles
      for(let gx=x+8;gx<x+w-14;gx+=18)for(let gy=y+6;gy<y+hh-10;gy+=14){
        R(bctx,gx,gy,14,10,'rgba(255,255,255,.035)');R(bctx,gx+6,gy+4,2,2,'rgba(0,0,0,.25)');}break;
    case 'japanese': // vertical wood planks + paper band
      for(let gx=x+12;gx<x+w;gx+=15)R(bctx,gx,y+3,1,hh-4,'rgba(58,34,20,.4)');
      R(bctx,x+4,y+hh*0.35,w-8,hh*0.2,'rgba(240,234,216,.10)');break;
    case 'coding': // metal panels + rivets + hazard corner
      for(let gx=x+8;gx<x+w-8;gx+=30)for(const gy of [y+6,y+hh-8]){
        R(bctx,gx,gy,1.6,1.6,'rgba(255,255,255,.16)');}
      for(let i=0;i<5;i++)R(bctx,x+w-26+i*4.5,y+4+i*3,3,2,i%2?'rgba(255,213,46,.35)':'rgba(20,20,28,.6)');break;
  }
}
/* ---- per-room window shapes (stars inside) ---- */
function winStars(px,py,pw,ph){for(let i=0;i<Math.max(2,pw*ph/120);i++)
  R(bctx,px+hash2(i,px|0)*pw,py+hash2(px|0,i)*ph,1.2,1.2,`rgba(220,210,255,${0.35+hash2(i,5)*0.4})`);}
function drawWindows(id,x,y,w,wy,wh,lit,neon){
  const frame=lit>0.4?rgba(neon,0.45):'#2b1c47';
  const arch=(ax,aw)=>{bctx.save();bctx.beginPath();
    bctx.moveTo(ax,wy+wh);bctx.lineTo(ax,wy+aw/2);bctx.arc(ax+aw/2,wy+aw/2,aw/2,Math.PI,0);
    bctx.lineTo(ax+aw,wy+wh);bctx.closePath();
    bctx.fillStyle='#080618';bctx.fill();bctx.clip();winStars(ax,wy,aw,wh);bctx.restore();
    bctx.strokeStyle=frame;bctx.lineWidth=1.2;bctx.stroke();};
  const circ=(cx2,rad)=>{bctx.save();bctx.beginPath();bctx.arc(cx2,wy+wh/2,rad,0,7);
    bctx.fillStyle='#080618';bctx.fill();bctx.clip();winStars(cx2-rad,wy+wh/2-rad,rad*2,rad*2);bctx.restore();
    bctx.strokeStyle=frame;bctx.lineWidth=1.4;bctx.beginPath();bctx.arc(cx2,wy+wh/2,rad,0,7);bctx.stroke();};
  const sq=(sx2,sw2)=>{R(bctx,sx2,wy,sw2,wh,'#080618');winStars(sx2,wy,sw2,wh);
    bctx.strokeStyle=frame;bctx.lineWidth=1.2;bctx.strokeRect(sx2,wy,sw2,wh);
    R(bctx,sx2+sw2/2-0.6,wy,1.2,wh,'rgba(43,28,71,.8)');};
  switch((ROOMWIN[id]||'wide')){
    case 'arch':{const aw=Math.min(w*0.16,wh*1.1);
      for(const fx of [0.14,0.44,0.74])arch(x+w*fx,aw);break;}
    case 'round':{circ(x+w*0.30,wh*0.62);circ(x+w*0.72,wh*0.4);break;}
    case 'porthole':{circ(x+w*0.22,wh*0.44);circ(x+w*0.52,wh*0.44);circ(x+w*0.82,wh*0.44);break;}
    case 'slits':{for(let i=0;i<5;i++)sq(x+w*(0.10+i*0.18),Math.max(4,w*0.035));break;}
    case 'squares':{sq(x+w*0.16,w*0.20);sq(x+w*0.64,w*0.20);break;}
    default:{sq(x+w*0.06,w*0.88);
      for(let mx=x+w*0.06;mx<x+w*0.94;mx+=w*0.22)R(bctx,mx,wy,1,wh,'rgba(43,28,71,.8)');}
  }
}
const ROOMWIN={general:'wide',finance:'arch',memory:'slits',reminders:'squares',
  predictions:'round',books:'arch',health:'squares',japanese:'porthole',coding:'slits'};

/* ===== density layers (drawn on the bg canvas — only on status change) ===== */
function ceilingRig(x,y,w,h,neon,lit){
  R(bctx,x+3,y+3.5,w-6,2,'#191227');                                  // truss beam
  for(let bx=x+8;bx<x+w-8;bx+=9)R(bctx,bx,y+3.5,1,3.5,'#2b1c47');     // truss ticks
  R(bctx,x+4,y+3,w*0.16,3.5,'#221838');R(bctx,x+w-4-w*0.16,y+3,w*0.16,3.5,'#221838'); // corner ducts
  for(const fx of [0.24,0.5,0.76]){const hx=x+w*fx, dl=h*0.09;        // hanging fixtures
    R(bctx,hx,y+5,1,dl,'#241a3d');R(bctx,hx-2.5,y+5+dl,5,2.5,'#141020');
    if(lit>0.4){bctx.save();bctx.shadowColor=neon;bctx.shadowBlur=5;R(bctx,hx-2.5,y+5+dl,5,1,rgba(neon,0.55));bctx.restore();}}
}
function backMachinery(x,y,w,floorTop,neon,lit){
  const H=floorTop-y;
  for(const[fy,pc] of [[0.46,'#2a2038'],[0.60,'#211934']]){          // horizontal pipes
    const py=y+H*fy;R(bctx,x+4,py,w-8,2.5,pc);R(bctx,x+4,py,w-8,0.8,'rgba(255,255,255,.06)');
    for(let px=x+14;px<x+w-12;px+=24)R(bctx,px,py-1,3,4.5,'#141020');}
  bctx.strokeStyle=rgba(neon,0.14);bctx.lineWidth=1;                  // draped cable
  bctx.beginPath();bctx.moveTo(x+w*0.12,y+H*0.4);
  bctx.quadraticCurveTo(x+w*0.32,y+H*0.58,x+w*0.52,y+H*0.44);bctx.stroke();
  for(const fx of [0.14,0.86]){const gx=x+w*fx,gy=y+H*0.72;           // gauges / panels
    R(bctx,gx-4.5,gy-4,9,8,'#0d0a1a');R(bctx,gx-4.5,gy-4,9,1,'#241a3d');
    if(lit>0.4){bctx.fillStyle=rgba(neon,0.7);bctx.beginPath();bctx.arc(gx-1.5,gy,1.4,0,7);bctx.fill();
      R(bctx,gx+1,gy-2,2.5,1,rgba(neon,0.5));R(bctx,gx+1,gy+1,2,1,'rgba(120,130,160,.5)');}}
}
function floorDetail(x,floorTop,w,bottom,inset,neon,lit){
  // glowing center seam (perspective)
  bctx.strokeStyle=rgba(neon,0.18+0.2*lit);bctx.lineWidth=1.5;
  bctx.beginPath();bctx.moveTo(x+w/2,floorTop);bctx.lineTo(x+w/2,bottom);bctx.stroke();
  // intersection glow dots
  for(let ri=1;ri<4;ri++){const t=ri/4, yy=floorTop+(bottom-floorTop)*t;
    for(let ci=1;ci<5;ci++){const fx0=x+inset+((w-2*inset)/5)*ci, bx0=x+(w/5)*ci;
      const px=fx0+(bx0-fx0)*t;R(bctx,px-0.5,yy-0.5,1.5,1.5,rgba(neon,0.12+0.12*lit));}}
  // hazard chevrons across the front lip
  for(let cx2=x+inset;cx2<x+w-inset-6;cx2+=11)R(bctx,cx2,bottom-4,5,2.5,'rgba(255,213,46,.22)');
}
function foreRail(x,y,w,h,neon,lit){
  const ry=y+h-6;
  R(bctx,x+2,ry,w-4,3,'#0b0816');                                    // rail bar
  R(bctx,x+2,ry,w-4,1,rgba(neon,0.35+0.25*lit));
  for(let px=x+6;px<x+w-4;px+=Math.max(14,w*0.11))R(bctx,px,ry+3,1.5,3,'#1a1330'); // posts
}

function drawRoom(a,r){
  const st=(byId[a.id]||{}).status||'offline', lit=litFactor(st), neon=a.neon;
  const {x,y,w,h}=r;
  /* --- pseudo-3D box: back wall / ceiling cone / perspective floor / shaded side walls --- */
  const floorTop=y+h*0.66, inset=Math.min(w*0.055,12);
  // back wall + per-room material
  vgrad(bctx,x,y,w,floorTop-y,dim(neon,0.11+0.05*lit),dim(neon,0.05));
  wallTex(a.id,x,y,w,floorTop-y);
  backMachinery(x,y,w,floorTop,neon,lit);
  // per-room windows
  const wy=y+h*0.15, wh=Math.min(h*0.22,26);
  drawWindows(a.id,x,y,w,wy,wh,lit,neon);
  // ceiling fixture + light cone
  R(bctx,x,y,w,3,'#0c0818');
  ceilingRig(x,y,w,h,neon,lit);
  if(lit>0.4){
    const lw=w*0.32, lx=x+w/2-lw/2;
    bctx.save();bctx.shadowColor=neon;bctx.shadowBlur=8;R(bctx,lx,y+3,lw,2,neon);bctx.restore();
    const g=bctx.createLinearGradient(0,y+5,0,y+h);
    g.addColorStop(0,rgba(neon,0.09*lit));g.addColorStop(1,'transparent');
    bctx.fillStyle=g;bctx.beginPath();
    bctx.moveTo(lx,y+5);bctx.lineTo(lx+lw,y+5);
    bctx.lineTo(lx+lw+w*0.11,y+h);bctx.lineTo(lx-w*0.11,y+h);bctx.closePath();bctx.fill();
  }
  // perspective floor (trapezoid + converging grid)
  const fgr=bctx.createLinearGradient(0,floorTop,0,y+h);
  fgr.addColorStop(0,dim(neon,0.15+0.08*lit));fgr.addColorStop(1,dim(neon,0.06+0.04*lit));
  bctx.fillStyle=fgr;bctx.beginPath();
  bctx.moveTo(x+inset,floorTop);bctx.lineTo(x+w-inset,floorTop);
  bctx.lineTo(x+w,y+h);bctx.lineTo(x,y+h);bctx.closePath();bctx.fill();
  bctx.strokeStyle=`rgba(255,255,255,${0.03+0.045*lit})`;bctx.lineWidth=1;
  for(let i=1;i<4;i++){const t=i/4;
    bctx.beginPath();
    bctx.moveTo(x+inset*(1-t),floorTop+(y+h-floorTop)*t);
    bctx.lineTo(x+w-inset*(1-t),floorTop+(y+h-floorTop)*t);bctx.stroke();}
  for(let i=1;i<5;i++){const fx=x+inset+((w-2*inset)/5)*i, bx2=x+(w/5)*i;
    bctx.beginPath();bctx.moveTo(fx,floorTop);bctx.lineTo(bx2,y+h);bctx.stroke();}
  R(bctx,x,floorTop-1,w,1,'rgba(0,0,0,.35)');
  floorDetail(x,floorTop,w,y+h,inset,neon,lit);
  // conveyor belt track along the back of the floor (crates animate on fg)
  const beltY=floorTop+(y+h-floorTop)*0.30, beltX0=x+inset*0.6, beltX1=x+w-inset*0.6;
  R(bctx,beltX0,beltY,beltX1-beltX0,4.5,'#12101e');
  R(bctx,beltX0,beltY,beltX1-beltX0,1,rgba(neon,0.28));
  for(let bx2=beltX0+3;bx2<beltX1;bx2+=6)R(bctx,bx2,beltY+4.5,1.4,2,'#241a3d');
  r.amb.beltY=beltY;r.amb.beltX0=beltX0;r.amb.beltX1=beltX1;
  // shaded side walls (depth)
  vgrad(bctx,x,y,6,h,'rgba(0,0,0,.4)','rgba(0,0,0,.2)');
  vgrad(bctx,x+w-6,y,6,h,'rgba(0,0,0,.4)','rgba(0,0,0,.2)');
  // per-agent interior
  (INTERIORS[a.id]||(()=>{}))(r,lit,neon,r.amb);
  foreRail(x,y,w,h,neon,lit);
  /* --- beveled frame (extruded look) --- */
  R(bctx,x,y,w,2,'rgba(255,255,255,.06)');           // top edge catches light
  R(bctx,x,y+h-2,w,2,'rgba(0,0,0,.45)');             // bottom edge in shadow
  bctx.save();bctx.shadowColor=neon;bctx.shadowBlur=lit>0.4?6:0;
  bctx.strokeStyle=rgba(neon,0.55);bctx.lineWidth=1.5;bctx.strokeRect(x+0.75,y+0.75,w-1.5,h-1.5);bctx.restore();
  R(bctx,x,y,w,1,'#0a0614');R(bctx,x,y,1,h,'#0a0614');
  // corner brackets
  bctx.strokeStyle=rgba(neon,0.8);bctx.lineWidth=1.5;const c=7;
  for(const[cx,cy,sx2,sy2] of [[x+2,y+2,1,1],[x+w-2,y+2,-1,1],[x+2,y+h-2,1,-1],[x+w-2,y+h-2,-1,-1]]){
    bctx.beginPath();bctx.moveTo(cx,cy+sy2*c);bctx.lineTo(cx,cy);bctx.lineTo(cx+sx2*c,cy);bctx.stroke();}
  roomSign(r,a.name,st,neon);
}

/* ---- furniture prims ---- */
function deskP(x,y,w,h,c1,c2){R(bctx,x,y,w,3.5,c1);R(bctx,x+1,y+3.5,3,h-3.5,c2);R(bctx,x+w-4,y+3.5,3,h-3.5,c2);R(bctx,x,y+3.5,w,1,'rgba(0,0,0,.35)');}
function monP(x,y,w,h,scr,glow){R(bctx,x-1.5,y-1.5,w+3,h+3,'#0c0a18');R(bctx,x,y,w,h,scr);
  if(glow){bctx.save();bctx.shadowColor=glow;bctx.shadowBlur=7;R(bctx,x,y,w,1.5,glow);bctx.restore();}}
function shelfP(x,y,w,rows,neon){for(let ri=0;ri<rows;ri++){const yy=y+ri*9;R(bctx,x,yy+7,w,1.5,'#241a3d');
  let bx=0;while(bx<w-3){const bw2=2.4,bh2=5.5+((bx|0)%3);R(bctx,x+bx,yy+7-bh2,bw2,bh2,`hsl(${(bx*29+ri*63)%360},40%,${44+((bx|0)%3)*7}%)`);bx+=3.4;}}}

/* ---- unique interiors (fit inside the rectangle) ---- */
const INTERIORS={
  general(r,lit,neon,m){const{x,y,w,h}=r,my=y+h*0.5;
    for(let i=0;i<3;i++)R(bctx,x+w*0.08,y+h*0.44+i*5,w*0.18,2.5,i%2?'#39ff88':'#2de2e6');
    monP(x+w*0.34,y+h*0.42,w*0.12,h*0.14,'#173a5e','#4dc9ff');
    monP(x+w*0.50,y+h*0.42,w*0.11,h*0.14,'#3a1745','#e935c1');

function initActors(){
  AGENTS.forEach((a,i)=>{
    const r=rooms[a.id]; if(!r)return;
    actors[a.id]={x:r.cx+(a.id==='general'?0:(Math.random()*2-1)*r.w*0.2),dir:1,pauseT:1+Math.random()*2,targetX:null,seed:i*1.7};
  });
  walker={state:'home',x:rooms.general.cx,y:rooms.general.feetY,path:[],seg:0,task:null,facing:1};
}
function placeActors(){
  AGENTS.forEach(a=>{const r=rooms[a.id],o=actors[a.id];if(!r||!o)return;
    o.x=Math.min(Math.max(o.x,r.walkMin),r.walkMax);});
  if(walker.state==='home'){walker.x=rooms.general.cx;walker.y=rooms.general.feetY;}
}

function drawChar(ctx,cx,feetY,s,id,walking,phase,facing,glow,time,seed){
  const p=PERSONA[id]||PERSONA.general;
  const vs=s*(p.hm||1), hs=s*(p.wm||1), skin=p.skin, top=p.top, top2=p.top2||dim(top,0.75);
  ctx.fillStyle='rgba(0,0,0,.42)';ctx.beginPath();ctx.ellipse(cx,feetY+1.5,hs*3.3,s*1.05,0,0,7);ctx.fill();
  const P=(gx,gy,gw,gh,c)=>{ctx.fillStyle=c;
    ctx.fillRect(Math.round(cx+gx*hs),Math.round(feetY+gy*vs),Math.ceil(gw*hs),Math.ceil(gh*vs));};
  const legA=walking?Math.sin(phase)*1.1:0, armA=walking?Math.sin(phase)*0.9:0;
  if(glow){ctx.save();ctx.shadowColor=top;ctx.shadowBlur=9;}
  /* legs / robe */
  if(p.kimono){
    P(-2.6,-4.4,5.2,4.4,top);P(-2.6,-4.4,5.2,0.6,top2);           // robe skirt
    P(-2.8,-0.4,2,0.5,'#f0d8c0');P(0.8,-0.4,2,0.5,'#f0d8c0');     // sandals
  }else{
    P(-2.0,-3.2-Math.max(0,legA),1.7,3.2,p.pants||'#232338');
    P(0.4,-3.2-Math.max(0,-legA),1.7,3.2,p.pants||'#232338');
    P(-2.1,-0.8-Math.max(0,legA),1.9,0.8,'#11131c');P(0.3,-0.8-Math.max(0,-legA),1.9,0.8,'#11131c');
  }
  /* torso */
  P(-2.5,-7.0,5,p.kimono?2.8:4,top);
  P(-2.5,-7.0,5,0.8,top2);
  if(p.vest){P(-2.5,-7.0,1.1,4,p.vest);P(1.4,-7.0,1.1,4,p.vest);}
  if(p.tie)P(-0.4,-6.6,0.8,2.2,p.tie);
  if(p.sash)P(-2.6,-4.6,5.2,0.9,p.sash);
  if(p.strap){for(let i=0;i<5;i++)P(-2.2+i*0.95,-6.8+i*0.75,0.8,0.6,'#6a4a2c');}
  /* arms (tank top -> bare arms) */
  const armC=p.tank?skin:top;
  P(-3.3,-6.8+armA,1.0,3.4,armC);P(2.3,-6.8-armA,1.0,3.4,armC);
  P(-3.3,-3.6+armA,1.0,0.9,skin);P(2.3,-3.6-armA,1.0,0.9,skin);
  if(p.epaulettes){P(-3.4,-7.2,1.3,0.8,'#ffd52e');P(2.1,-7.2,1.3,0.8,'#ffd52e');}
  if(p.hoodie){P(-2.9,-7.4,5.8,1.1,top2);}                         // hood bunched at neck
  /* head */
  P(-2.1,-10.6,4.2,3.6,skin);
  /* hair + headgear */
  const hc=p.hairC||'#2a2a2a';
  switch(p.hat){
    case 'captain':
      P(-2.4,-11.2,4.8,1.1,'#1e2c4e');P(-2.4,-11.9,4.8,0.8,'#f5f2e8');
      P(-2.6,-10.6,5.2,0.6,'#1e2c4e');P(-0.5,-11.7,1,0.7,'#ffd52e');break;
    case 'tophat':
      P(-1.9,-14.2,3.8,3.2,'#14141c');P(-2.8,-11.2,5.6,0.7,'#14141c');
      P(-1.9,-11.6,3.8,0.5,'#8a5f36');break;
    case 'postal':
      P(-2.4,-11.4,4.8,1.3,'#d97b1e');P(facing>0?0.6:-3.6,-10.9,3,0.7,'#b56218');
      P(-0.5,-11.2,1,0.8,'#f5f2e8');break;
    case 'wizard':
      P(-3.1,-11.2,6.2,0.8,'#2a4488');
      P(-1.9,-13.4,3.8,2.4,'#3a5fb8');P(-1.1,-15.2,2.2,2,'#3a5fb8');P(-0.5,-16.4,1,1.4,'#3a5fb8');
      P(-1.2,-13,0.8,0.8,'#ffd52e');P(0.3,-14.6,0.7,0.7,'#ffd52e');break;
    default:
      if(p.hair==='bun'){P(-2.3,-11.3,4.6,1.5,hc);P(-0.8,-12.5,1.6,1.4,hc);
        P(-2.4,-10.2,0.8,1.8,hc);P(1.6,-10.2,0.8,1.8,hc);}
      else if(p.hair==='topknot'){P(-2.3,-11.2,4.6,1.4,hc);P(-0.6,-12.4,1.2,1.3,hc);}
      else P(-2.3,-11.2,4.6,1.5,hc);
  }
  if(p.phones){P(-2.7,-11.6,5.4,0.7,'#14141c');P(-3.0,-10.4,1.1,1.8,'#14141c');P(1.9,-10.4,1.1,1.8,'#14141c');
    P(-2.9,-10.1,0.9,1.2,'#2fa88a');P(2.0,-10.1,0.9,1.2,'#2fa88a');}
  /* face */
  const blink=Math.sin(time*1.1+seed*7)>0.984;
  if(!blink){P(facing>0?-1.1:-1.5,-9.6,0.85,0.9,'#17102b');P(facing>0?0.7:0.3,-9.6,0.85,0.9,'#17102b');}
  else {P(-1.3,-9.3,0.9,0.3,'#8a6a50');P(0.5,-9.3,0.9,0.3,'#8a6a50');}
  if(p.glasses){ctx.strokeStyle='#3a2a1a';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx-0.75*hs,feetY-9.2*vs,1.05*hs,0,7);ctx.stroke();
    ctx.beginPath();ctx.arc(cx+1.15*hs,feetY-9.2*vs,1.05*hs,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+0.3*hs,feetY-9.2*vs);ctx.lineTo(cx+0.1*hs,feetY-9.2*vs);ctx.stroke();}
  if(p.monocle){ctx.strokeStyle='#ffd52e';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx+(facing>0?1.1:-1.1)*hs,feetY-9.2*vs,1.05*hs,0,7);ctx.stroke();
    P(facing>0?1.6:-2.0,-8.4,0.35,1.6,'#ffd52e');}
  if(p.beard){P(-1.9,-7.6,3.8,1.5,p.beard);P(-1.3,-6.3,2.6,0.9,p.beard);}
  if(glow)ctx.restore();
}
/* two-line tag: name + status label ("Idle · 12m ago") coloured by status */
function nameTag(ctx,cx,feetY,s,name,label,stHex){
  ctx.font='700 8px ui-monospace,monospace';const nameW=ctx.measureText(name).width;
  ctx.font='600 7px ui-monospace,monospace';const labW=ctx.measureText(label||'').width;
  const w=Math.max(nameW+15,labW+10)+2, x=Math.round(cx-w/2), y=Math.round(feetY-17*s);
  ctx.fillStyle='rgba(6,3,14,.86)';rr(ctx,x,y,w,19,3.5);ctx.fill();
  ctx.fillStyle=stHex;ctx.beginPath();ctx.arc(x+7,y+6,2.2,0,7);ctx.fill();
  ctx.font='700 8px ui-monospace,monospace';ctx.fillStyle='#efeaff';ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(name,x+12,y+2.3);
  if(label){ctx.font='600 7px ui-monospace,monospace';ctx.fillStyle=stHex;ctx.textAlign='center';
    ctx.fillText(label,x+w/2,y+11);}
}
/* small "current task" chip floated above a working agent so what each agent is
   doing is readable straight off the map (not only inside the room sheet) */
function taskChip(ctx,cx,feetY,s,text,accent){
  if(!text)return;
  const t=text.length>28?text.slice(0,27)+'…':text;
  ctx.font='700 7px ui-monospace,monospace';
  const tw=Math.min(ctx.measureText(t).width,W*0.42);
  const w=tw+18, x=Math.round(cx-w/2), y=Math.round(feetY-17*s-14);
  ctx.save();ctx.shadowColor=rgba(accent,0.5);ctx.shadowBlur=5;
  ctx.fillStyle='rgba(6,3,14,.92)';rr(ctx,x,y,w,12,3);ctx.fill();ctx.restore();
  ctx.strokeStyle=rgba(accent,0.6);ctx.lineWidth=1;rr(ctx,x+0.5,y+0.5,w-1,11,3);ctx.stroke();
  ctx.fillStyle=accent;ctx.beginPath();ctx.arc(x+6,y+6,1.9,0,7);ctx.fill();
  ctx.save();rr(ctx,x,y,w,12,3);ctx.clip();
  ctx.fillStyle='#efeaff';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(t,x+11,y+6.4);ctx.restore();
}
/* lift car drawn on the fg around whoever is riding the shaft */
function drawLiftCar(cy){
  const carH=Math.max(18,W*0.048), x=SHAFTX+2, w=SHAFTW-4, y=cy-carH+7;
  R(fctx,SHAFTCX-0.5,SHAFT_TOP-6,1,Math.max(0,y-(SHAFT_TOP-6)),'rgba(180,170,220,.35)');   // cable
  fctx.fillStyle='#171125';rr(fctx,x,y,w,carH,3);fctx.fill();
  fctx.save();fctx.shadowColor='#2de2e6';fctx.shadowBlur=6;
  fctx.strokeStyle='rgba(45,226,230,.7)';fctx.lineWidth=1.2;rr(fctx,x+0.6,y+0.6,w-1.2,carH-1.2,3);fctx.stroke();fctx.restore();
  R(fctx,x+2,y+1.5,w-4,1,'#2de2e6');                                          // top light
  R(fctx,SHAFTCX-0.4,y+2,0.8,carH-4,'rgba(45,226,230,.3)');                   // door seam
}
/* canvas speech bubble (used for completion "Done!" pops above a room) */
function speechBubble(ctx,cx,baseY,text,accent,alpha){
  ctx.save();ctx.globalAlpha=alpha;
  ctx.font='700 9px ui-monospace,monospace';
  const tw=Math.min(ctx.measureText(text).width, W*0.44), pad=7, bw=tw+pad*2, bh=18;
  let x=Math.round(Math.max(HULLX+2,Math.min(HULLX+HULLW-bw-2,cx-bw/2))), y=Math.round(baseY-bh-6);
  ctx.fillStyle='#f8f4ff';rr(ctx,x,y,bw,bh,5);ctx.fill();
  ctx.fillStyle=accent;ctx.fillRect(x,y,bw,2);         // colored top accent
  ctx.fillStyle='#f8f4ff';ctx.beginPath();            // tail
  ctx.moveTo(cx-4,y+bh-0.5);ctx.lineTo(cx+4,y+bh-0.5);ctx.lineTo(cx,y+bh+5);ctx.closePath();ctx.fill();
  ctx.save();rr(ctx,x,y,bw,bh,5);ctx.clip();
  ctx.fillStyle='#17102b';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,x+bw/2,y+bh/2+1.5);ctx.restore();
  ctx.restore();
}

/* working -> walk to station and stay; idle -> gentle wander; offline -> rest */
function stepActor(a,o,dt){
  const r=rooms[a.id], st=(byId[a.id]&&byId[a.id].status)||'offline';
  const stn=STATION[a.id], stationX=r.x+r.w*((stn&&stn.xf)||0.5);
  const sp=r.w*0.55;
  o.working=(st==='working');
  o.atStation=false;
  if(o.working){
    const d=stationX-o.x; o.dir=d>=0?1:-1;
    if(Math.abs(d)>2)o.x+=Math.sign(d)*sp*dt; else {o.x=stationX;o.atStation=true;}
    o.targetX=null;o.pauseT=0;
    return;
  }
  if(o.pauseT>0){o.pauseT-=dt;return;}
  if(o.targetX==null){
    const roam=(st==='idle'||st==='active')?0.45:0.12;   // offline barely moves
    if(Math.random()<roam){o.targetX=r.walkMin+Math.random()*(r.walkMax-r.walkMin);o.dir=o.targetX>o.x?1:-1;}
    else o.pauseT=2.5+Math.random()*4;
    return;
  }
  o.x+=Math.sign(o.targetX-o.x)*sp*0.4*dt;
  if(Math.abs(o.targetX-o.x)<2){o.targetX=null;o.pauseT=2+Math.random()*4;}
}

/* small task prop drawn next to a working agent — gives each agent character */
function drawTask(ctx,id,cx,feetY,s,t,facing){
  const act=(STATION[id]||{}).act, f=facing>=0?1:-1, fx=cx+f*s*3.2;
  const P=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));};
  switch(act){
    case 'type':{ // desk terminal + blinking cursor
      P(fx-s*2,feetY-s*5,s*4,s*3.4,'#0a1a12');P(fx-s*2,feetY-s*5,s*4,s*0.7,'#39ffb4');
      if(Math.sin(t*7)>0)P(fx-s*1.4+((t*9)%(s*3)),feetY-s*4,s*0.7,s*0.7,'#39ffb4');
      P(fx-s*2.2,feetY-s*1.5,s*4.4,s*0.7,'#1b2a24');break;}
    case 'read':{ // open book held up
      ctx.save();ctx.translate(fx,feetY-s*4.4);
      P(-s*2.2,-s*0.4,s*2.1,s*2.8,'#e9e2cf');P(s*0.1,-s*0.4,s*2.1,s*2.8,'#dccdb0');
      P(-s*0.1,-s*0.6,s*0.2,s*3.1,'#7a5a3a');
      for(let i=0;i<3;i++)P(-s*1.9,s*0.2+i*s*0.7,s*1.6,s*0.22,'#9a8f7a');
      ctx.restore();break;}
    case 'lift':{ // dumbbell overhead
      const up=Math.abs(Math.sin(t*3))*s*1.4;
      P(cx-s*3,feetY-s*9-up,s*6,s*0.9,'#9aa2b5');
      P(cx-s*3.6,feetY-s*9.5-up,s*1,s*1.9,'#565d70');P(cx+s*2.6,feetY-s*9.5-up,s*1,s*1.9,'#565d70');break;}
    case 'count':{ // floating coins + calc
      for(let i=0;i<3;i++){const cy=feetY-s*5-Math.abs(Math.sin(t*2+i))*s*1.2;
        ctx.fillStyle='#ffd52e';ctx.beginPath();ctx.arc(fx+i*s*1.4,cy,s*0.8,0,7);ctx.fill();}
      break;}
    case 'gaze':{ // looking through eyepiece + star sparkle
      P(fx-s*0.5,feetY-s*7,s*1,s*2.4,'#2a2450');
      if(Math.sin(t*4)>0.2)P(fx-s*0.6+Math.sin(t)*s,feetY-s*8.5,s*0.8,s*0.8,'#cfe9ff');break;}
    case 'write':{ // clipboard + check tick
      P(fx-s*1.6,feetY-s*5.4,s*3.2,s*4,'#e9e2cf');P(fx-s*0.7,feetY-s*6,s*1.4,s*0.8,'#8a7a5a');
      for(let i=0;i<3;i++)P(fx-s*1.1,feetY-s*4.4+i*s*0.9,s*2.2*(i<2?1:0.6),s*0.28,'#9a8f7a');
      ctx.strokeStyle='#39ff88';ctx.lineWidth=1.4;ctx.beginPath();
      ctx.moveTo(fx-s*0.9,feetY-s*2.5);ctx.lineTo(fx-s*0.3,feetY-s*1.9);ctx.lineTo(fx+s*0.9,feetY-s*3.4);ctx.stroke();break;}
    case 'command':{ // holo orbit at feet
      ctx.strokeStyle=`rgba(255,213,46,${0.4+0.3*Math.sin(t*3)})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(cx,feetY-s*2,s*3.4,s*1.1,0,0,7);ctx.stroke();
      ctx.fillStyle='#ffd52e';ctx.beginPath();
      ctx.arc(cx+Math.cos(t*2)*s*3.4,feetY-s*2+Math.sin(t*2)*s*1.1,s*0.6,0,7);ctx.fill();break;}
  }
}

/* ---- ambient visits: an agent occasionally drops by a neighbour's room ---- */
let visitor=null, nextVisitAt=14+Math.random()*20;
function stepVisitor(dt,time,s){
  if(!visitor){
    if(time<nextVisitAt)return;
    const cands=AGENTS.filter(a=>a.id!=='general'
      &&(byId[a.id]||{}).status!=='offline'&&(byId[a.id]||{}).status!=='working');
    if(cands.length<1){nextVisitAt=time+20;return;}
    const va=cands[Math.floor(Math.random()*cands.length)];
    const hosts=AGENTS.filter(b=>b.id!==va.id&&(byId[b.id]||{}).status!=='offline');
    if(!hosts.length){nextVisitAt=time+20;return;}
    const hb=hosts[Math.floor(Math.random()*hosts.length)];
    const vr=rooms[va.id], hr=rooms[hb.id];
    visitor={id:va.id,host:hb.id,homeX:actors[va.id].x,seg:0,state:'out',t:0,
      x:actors[va.id].x,y:vr.feetY,facing:1,
      path:shaftRoute(vr,actors[va.id].x, hr, hr.cx+hr.w*0.12)};
    return;
  }
  const v=visitor, speed=W*0.22;
  if(v.state==='stay'){
    v.t+=dt;
    // chat dots above visitor and host
    const hr=rooms[v.host], ho=actors[v.host];
    for(const[px,py] of [[v.x,v.y-15*s],[ho?ho.x:hr.cx,hr.feetY-15*s]]){
      for(let i=0;i<3;i++){const on=Math.sin(time*4-i*0.9)>0;
        fctx.fillStyle=on?'rgba(239,234,255,.85)':'rgba(239,234,255,.25)';
        fctx.fillRect(px-4+i*4,py,2.2,2.2);}}
    if(v.t>4){v.state='back';v.seg=0;
      v.path=shaftRoute(rooms[v.host],v.x, rooms[v.id], v.homeX);}
    return;
  }
  const tgt=v.path[v.seg];
  const dx=tgt.x-v.x, dy=tgt.y-v.y, dist=Math.hypot(dx,dy), step=speed*dt;
  if(dist<=step){v.x=tgt.x;v.y=tgt.y;v.seg++;
    if(v.seg>=v.path.length){
      if(v.state==='out'){v.state='stay';v.t=0;}
      else{actors[v.id].x=v.x;visitor=null;nextVisitAt=time+25+Math.random()*35;}
    }
  }else{v.x+=dx/dist*step;v.y+=dy/dist*step;if(Math.abs(dx)>1)v.facing=dx>0?1:-1;}
}

/* Build a wall-respecting route: exit source room via its door -> ride the
   central lift -> enter target room via its door -> approach a spot inside it.
   Horizontal moves stay within a room or the shaft; vertical moves only in the
   shaft — so agents never cut through walls. */
function shaftRoute(fromRoom, fromX, toRoom, toX){
  const p=[];
  if(fromRoom.side!=='top' && Math.abs(fromX-fromRoom.doorX)>1) p.push({x:fromRoom.doorX,y:fromRoom.feetY});
  p.push({x:SHAFTCX,y:fromRoom.feetY});            // step into the lift
  if(Math.abs(fromRoom.feetY-toRoom.feetY)>1) p.push({x:SHAFTCX,y:toRoom.feetY}); // ride
  if(toRoom.side!=='top') p.push({x:toRoom.doorX,y:toRoom.feetY});               // step out the door
  p.push({x:toX,y:toRoom.feetY});                  // approach the spot
  return p;
}
function planWalk(ev){
  const tr=rooms[ev.to]; if(!tr)return false;
  walker.path=shaftRoute(rooms.general, walker.x, tr, tr.cx);
  walker.seg=0;walker.state='out';walker.task=ev;
  return true;
}
function stepWalker(dt){
  const speed=W*0.30;
  if(walker.state==='home'){
    const o=actors.general, r=rooms.general;
    stepActor({id:'general'},o,dt);
    walker.x=o.x;walker.y=r.feetY;
    if(walkQueue.length)planWalk(walkQueue.shift());
    return;
  }
  if(walker.state==='visit'){
    walker.t-=dt;
    if(walker.t<=0){
      const tr=rooms[walker.task.to];
      walker.path=shaftRoute(tr, walker.x, rooms.general, rooms.general.cx);
      walker.seg=0;walker.state='back';
    }
    return;
  }
  const tgt=walker.path[walker.seg];
  const dx=tgt.x-walker.x, dy=tgt.y-walker.y, dist=Math.hypot(dx,dy);
  const step=speed*dt*(Math.abs(dy)>1?1.5:1);
  if(dist<=step){
    walker.x=tgt.x;walker.y=tgt.y;walker.seg++;
    if(walker.seg>=walker.path.length){
      if(walker.state==='out'){walker.state='visit';walker.t=3.2;arriveFx={x:walker.x,y:walker.y,t:0};}
      else{walker.state='home';walker.task=null;actors.general.x=walker.x;}
    }
  }else{
    walker.x+=dx/dist*step;walker.y+=dy/dist*step;
    if(Math.abs(dx)>1)walker.facing=dx>0?1:-1;
  }
}

/* ============ ambient animation (fg) ============ */
const CRATE_COLS=['#4dc9ff','#ffd52e','#ff7847','#39ff88','#e935c1'], CRATE_HI='rgba(255,255,255,.25)';
function drawAmbient(t,s){
  const A=id=>((byId[id]||{}).status)||'offline';
  // twinkling stars
  for(let i=0;i<9;i++){
    const sx=(i*151)%W, sy=(i*211)%H;
    const al=0.2+0.5*Math.max(0,Math.sin(t*1.4+i*2.6));
    fctx.fillStyle=`rgba(220,210,255,${al})`;fctx.fillRect(sx,sy,1.6,1.6);}
  // drifting satellite
  const satX=((t*9)%(W+60))-30, satY=H*0.055+Math.sin(t*0.4)*4;
  R(fctx,satX,satY,7,3,'#8f86ad');R(fctx,satX-4,satY+0.5,4,2,'#4dc9ff');R(fctx,satX+7,satY+0.5,4,2,'#4dc9ff');
  // shooting star (short life each ~9s)
  const ph=(t%9)/9;
  if(ph<0.08){const k=ph/0.08, mx=W*0.15+k*W*0.5, my=H*0.06+k*H*0.05;
    fctx.strokeStyle=`rgba(255,255,255,${0.7*(1-k)})`;fctx.lineWidth=1.2;
    fctx.beginPath();fctx.moveTo(mx,my);fctx.lineTo(mx-14,my-5);fctx.stroke();}
  AGENTS.forEach(a=>{
    const r=rooms[a.id]; if(!r)return;
    const st=A(a.id); if(litFactor(st)<0.3)return;
    const m=r.amb||{};
    // conveyor crates gliding along the back belt (faster when the agent works)
    if(m.beltY!=null){
      const bw=m.beltX1-m.beltX0, n=Math.max(2,Math.floor(bw/42));
      const spd=(st==='working')?22:9;
      const cols=CRATE_COLS;
      for(let i=0;i<n;i++){
        const px=m.beltX0+((t*spd+i*bw/n)%bw);
        fctx.fillStyle=cols[i%cols.length];fctx.fillRect(px,m.beltY-3.6,4.6,3.6);
        fctx.fillStyle=CRATE_HI;fctx.fillRect(px,m.beltY-3.6,4.6,0.9);
      }
    }
    switch(a.id){
      case 'general':{
        if(m.radarX){fctx.strokeStyle=`rgba(255,213,46,${0.4+0.2*Math.sin(t*2)})`;fctx.lineWidth=1;
          fctx.beginPath();fctx.ellipse(m.radarX,m.radarY,m.radarR,m.radarR*0.45,0,t*1.5,t*1.5+4.6);fctx.stroke();}
        if(m.beaconX&&Math.sin(t*2.6)>0.3){fctx.save();fctx.shadowColor='#ff4d6d';fctx.shadowBlur=7;
          R(fctx,m.beaconX-1.5,m.beaconY,3,3,'#ff4d6d');fctx.restore();}
        break;}
      case 'finance':{
        if(m.tickX){const k=(t*22)%m.tickW;
          fctx.fillStyle='rgba(57,255,136,.8)';fctx.fillRect(m.tickX+k,m.tickY,3,1.6);
          fctx.fillStyle='rgba(57,255,136,.35)';fctx.fillRect(m.tickX,m.tickY+5,m.tickW*(0.4+0.3*Math.sin(t*1.2)),1.4);}
        break;}
      case 'memory':{
        if(m.coreX){const pl=0.35+0.3*Math.sin(t*2.4);
          fctx.fillStyle=`rgba(199,125,255,${pl})`;
          fctx.fillRect(m.coreX-2.5,m.coreY+((t*18)%m.coreH),5,7);}
        break;}
      case 'reminders':{
        if(m.clockX){
          fctx.strokeStyle='#efeaff';fctx.lineWidth=2;
          fctx.beginPath();fctx.moveTo(m.clockX,m.clockY);
          fctx.lineTo(m.clockX+Math.cos(t*0.05)*m.clockR*0.5,m.clockY+Math.sin(t*0.05)*m.clockR*0.5);fctx.stroke();
          fctx.strokeStyle='#ff9e3d';fctx.lineWidth=1.2;
          fctx.beginPath();fctx.moveTo(m.clockX,m.clockY);
          fctx.lineTo(m.clockX+Math.cos(t*0.9-1.57)*m.clockR*0.74,m.clockY+Math.sin(t*0.9-1.57)*m.clockR*0.74);fctx.stroke();}
        if(m.todoTapX){ // blinking "tap" cursor on the Todoist terminal
          const bl=0.4+0.6*Math.max(0,Math.sin(t*3));
          fctx.fillStyle=`rgba(255,158,61,${bl})`;fctx.beginPath();fctx.arc(m.todoTapX,m.todoTapY,2.2,0,7);fctx.fill();}
        break;}
      case 'predictions':{
        if(m.orbX){const ang=t*1.9;
          fctx.fillStyle='rgba(190,220,255,.9)';
          fctx.beginPath();fctx.arc(m.orbX+Math.cos(ang)*4,m.orbY+Math.sin(ang)*2.6,1.3,0,7);fctx.fill();}
        break;}
      case 'books':{
        if(m.lampX){fctx.fillStyle=`rgba(255,213,46,${0.10+0.05*Math.sin(t*7)+0.03*Math.sin(t*13)})`;
          fctx.beginPath();fctx.arc(m.lampX,m.lampY,11,0,7);fctx.fill();}
        break;}
      case 'health':{
        if(m.beltX)for(let i=0;i<3;i++){const off=((t*26)+i*m.beltW/3)%m.beltW;
          R(fctx,m.beltX+off,m.beltY+1,4,1.5,'rgba(255,255,255,.4)');}
        if(m.vitX){const k=(t*30)%m.vitW;
          fctx.strokeStyle='rgba(57,255,136,.8)';fctx.lineWidth=1;
          fctx.beginPath();fctx.moveTo(m.vitX+k-6,m.vitY);
          fctx.lineTo(m.vitX+k-3,m.vitY-4);fctx.lineTo(m.vitX+k,m.vitY+3);fctx.lineTo(m.vitX+k+3,m.vitY);fctx.stroke();}
        if(m.ringCx){const an=t*0.8;
          fctx.fillStyle='rgba(255,77,109,.8)';
          fctx.beginPath();fctx.arc(m.ringCx+Math.cos(an)*m.ringW,m.ringCy+Math.sin(an)*m.ringH,2,0,7);fctx.fill();}
        break;}
      case 'japanese':{
        if(m.lanY)for(const lx of [m.lanL,m.lanR]){
          const sw=Math.sin(t*1.7+lx)*2;
          fctx.fillStyle='#e07040';fctx.fillRect(lx+sw-2.5,m.lanY,5,7);
          fctx.fillStyle='#3a2a1c';fctx.fillRect(lx+sw-1,m.lanY-2,2,2);
          fctx.fillStyle='rgba(255,160,90,.15)';fctx.beginPath();fctx.arc(lx+sw,m.lanY+4,7,0,7);fctx.fill();}
        break;}
      case 'coding':{
        if(m.curX&&Math.sin(t*6)>0)R(fctx,m.curX+((t*10)%14),m.curY,2.5,2.5,'#39ffb4');
        if(m.reacX){const pl=0.5+0.3*Math.sin(t*3);
          fctx.save();fctx.shadowColor='#39ffb4';fctx.shadowBlur=12;
          fctx.fillStyle=`rgba(57,255,180,${pl})`;
          fctx.beginPath();fctx.arc(m.reacX,m.reacY,m.reacR*(0.8+0.15*Math.sin(t*3)),0,7);fctx.fill();fctx.restore();}
        if(m.nozzles)for(const[nx,ny] of m.nozzles){
          const fl=0.5+0.4*Math.sin(t*11+nx);
          fctx.fillStyle=`rgba(45,226,230,${0.5*fl})`;
          fctx.beginPath();fctx.moveTo(nx-5,ny);fctx.lineTo(nx+5,ny);fctx.lineTo(nx,ny+9+5*fl);fctx.closePath();fctx.fill();
          fctx.fillStyle=`rgba(255,255,255,${0.5*fl})`;
          fctx.beginPath();fctx.moveTo(nx-2,ny);fctx.lineTo(nx+2,ny);fctx.lineTo(nx,ny+5+3*fl);fctx.closePath();fctx.fill();}
        break;}
    }
  });
}

/* ============ frame loop ============ */
let lastT=0;
function loop(ts){
  const time=ts/1000, dt=Math.min(0.05,(ts-lastT)/1000||0.016); lastT=ts;
  fctx.clearRect(0,0,W,H);
  const s=Math.max(2.6,W*0.0078);

  drawAmbient(time,s);

  stepVisitor(dt,time,s);
  if(visitor){ // draw the travelling visitor (skipped in the normal loop below)
    const va=byId[visitor.id]||{};
    const vmoving=visitor.state!=='stay';
    const vInShaft=vmoving&&Math.abs(visitor.x-SHAFTCX)<SHAFTW*0.6;
    const vbob=(vmoving&&!vInShaft)?Math.abs(Math.sin(time*9))*1.3:0;
    if(vInShaft)drawLiftCar(visitor.y);
    drawChar(fctx,visitor.x,visitor.y-vbob,s,visitor.id,vmoving&&!vInShaft,time*11,visitor.facing,false,time,3.1);
    nameTag(fctx,visitor.x,visitor.y-vbob,s,va.name||visitor.id,va.statusLabel||'',DOT_HEX[va.status||'idle']);
  }
  AGENTS.forEach(a=>{
    if(a.id==='general')return;
    if(visitor&&a.id===visitor.id)return;
    const info=byId[a.id]||{}, st=info.status||'offline';
    const o=actors[a.id], r=rooms[a.id]; if(!o||!r)return;
    stepActor(a,o,dt);
    const working=o.working&&o.atStation;
    const moving=!o.working&&o.targetX!=null;
    const bob=(moving?Math.abs(Math.sin(time*9+o.seed))*1.4:0)+(working?Math.sin(time*4+o.seed)*0.6:0);
    if(st==='offline')fctx.globalAlpha=0.55;
    drawChar(fctx,o.x,r.feetY-bob,s,a.id,moving,time*11+o.seed,o.dir,st==='working',time,o.seed);
    if(working)drawTask(fctx,a.id,o.x,r.feetY-bob,s,time,o.dir);
    nameTag(fctx,o.x,r.feetY-bob,s,a.name,info.statusLabel||'',DOT_HEX[st]);
    // current task readable on the map (only while working, and not while a
    // completion bubble is up for this agent)
    if(working && info.currentTask && !(doneBubble[a.id]&&ts<doneBubble[a.id].until))
      taskChip(fctx,o.x,r.feetY-bob,s,info.currentTask,a.neon||'#39ff88');
    fctx.globalAlpha=1;
    // completion bubble (skip if General is here delivering — his reply bubble covers it)
    const db=doneBubble[a.id];
    if(db && ts<db.until && !(walker.state==='visit'&&walker.task&&walker.task.to===a.id)){
      const left=db.until-ts, al=Math.min(1,left/500);
      speechBubble(fctx,o.x,r.feetY-bob-19*s,db.text,a.neon||'#39ff88',al);
    } else if(db && ts>=db.until) delete doneBubble[a.id];
  });

  stepWalker(dt);
  const moving=walker.state==='out'||walker.state==='back';
  const inShaft=moving&&Math.abs(walker.x-SHAFTCX)<SHAFTW*0.6;
  const wbob=inShaft?0:(moving?Math.abs(Math.sin(time*10))*1.5:0);
  if(inShaft)drawLiftCar(walker.y);                 // draw the car around the rider
  drawChar(fctx,walker.x,walker.y-wbob,s*1.1,'general',moving&&!inShaft,time*11,walker.facing,true,time,0.3);
  {const gi=byId.general||{};nameTag(fctx,walker.x,walker.y-wbob,s*1.1,'General',gi.statusLabel||'',DOT_HEX[gi.status||'active']);}

  if(arriveFx){arriveFx.t+=dt;const k=arriveFx.t/0.6;
    if(k<1){fctx.strokeStyle=`rgba(233,53,193,${1-k})`;fctx.lineWidth=2;
      fctx.beginPath();fctx.arc(arriveFx.x,arriveFx.y-6*s,k*28,0,7);fctx.stroke();}
    else arriveFx=null;}

  // General's task bubble (while travelling / delivering)
  if(walker.task&&walker.state!=='home'){
    bubble.textContent=walker.task.reason||('→ '+((byId[walker.task.to]||{}).name||walker.task.to));
    bubble.classList.add('show');
    bubble.style.left=walker.x+'px';bubble.style.top=(walker.y-wbob-15*s)+'px';
  } else bubble.classList.remove('show');

  // Target agent's reply bubble — a "typing" beat, then its reply.
  // Real reply from its thread only if newer than this delegation; otherwise a
  // proper acknowledgment (never echo the task text back).
  if(walker.state==='visit'&&walker.task){
    const to=walker.task.to, tr=rooms[to], toInfo=byId[to]||{};
    const dwell=3.2-walker.t;                 // seconds since arrival
    if(tr&&dwell>0.35){
      const rb=replyByAgent[to];
      const real=(rb&&rb.ts>walker.task.ts)?rb.content:null;
      const txt=dwell<0.95 ? '…' : (real||ackFor(walker.task.id));
      const ax=(actors[to]&&actors[to].x)||tr.cx;
      rbubble.textContent=txt;
      rbubble.style.background=toInfo.neon||'#39ff88';
      rbubble.style.color='#0a0614';
      rbubble.classList.add('show');
      rbubble.style.left=ax+'px';rbubble.style.top=(tr.feetY-16*s)+'px';
      if(!real&&!walker._fetchedReply){walker._fetchedReply=true;loadFeed();}
    } else rbubble.classList.remove('show');
  } else {rbubble.classList.remove('show');if(walker.state!=='visit')walker._fetchedReply=false;}

  requestAnimationFrame(loop);
}

/* ============ data / SSE ============ */
let _agentsSig='', _pingT=null;
function applyAgents(list){
  list.forEach(a=>{
    const prev=(byId[a.id]||{}).status;
    byId[a.id]={...byId[a.id],...a};
    if(a.id==='general')return;
    // Completion bubble = the real TLDR. If General emitted [[done: agent | …]]
    // the backend hands us the actual result, so pop it the moment we first see
    // it (deduped) — no waiting on the working window. Otherwise fall back to an
    // inferred "just finished" bubble on the working→idle transition.
    if(a.doneResult && lastDone[a.id]!==a.doneResult){
      lastDone[a.id]=a.doneResult;
      const txt=a.doneResult;
      doneBubble[a.id]={text:txt.length>58?txt.slice(0,56)+'…':txt, until:performance.now()+7500};
    }else if(!a.doneResult && prev==='working' && a.status && a.status!=='working'){
      const rb=replyByAgent[a.id];
      const txt=(rb&&rb.ts>Date.now()/1000-900)?rb.content:doneFor(a.id+(a.currentTask||''));
      doneBubble[a.id]={text:txt.length>58?txt.slice(0,56)+'…':txt, until:performance.now()+6500};
    }
    if(!a.doneResult)lastDone[a.id]=undefined;   // reset once the marker ages out
  });
  drawBackground();
  // refresh the feed when statuses/tasks change (covers cron runs appearing)
  const sig=list.map(a=>a.id+a.status+(a.currentTask||'')).join('|');
  if(sig!==_agentsSig){_agentsSig=sig;loadFeed();}
}
function dockPing(){
  if(dock.classList.contains('open'))return;
  dock.classList.remove('ping');void dock.offsetWidth;
  dock.classList.add('ping');
  clearTimeout(_pingT);_pingT=setTimeout(()=>dock.classList.remove('ping'),3600);
}
function handleDelegations(list){let fresh=false;
  list.forEach(d=>{if(seenDeleg.has(d.id))return;seenDeleg.add(d.id);walkQueue.push(d);fresh=true;});
  if(fresh){loadFeed();dockPing();}
}
function connectSSE(){
  const es=new EventSource('api/agents/stream');
  es.addEventListener('open',()=>setConn(true));
  es.addEventListener('error',()=>setConn(false));
  es.addEventListener('agents',e=>{const d=JSON.parse(e.data);
    if(d.collab)COLLAB=d.collab; if(d.subagents)SUBAGENTS=d.subagents;
    applyAgents(d.agents);});
  es.addEventListener('delegations',e=>handleDelegations(JSON.parse(e.data).delegations));
}
function setConn(l){connEl.classList.toggle('live',l);connText.textContent=l?'live':'reconnecting…';}

/* ============ village feed dock ============ */
const dock=document.getElementById('dock'), feedEl=document.getElementById('feed'), dockLast=document.getElementById('dockLast');
document.getElementById('dockBar').addEventListener('click',()=>dock.classList.toggle('open'));
function rel(ts){if(!ts)return'';const d=Date.now()/1000-ts;
  if(d<60)return'now';if(d<3600)return `${d/60|0}m ago`;if(d<86400)return `${d/3600|0}h ago`;return `${d/86400|0}d ago`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function loadFeed(){
  try{
    const d=await fetch('api/feed').then(r=>r.json());
    const feed=d.feed||[];
    if(!feed.length){feedEl.innerHTML='<div class="empty-feed">no delegations yet</div>';return;}
    feed.forEach(ev=>{seenDeleg.add(ev.id);
      if(ev.reply)replyByAgent[ev.to]={content:ev.reply.content,ts:ev.reply.ts};});
    // feed mirrors the speech bubbles: General's task line + the agent's reply
    // (real reply if it exists, otherwise the same acknowledgment shown on screen)
    feedEl.innerHTML=feed.map(ev=>{
      const to=byId[ev.to]||{name:ev.to,emoji:'',neon:'#e935c1'};
      if(ev.type==='cron')  // cron run: single system line — what ran, not results
        return `<div class="msg cron">⏰ <b>${to.emoji} ${esc((to.name||'').toUpperCase())}</b> ran <b>${esc(ev.reason)}</b> · ${rel(ev.ts)}</div>`;
      const replyTxt=ev.reply?ev.reply.content:ackFor(ev.id);
      const replyTs=ev.reply?ev.reply.ts:ev.ts;
      return `<div class="msg general"><div class="who">⚙️ GENERAL → ${to.emoji} ${esc((to.name||'').toUpperCase())} <span class="when">${rel(ev.ts)}</span></div>${esc(ev.reason||'delegated a task')}</div>`
        +`<div class="msg agent" style="border-color:${to.neon}66"><div class="who" style="color:${to.neon}">${to.emoji} ${esc((to.name||'').toUpperCase())} <span class="when">${rel(replyTs)}</span></div>${esc(replyTxt)}</div>`;
    }).join('');
    const last=feed.slice().reverse().find(e=>e.type!=='cron')||feed[feed.length-1];
    dockLast.textContent=last.type==='cron'
      ? `⏰ ${(byId[last.to]||{}).name||last.to} ran ${last.reason||''}`
      : `General → ${(byId[last.to]||{}).name||last.to}: ${last.reason||''}`;
    feedEl.scrollTop=feedEl.scrollHeight;
  }catch(e){}
}

/* ============ room sheet ============ */
const sheet=document.getElementById('sheet'), sheetBack=document.getElementById('sheetBack');
const sheetHd=document.getElementById('sheetHd'), sheetDesc=document.getElementById('sheetDesc'), sheetChat=document.getElementById('sheetChat');
function onStageClick(e){
  const rect=stage.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(W/rect.width), y=(e.clientY-rect.top)*(H/rect.height);
  // Todoist terminal in the Reminders room takes priority over the room sheet
  const tr=(rooms.reminders||{}).amb&&rooms.reminders.amb.todoRect;
  if(tr&&x>=tr.x-3&&x<=tr.x+tr.w+3&&y>=tr.y-3&&y<=tr.y+tr.h+3){openTodoist();return;}
  for(const a of AGENTS){const r=rooms[a.id];if(!r)continue;
    if(x>=r.x-4&&x<=r.x+r.w+4&&y>=r.y-6&&y<=r.y+r.h+6){openSheet(a.id);return;}}
}
/* ---- Todoist popup ---- */
const todoBack=document.getElementById('todoBack'),todoBody=document.getElementById('todoBody'),todoCount=document.getElementById('todoCount');
const PRI_COL={4:'#e05555',3:'#ff9e3d',2:'#4dc9ff',1:'#8f86ad'};
async function openTodoist(){
  todoBack.classList.add('open');todoCount.textContent='';
  todoBody.innerHTML='<div class="mlbl">LOADING…</div>';
  try{
    const d=await fetch('api/todoist').then(r=>r.json());
    if(!d.ok){todoBody.innerHTML=`<div class="mlbl">${esc(d.error||'Could not load Todoist')}</div>`;return;}
    todoCount.textContent=`${d.count} task${d.count===1?'':'s'}`;
    todoBody.innerHTML=(d.items&&d.items.length)?d.items.map(t=>{
      const c=PRI_COL[t.priority]||'#8f86ad';
      return `<div class="titem" style="border-left-color:${c}">
        <span class="box" style="border-color:${c}"></span>
        <span>${esc(t.content)}${t.due?`<span class="due">📅 ${esc(t.due)}</span>`:''}</span></div>`;
    }).join(''):'<div class="mlbl">🎉 No tasks — all clear!</div>';
  }catch(e){todoBody.innerHTML='<div class="mlbl">Failed to load Todoist</div>';}
}
function closeTodoist(){todoBack.classList.remove('open');}
todoBack.addEventListener('click',e=>{if(e.target===todoBack)closeTodoist();});
async function openSheet(id){
  const a=byId[id]||{};
  const last=a.lastActive?new Date(a.lastActive*1000).toLocaleString():'—';
  sheetHd.innerHTML=`<span class="em">${a.emoji||''}</span>
    <div><h2>${esc(a.name||id)}</h2>
    <div class="st"><span class="dot" style="background:${DOT_HEX[a.status]||'#4a4560'};box-shadow:0 0 6px ${DOT_HEX[a.status]||'transparent'}"></span>${esc(a.statusLabel||'')} · last: ${esc(last)}</div></div>
    <button class="x" onclick="closeSheet()">✕</button>`;
  sheetDesc.innerHTML=`<div style="opacity:.7">${esc(a.description||'')}</div>`;
  sheetChat.innerHTML='<div class="lbl">LOADING…</div>';
  sheet.classList.add('open');sheetBack.classList.add('open');
  let feed=[], cronMap={};
  try{
    const[f,c]=await Promise.all([
      fetch('api/feed?limit=40').then(r=>r.json()),
      fetch('api/cron').then(r=>r.json())]);
    feed=f.feed||[];cronMap=c.cron||{};
  }catch(e){}
  const acc=a.neon||'#8f86ad';
  const relF=ts=>{if(!ts)return'';const d=ts-Date.now()/1000;
    if(d<=0)return rel(ts);if(d<3600)return `in ${d/60|0}m`;if(d<86400)return `in ${d/3600|0}h`;return `in ${d/86400|0}d`;};
  const myCron=cronMap[id]||[];
  // Cron lives in its OWN section (schedule + next + last run) — kept separate
  // from the delegated-task history below.
  const schedHtml=myCron.length?'<div class="lbl" style="margin-top:2px">⏰ CRON JOBS</div>'+
    myCron.map(j=>`<div class="trow" style="--acc:${acc}">
      <div class="meta"><span style="color:${acc}">⏰ ${esc(j.name.toUpperCase())}</span>
      ${j.running?'<span style="color:#39ff88">RUNNING</span>':(j.enabled?'':'<span style="color:#8f86ad">OFF</span>')}</div>
      <b>${esc(j.schedule||'—')}</b>${j.next?` · next ${relF(j.next)}`:''}${j.last?` · ran ${rel(j.last)}`:''}</div>`).join(''):'';
  const row=ev=>{
    const to=byId[ev.to]||{name:ev.to,emoji:'',neon:acc};
    if(ev.type==='cron')
      return `<div class="trow" style="--acc:${to.neon}">
        <div class="meta"><span style="color:${to.neon}">⏰ ${to.emoji} ${esc((to.name||'').toUpperCase())}</span><span>${rel(ev.ts)}</span></div>
        ran <b>${esc(ev.reason)}</b></div>`;
    const replyTxt=ev.reply?ev.reply.content:ackFor(ev.id);
    return `<div class="trow" style="--acc:${to.neon}">
      <div class="meta"><span style="color:${to.neon}">→ ${to.emoji} ${esc((to.name||'').toUpperCase())}</span><span>${rel(ev.ts)}</span></div>
      ${esc(ev.reason||'delegated a task')}
      <div class="rep">${esc(replyTxt)}</div></div>`;
  };
  if(a.isHub){
    // General: his cron + delegation log (delegations only; cron sits above).
    const log=feed.filter(ev=>ev.type!=='cron');   // ascending (oldest first)
    sheetChat.innerHTML=schedHtml+'<div class="lbl" style="margin-top:6px">DELEGATION LOG</div>'+
      (log.length?log.map(row).join(''):'<div class="lbl">NO DELEGATIONS YET</div>');
  }else{
    // Agent: current task + cron section + delegated-task history (no cron mixed in)
    const mine=feed.filter(ev=>ev.to===id && ev.type!=='cron');   // ascending
    const curEv=mine[mine.length-1];                  // newest
    const working=a.status==='working';
    const curHtml=`<div class="curcard" style="--acc:${acc}">
      <div class="lab" style="color:${acc}">CURRENT TASK</div>
      ${working
        ? esc(a.currentTask||(curEv&&curEv.reason)||'Working on a task')
          +(curEv&&curEv.reply?`<div class="rep" style="--acc:${acc};margin-top:5px">${esc(curEv.reply.content)}</div>`:'')
        : (a.doneResult
          ? `<span style="color:${acc}">✅ Just finished</span><div class="rep" style="--acc:${acc};margin-top:5px">${esc(a.doneResult)}</div>`
          : `<span style="color:#8f86ad">Nothing right now — ${esc(a.statusLabel||'idle')}</span>`)}
    </div>`;
    const hist=mine.filter(ev=>!(working&&curEv&&ev.id===curEv.id));
    sheetChat.innerHTML=curHtml+schedHtml+
      '<div class="lbl" style="margin-top:8px">TASK HISTORY</div>'+
      (hist.length?hist.map(row).join(''):'<div class="lbl">NO TASKS YET</div>');
  }
  sheetChat.scrollTop=sheetChat.scrollHeight;   // most recent visible at the bottom
}
function closeSheet(){sheet.classList.remove('open');sheetBack.classList.remove('open');}
sheetBack.addEventListener('click',closeSheet);

boot();
</script>
