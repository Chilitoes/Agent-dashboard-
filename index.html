<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Agent Village</title>
<style>
  :root{
    --bg0:#05030d; --bg1:#120a24; --ink:#efeaff; --muted:#8f86ad;
    --panel:#150f26; --panel2:#1e1536; --line:#332552;
    --pink:#e935c1; --purple:#b026ff; --cyan:#2de2e6; --gold:#ffd52e;
    --ok:#39ff88; --idle:#ff9e3d; --afk:#4dc9ff; --off:#4a4560;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:
    radial-gradient(120% 60% at 50% -5%,#1c0f38 0%,transparent 60%),
    radial-gradient(130% 90% at 50% 100%,#140b28 0%,var(--bg0) 60%),var(--bg0);
    color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:none}
  .wrap{max-width:520px;margin:0 auto;padding:12px 10px calc(118px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:10px}
  h1{font-size:19px;margin:0;letter-spacing:6px;color:var(--gold);font-weight:800;
    text-shadow:0 0 14px rgba(255,213,46,.65),2px 2px 0 #000}
  .conn{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;gap:6px;align-items:center;font-size:10px;color:var(--muted)}
  .conn .led{width:8px;height:8px;border-radius:50%;background:var(--off)}
  .conn.live .led{background:var(--ok);box-shadow:0 0 9px var(--ok)}

  .stage{position:relative;width:100%}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #bg{z-index:1}#fg{z-index:2}
  .stage::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:4px;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px),
      radial-gradient(120% 100% at 50% 45%,transparent 58%,rgba(3,2,10,.5) 100%)}
  .bubble{position:absolute;transform:translate(-50%,-100%);background:#f8f4ff;color:#17102b;
    font-size:11px;font-weight:700;padding:5px 9px;border-radius:9px;white-space:nowrap;max-width:230px;
    overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 16px rgba(233,53,193,.6);opacity:0;transition:opacity .2s;
    pointer-events:none;z-index:6}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:#f8f4ff;border-bottom:0}
  .bubble.show{opacity:1}
  /* agent's reply bubble (colored, points down from the agent) */
  .rbubble{position:absolute;transform:translate(-50%,-100%);color:#0a0614;
    font-size:11px;font-weight:700;padding:5px 9px;border-radius:9px;white-space:nowrap;max-width:210px;
    overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s;pointer-events:none;z-index:6;
    background:#39ff88;box-shadow:0 0 14px rgba(57,255,136,.5)}
  .rbubble::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:inherit;border-bottom:0}
  .rbubble.show{opacity:1}

  /* ---------- village feed dock (floating pill) ---------- */
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
    z-index:20;width:calc(100% - 20px);max-width:500px;
    background:linear-gradient(180deg,rgba(26,16,46,.97),rgba(14,8,26,.97));
    border:1px solid rgba(233,53,193,.55);border-radius:16px;overflow:hidden;
    box-shadow:0 0 22px rgba(233,53,193,.30),0 8px 30px rgba(4,2,12,.7);backdrop-filter:blur(8px)}
  .dock .bar{display:flex;align-items:center;gap:10px;height:50px;padding:0 15px;cursor:pointer;user-select:none;position:relative}
  .dock .bar::before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(45,226,230,.6),transparent)}
  .dock .bar .pulse{width:9px;height:9px;border-radius:50%;background:var(--pink);flex:none;
    box-shadow:0 0 8px var(--pink);animation:dockpulse 2.2s ease-in-out infinite}
  @keyframes dockpulse{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
  .dock .bar .t{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--pink);text-shadow:0 0 9px rgba(233,53,193,.75);flex:none}
  .dock .bar .last{flex:1;font-size:11px;color:#cfc8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    -webkit-mask-image:linear-gradient(90deg,#000 82%,transparent)}
  .dock .bar .chev{transition:transform .25s;color:var(--cyan);font-size:11px;flex:none;
    width:24px;height:24px;border:1px solid rgba(45,226,230,.4);border-radius:50%;
    display:flex;align-items:center;justify-content:center}
  .dock.open .bar .chev{transform:rotate(180deg)}
  .dock .body{height:0;overflow:hidden;transition:height .28s ease}
  .dock.open .body{height:44vh}
  .feed{height:100%;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:88%;padding:7px 10px;border-radius:11px;font-size:11.5px;line-height:1.45;border:1px solid var(--line);background:var(--panel2)}
  .msg .who{font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:3px;display:flex;gap:6px;align-items:center}
  .msg .when{font-weight:400;color:var(--muted);letter-spacing:0}
  .msg.general{align-self:flex-start;border-color:rgba(255,213,46,.5)}
  .msg.general .who{color:var(--gold)}
  .msg.agent{align-self:flex-end}
  .empty-feed{color:var(--muted);font-size:11px;text-align:center;margin-top:16px}

  /* ---------- room sheet ---------- */
  .sheet-back{position:fixed;inset:0;background:rgba(4,2,10,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-back.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:520px;margin:0 auto;
    background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;
    transform:translateY(102%);transition:transform .28s ease,visibility .28s;height:74vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);visibility:hidden}
  .sheet.open{transform:translateY(0);visibility:visible}
  .sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px}
  .sheet .hd{display:flex;align-items:center;gap:12px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
  .sheet .hd .em{font-size:32px;filter:drop-shadow(0 0 8px rgba(233,53,193,.5))}
  .sheet .hd h2{margin:0;font-size:16px;letter-spacing:1px}
  .sheet .hd .st{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
  .sheet .hd .st .dot{width:7px;height:7px;border-radius:50%;background:var(--off)}
  .sheet .hd .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    width:30px;height:30px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px}
  .sheet .desc{padding:8px 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
  .sheet .chat{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  .sheet .chat .lbl{text-align:center;color:var(--muted);font-size:10px;letter-spacing:2px;margin:4px 0}
  .cmsg{max-width:86%;padding:7px 10px;border-radius:11px;font-size:11.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .cmsg.user{align-self:flex-end;background:#241a42;border:1px solid var(--line)}
  .cmsg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--acc,var(--line))}
  .cmsg .when{display:block;font-size:9px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AGENT VILLAGE</h1>
    <div class="conn" id="conn"><span class="led"></span><span id="connText">connecting…</span></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>
    <div class="bubble" id="bubble"></div>
    <div class="rbubble" id="rbubble"></div>
  </div>
</div>

<div class="dock" id="dock">
  <div class="bar" id="dockBar">
    <span class="pulse"></span>
    <span class="t">VILLAGE FEED</span>
    <span class="last" id="dockLast">no delegations yet</span>
    <span class="chev">▲</span>
  </div>
  <div class="body"><div class="feed" id="feed"><div class="empty-feed">no delegations yet</div></div></div>
</div>

<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="hd" id="sheetHd"></div>
  <div class="desc" id="sheetDesc"></div>
  <div class="chat" id="sheetChat"></div>
</div>

<script>
'use strict';
const stage=document.getElementById('stage');
const bg=document.getElementById('bg'), fg=document.getElementById('fg');
const bctx=bg.getContext('2d'), fctx=fg.getContext('2d');
const bubble=document.getElementById('bubble');
const rbubble=document.getElementById('rbubble');
const connEl=document.getElementById('conn'), connText=document.getElementById('connText');

/* each agent works at a station in its room; act drives the working animation */
const STATION={
  general:{xf:0.50,act:'command'}, finance:{xf:0.30,act:'count'},
  memory:{xf:0.62,act:'read'},     reminders:{xf:0.34,act:'write'},
  predictions:{xf:0.40,act:'gaze'},books:{xf:0.78,act:'read'},
  health:{xf:0.24,act:'lift'},     japanese:{xf:0.52,act:'read'},
  coding:{xf:0.18,act:'type'},
};
const replyByAgent={};   // agent id -> latest reply text (for the reply bubble)

let AGENTS=[], byId={}, rooms={};
let W=0,H=0,dpr=1, spineX=0, spineW=0, spineTop=0, spineBot=0;
const seenDeleg=new Set();
const DOT_HEX={working:'#39ff88',active:'#39ff88',idle:'#ff9e3d',afk:'#4dc9ff',offline:'#4a4560'};

/* Side modules dock onto the central spine in a staggered zipper.
   w/h are fractions of stage width — every module is a different size. */
const SIDE_MODS=[
  {id:'finance',   side:'R', w:0.45, h:0.33},
  {id:'memory',    side:'L', w:0.49, h:0.25},
  {id:'reminders', side:'R', w:0.37, h:0.29},
  {id:'predictions',side:'L', w:0.43, h:0.37},
  {id:'books',     side:'R', w:0.47, h:0.26},
  {id:'health',    side:'L', w:0.39, h:0.24},
  {id:'japanese',  side:'R', w:0.44, h:0.31},
];
let fillers=[], TUBE=0;

/* ============ boot ============ */
async function boot(){
  const cfg=await fetch('agents.json').then(r=>r.json()).catch(()=>null);
  AGENTS=cfg?cfg.agents:[]; byId=Object.fromEntries(AGENTS.map(a=>[a.id,{...a}]));
  try{const d=await fetch('api/agents').then(r=>r.json()); d.agents.forEach(a=>byId[a.id]={...byId[a.id],...a});}catch(e){}
  layout(); initActors();
  window.addEventListener('resize',()=>{layout();placeActors();});
  stage.addEventListener('click',onStageClick);
  await loadFeed();
  connectSSE();
  requestAnimationFrame(loop);
}

/* ============ layout: the station ============ */
function layout(){
  W=stage.clientWidth;
  const u=W/430;
  spineW=Math.round(W*0.066); spineX=Math.round(W/2-spineW/2);
  const tube=Math.round(W*0.032);
  rooms={};
  // command bridge on top
  const by=34*u, bh=W*0.335, bx=8, bw=W-16;
  rooms.general={x:bx,y:by,w:bw,h:bh,feetY:by+bh-9,cx:bx+bw/2,
    walkMin:bx+bw*0.10,walkMax:bx+bw*0.90,shape:'bridge',amb:{}};
  spineTop=by+bh;
  TUBE=tube;
  // staggered side modules (half-step zipper). Different sizes per module.
  let yL=spineTop+W*0.030, yR=spineTop+W*0.100;
  let botL=yL, botR=yR;
  SIDE_MODS.forEach(m=>{
    const w=Math.round(W*m.w), h=Math.round(W*m.h);
    let x, y;
    if(m.side==='L'){x=spineX-tube-w; y=yL; yL+=h+W*0.042; botL=y+h;}
    else {x=spineX+spineW+tube; y=yR; yR+=h+W*0.042; botR=y+h;}
    rooms[m.id]={x,y,w,h,feetY:y+h-9,cx:x+w/2,
      walkMin:x+w*0.13,walkMax:x+w*0.87,shape:m.id,side:m.side,tube,amb:{}};
  });
  // engineering bay at the bottom (full width)
  const ey=Math.max(yL,yR)+W*0.015, eh=W*0.30, ex=10, ew=W-20;
  rooms.coding={x:ex,y:ey,w:ew,h:eh,feetY:ey+eh-9,cx:ex+ew/2,
    walkMin:ex+ew*0.10,walkMax:ex+ew*0.90,shape:'engine',amb:{}};
  spineBot=ey;
  // fill the leftover gap beside the taller column with a utility array
  fillers=[];
  const shortSide=(botL<botR)?'L':'R';
  const gapTop=Math.min(botL,botR), gapBot=ey;
  if(gapBot-gapTop > W*0.15){
    const fw=Math.round(W*0.30);
    const fx=shortSide==='L' ? spineX-tube-fw : spineX+spineW+tube;
    fillers.push({x:fx,y:gapTop+W*0.02,w:fw,h:gapBot-gapTop-W*0.05,side:shortSide});
  }
  H=Math.round(ey+eh+W*0.15);
  stage.style.height=H+'px';
  dpr=Math.min(window.devicePixelRatio||1,2);
  for(const c of [bg,fg]){c.width=W*dpr;c.height=H*dpr;}
  bctx.setTransform(dpr,0,0,dpr,0,0); fctx.setTransform(dpr,0,0,dpr,0,0);
  drawBackground();
}

/* ============ paint helpers ============ */
function R(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
function vgrad(ctx,x,y,w,h,c0,c1){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c0);g.addColorStop(1,c1);
  ctx.fillStyle=g;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
function hexRGB(hex){const n=parseInt(hex.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function dim(hex,f){const[r,g,b]=hexRGB(hex);return `rgb(${r*f|0},${g*f|0},${b*f|0})`;}
function rgba(hex,a){const[r,g,b]=hexRGB(hex);return `rgba(${r},${g},${b},${a})`;}
function neonText(ctx,s,x,y,size,color,blur){
  ctx.save();ctx.font=`800 ${size}px ui-monospace,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.fillText(s,x,y);ctx.restore();}
/* rooms stay lit regardless of status — status reads from the sign dot/label */
function litFactor(st){return st==='working'||st==='active'?1:st==='idle'?0.95:st==='afk'?0.9:0.85;}
function hash2(i,j){let h=(i*374761393+j*668265263)^(i<<7);h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

/* ============ background: deep space + station ============ */
function drawBackground(){
  bctx.clearRect(0,0,W,H);
  drawSpace();
  drawSpine();
  drawTubes();
  fillers.forEach(drawFiller);
  AGENTS.forEach(a=>{const r=rooms[a.id];if(!r)return;
    ({bridge:drawBridge,finance:drawVault,memory:drawDataCore,reminders:drawChrono,
      predictions:drawObservatory,books:drawLibrary,health:drawCentrifuge,
      japanese:drawZen,engine:drawEngineering}[r.shape]||(()=>{}))(a,r);});
}

/* decorative utility array that fills the leftover gap beside the tall column:
   a solar-panel wing + a hydroponics pod hung off a truss to the spine */
function drawFiller(fl){
  const {x,y,w,h,side}=fl;
  const spineEdge = side==='L' ? spineX : spineX+spineW;
  const armY = y+h*0.30;
  // truss arm to spine
  const ax0=Math.min(side==='L'?x+w:x, spineEdge), ax1=Math.max(side==='L'?x+w:x, spineEdge);
  R(bctx,ax0,armY-1.5,ax1-ax0,3,'#2b1c47');
  for(let ax=ax0+4;ax<ax1-3;ax+=8)R(bctx,ax,armY-3,1.5,7,'#3a2a5e');
  // central spar of the solar wing
  const sparX=x+w*0.47;
  R(bctx,sparX,y,w*0.06,h*0.58,'#2b1c47');
  // solar panels either side of the spar
  const rows=Math.max(2,Math.floor(h*0.58/(W*0.075)));
  for(let i=0;i<rows;i++){
    const py=y+i*(h*0.58/rows)+2, ph=h*0.58/rows-4;
    for(const px of [x+w*0.04, sparX+w*0.06+2]){
      const pw=(sparX-2)-(x+w*0.04);
      vgrad(bctx,px,py,pw,ph,'#14224a','#0e1836');
      bctx.strokeStyle='rgba(77,140,255,.35)';bctx.lineWidth=1;
      bctx.strokeRect(px+0.5,py+0.5,pw-1,ph-1);
      for(let gx=px+pw/3;gx<px+pw;gx+=pw/3)R(bctx,gx,py,1,ph,'rgba(77,140,255,.18)');
      R(bctx,px,py,pw,1,'rgba(120,180,255,.25)'); // sheen
    }
  }
  R(bctx,x+w*0.02,y-2,w*0.96,2,'#3a2a5e'); // top rail
  // hydroponics pod hanging below the wing
  const podY=y+h*0.64, podH=h*0.34, podX=x+w*0.24, podW=w*0.52;
  bctx.fillStyle='#182a20';rr(bctx,podX,podY,podW,podH,podH*0.42);bctx.fill();
  bctx.strokeStyle='#2f4a3a';bctx.lineWidth=2;rr(bctx,podX,podY,podW,podH,podH*0.42);bctx.stroke();
  // glowing plants inside
  for(let i=0;i<4;i++){const gx=podX+podW*(0.18+i*0.21), gyb=podY+podH*0.72;
    R(bctx,gx-1,gyb-podH*0.3,2,podH*0.3,'#2e7d3e');
    bctx.fillStyle='rgba(90,255,140,.85)';bctx.beginPath();bctx.arc(gx,gyb-podH*0.32,2.2,0,7);bctx.fill();}
  bctx.fillStyle='rgba(90,255,140,.10)';bctx.fillRect(podX+3,podY+3,podW-6,podH*0.5);
  // small dish on top of the wing
  const dx=x+w*0.80, dy=y+h*0.06;
  bctx.strokeStyle='#3a2a5e';bctx.lineWidth=2;bctx.beginPath();bctx.arc(dx,dy,w*0.07,0.7,3.6);bctx.stroke();
  R(bctx,dx-1,dy,2,h*0.10,'#3a2a5e');
}

function drawSpace(){
  vgrad(bctx,0,0,W,H,'#070313','#0d0620');
  // nebulas
  const nebs=[[W*0.18,H*0.20,W*0.5,'rgba(176,38,255,.055)'],[W*0.85,H*0.45,W*0.55,'rgba(45,226,230,.045)'],
    [W*0.25,H*0.75,W*0.5,'rgba(233,53,193,.05)']];
  for(const[nx,ny,nr,nc] of nebs){
    const g=bctx.createRadialGradient(nx,ny,0,nx,ny,nr);
    g.addColorStop(0,nc);g.addColorStop(1,'transparent');
    bctx.fillStyle=g;bctx.fillRect(0,0,W,H);}
  // stars
  for(let i=0;i<150;i++){const sx=(i*89)%W, sy=(i*127)%H, big=i%13===0;
    R(bctx,sx,sy,big?1.8:1,big?1.8:1,`rgba(210,200,255,${0.10+(i%6)*0.06})`);}
  // planet arc at the very bottom
  const pg=bctx.createRadialGradient(W/2,H+W*0.62,W*0.40,W/2,H+W*0.62,W*0.78);
  pg.addColorStop(0,'#0e3a4a');pg.addColorStop(0.75,'#155a66');pg.addColorStop(1,'#2de2e6');
  bctx.fillStyle=pg;bctx.beginPath();bctx.arc(W/2,H+W*0.62,W*0.78,0,7);bctx.fill();
  bctx.save();bctx.shadowColor='#2de2e6';bctx.shadowBlur=16;
  bctx.strokeStyle='rgba(125,246,248,.5)';bctx.lineWidth=1.5;
  bctx.beginPath();bctx.arc(W/2,H+W*0.62,W*0.78,Math.PI+0.5,-0.5);bctx.stroke();bctx.restore();
}

function drawSpine(){
  // trunk
  vgrad(bctx,spineX,spineTop-4,spineW,spineBot-spineTop+8,'#241a3d','#130c24');
  R(bctx,spineX,spineTop-4,1.5,spineBot-spineTop+8,'#3a2a5e');
  R(bctx,spineX+spineW-1.5,spineTop-4,1.5,spineBot-spineTop+8,'#3a2a5e');
  R(bctx,spineX+spineW/2-1,spineTop,2,spineBot-spineTop,'rgba(45,226,230,.15)');
  // ladder rungs + collars
  for(let y=spineTop+10;y<spineBot-6;y+=13)R(bctx,spineX+4,y,spineW-8,1.5,'#1c1330');
  SIDE_MODS.forEach(m=>{const r=rooms[m.id];
    R(bctx,spineX-1,r.feetY-14,spineW+2,3,'#3a2a5e');
    R(bctx,spineX-1,r.feetY+6,spineW+2,3,'#3a2a5e');});

function drawChar(ctx,cx,feetY,s,id,walking,phase,facing,glow,time,seed){

/* working -> walk to station and stay; idle -> gentle wander; offline -> rest */
function stepActor(a,o,dt){
  const r=rooms[a.id], st=(byId[a.id]&&byId[a.id].status)||'offline';
  const stn=STATION[a.id], stationX=r.x+r.w*((stn&&stn.xf)||0.5);
  const sp=r.w*0.55;
  o.working=(st==='working');
  o.atStation=false;
  if(o.working){
    const d=stationX-o.x; o.dir=d>=0?1:-1;
    if(Math.abs(d)>2)o.x+=Math.sign(d)*sp*dt; else {o.x=stationX;o.atStation=true;}
    o.targetX=null;o.pauseT=0;
    return;
  }
  if(o.pauseT>0){o.pauseT-=dt;return;}
  if(o.targetX==null){
    const roam=(st==='idle'||st==='active')?0.45:0.12;   // offline barely moves
    if(Math.random()<roam){o.targetX=r.walkMin+Math.random()*(r.walkMax-r.walkMin);o.dir=o.targetX>o.x?1:-1;}
    else o.pauseT=2.5+Math.random()*4;
    return;
  }
  o.x+=Math.sign(o.targetX-o.x)*sp*0.4*dt;
  if(Math.abs(o.targetX-o.x)<2){o.targetX=null;o.pauseT=2+Math.random()*4;}
}

/* small task prop drawn next to a working agent — gives each agent character */
function drawTask(ctx,id,cx,feetY,s,t,facing){
  const act=(STATION[id]||{}).act, f=facing>=0?1:-1, fx=cx+f*s*3.2;
  const P=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));};
  switch(act){

      P(fx-s*2,feetY-s*5,s*4,s*3.4,'#0a1a12');P(fx-s*2,feetY-s*5,s*4,s*0.7,'#39ffb4');
      if(Math.sin(t*7)>0)P(fx-s*1.4+((t*9)%(s*3)),feetY-s*4,s*0.7,s*0.7,'#39ffb4');
      P(fx-s*2.2,feetY-s*1.5,s*4.4,s*0.7,'#1b2a24');break;}
    case 'read':{ // open book held up
      ctx.save();ctx.translate(fx,feetY-s*4.4);
      P(-s*2.2,-s*0.4,s*2.1,s*2.8,'#e9e2cf');P(s*0.1,-s*0.4,s*2.1,s*2.8,'#dccdb0');
      P(-s*0.1,-s*0.6,s*0.2,s*3.1,'#7a5a3a');
      for(let i=0;i<3;i++)P(-s*1.9,s*0.2+i*s*0.7,s*1.6,s*0.22,'#9a8f7a');
      ctx.restore();break;}
    case 'lift':{ // dumbbell overhead
      const up=Math.abs(Math.sin(t*3))*s*1.4;
      P(cx-s*3,feetY-s*9-up,s*6,s*0.9,'#9aa2b5');
      P(cx-s*3.6,feetY-s*9.5-up,s*1,s*1.9,'#565d70');P(cx+s*2.6,feetY-s*9.5-up,s*1,s*1.9,'#565d70');break;}
    case 'count':{ // floating coins + calc
      for(let i=0;i<3;i++){const cy=feetY-s*5-Math.abs(Math.sin(t*2+i))*s*1.2;
        ctx.fillStyle='#ffd52e';ctx.beginPath();ctx.arc(fx+i*s*1.4,cy,s*0.8,0,7);ctx.fill();}
      break;}
    case 'gaze':{ // looking through eyepiece + star sparkle

      for(let i=0;i<3;i++)P(fx-s*1.1,feetY-s*4.4+i*s*0.9,s*2.2*(i<2?1:0.6),s*0.28,'#9a8f7a');
      ctx.strokeStyle='#39ff88';ctx.lineWidth=1.4;ctx.beginPath();

/* General floats down the spine on a hover platform, then through the tube */
function planWalk(ev){
  const tr=rooms[ev.to]; if(!tr)return false;
  const sx=W/2;
  walker.path=[{x:sx,y:rooms.general.feetY},{x:sx,y:tr.feetY},{x:tr.cx,y:tr.feetY}];
  walker.seg=0;walker.state='out';walker.task=ev;
  return true;
}
function stepWalker(dt){
  const speed=W*0.30;
  if(walker.state==='home'){
    const o=actors.general, r=rooms.general;
    stepActor({id:'general'},o,dt);
    walker.x=o.x;walker.y=r.feetY;
    if(walkQueue.length)planWalk(walkQueue.shift());
    return;
  }
  if(walker.state==='visit'){
    walker.t-=dt;
    if(walker.t<=0){
      const sx=W/2;
      walker.path=[{x:sx,y:walker.y},{x:sx,y:rooms.general.feetY},{x:rooms.general.cx,y:rooms.general.feetY}];
      walker.seg=0;walker.state='back';
    }
    return;
  }
  const tgt=walker.path[walker.seg];
  const dx=tgt.x-walker.x, dy=tgt.y-walker.y, dist=Math.hypot(dx,dy);
  const step=speed*dt*(Math.abs(dy)>1?1.5:1);
  if(dist<=step){
    walker.x=tgt.x;walker.y=tgt.y;walker.seg++;
    if(walker.seg>=walker.path.length){
      if(walker.state==='out'){walker.state='visit';walker.t=1.7;arriveFx={x:walker.x,y:walker.y,t:0};}
      else{walker.state='home';walker.task=null;actors.general.x=walker.x;}
    }
  }else{
    walker.x+=dx/dist*step;walker.y+=dy/dist*step;
    if(Math.abs(dx)>1)walker.facing=dx>0?1:-1;
  }
}

/* ============ ambient animation (fg) ============ */
function drawAmbient(t,s){
  const A=id=>((byId[id]||{}).status)||'offline';
  // twinkling stars
  for(let i=0;i<9;i++){
    const sx=(i*151)%W, sy=(i*211)%H;
    const al=0.2+0.5*Math.max(0,Math.sin(t*1.4+i*2.6));
    fctx.fillStyle=`rgba(220,210,255,${al})`;fctx.fillRect(sx,sy,1.6,1.6);}
  // drifting satellite
  const satX=((t*9)%(W+60))-30, satY=H*0.055+Math.sin(t*0.4)*4;
  R(fctx,satX,satY,7,3,'#8f86ad');R(fctx,satX-4,satY+0.5,4,2,'#4dc9ff');R(fctx,satX+7,satY+0.5,4,2,'#4dc9ff');
  // shooting star (short life each ~9s)
  const ph=(t%9)/9;
  if(ph<0.08){const k=ph/0.08, mx=W*0.15+k*W*0.5, my=H*0.06+k*H*0.05;
    fctx.strokeStyle=`rgba(255,255,255,${0.7*(1-k)})`;fctx.lineWidth=1.2;
    fctx.beginPath();fctx.moveTo(mx,my);fctx.lineTo(mx-14,my-5);fctx.stroke();}
  // spine running lights (downward drift)
  for(let i=0;i<4;i++){
    const ly=spineTop+(((t*36)+i*(spineBot-spineTop)/4)%(spineBot-spineTop));
    fctx.fillStyle='rgba(45,226,230,.5)';fctx.fillRect(spineX+2,ly,2,5);
    fctx.fillStyle='rgba(233,53,193,.4)';fctx.fillRect(spineX+spineW-4,spineBot-(ly-spineTop),2,5);}
  AGENTS.forEach(a=>{
    const r=rooms[a.id]; if(!r)return;
    const st=A(a.id); if(litFactor(st)<0.3)return;
    const m=r.amb||{};
    switch(a.id){
      case 'general':{
        if(m.radarX){fctx.strokeStyle=`rgba(255,213,46,${0.4+0.2*Math.sin(t*2)})`;fctx.lineWidth=1;
          fctx.beginPath();fctx.ellipse(m.radarX,m.radarY,m.radarR,m.radarR*0.45,0,t*1.5,t*1.5+4.6);fctx.stroke();}
        if(m.beaconX&&Math.sin(t*2.6)>0.3){fctx.save();fctx.shadowColor='#ff4d6d';fctx.shadowBlur=7;
          R(fctx,m.beaconX-1.5,m.beaconY,3,3,'#ff4d6d');fctx.restore();}
        break;}
      case 'finance':{
        if(m.tickX){const k=(t*22)%m.tickW;
          fctx.fillStyle='rgba(57,255,136,.8)';fctx.fillRect(m.tickX+k,m.tickY,3,1.6);
          fctx.fillStyle='rgba(57,255,136,.35)';fctx.fillRect(m.tickX,m.tickY+5,m.tickW*(0.4+0.3*Math.sin(t*1.2)),1.4);}
        break;}
      case 'memory':{
        if(m.coreX){const pl=0.35+0.3*Math.sin(t*2.4);
          fctx.fillStyle=`rgba(199,125,255,${pl})`;
          fctx.fillRect(m.coreX-2.5,m.coreY+((t*18)%m.coreH),5,7);}
        break;}
      case 'reminders':{
        if(m.clockX){
          fctx.strokeStyle='#efeaff';fctx.lineWidth=2;
          fctx.beginPath();fctx.moveTo(m.clockX,m.clockY);
          fctx.lineTo(m.clockX+Math.cos(t*0.05)*m.clockR*0.5,m.clockY+Math.sin(t*0.05)*m.clockR*0.5);fctx.stroke();
          fctx.strokeStyle='#ff9e3d';fctx.lineWidth=1.2;
          fctx.beginPath();fctx.moveTo(m.clockX,m.clockY);
          fctx.lineTo(m.clockX+Math.cos(t*0.9-1.57)*m.clockR*0.74,m.clockY+Math.sin(t*0.9-1.57)*m.clockR*0.74);fctx.stroke();}
        break;}
      case 'predictions':{
        if(m.orbX){const ang=t*1.9;
          fctx.fillStyle='rgba(190,220,255,.9)';
          fctx.beginPath();fctx.arc(m.orbX+Math.cos(ang)*4,m.orbY+Math.sin(ang)*2.6,1.3,0,7);fctx.fill();}
        break;}
      case 'books':{
        if(m.lampX){fctx.fillStyle=`rgba(255,213,46,${0.10+0.05*Math.sin(t*7)+0.03*Math.sin(t*13)})`;
          fctx.beginPath();fctx.arc(m.lampX,m.lampY,11,0,7);fctx.fill();}
        break;}
      case 'health':{
        if(m.beltX)for(let i=0;i<3;i++){const off=((t*26)+i*m.beltW/3)%m.beltW;
          R(fctx,m.beltX+off,m.beltY+1,4,1.5,'rgba(255,255,255,.4)');}
        if(m.vitX){const k=(t*30)%m.vitW;
          fctx.strokeStyle='rgba(57,255,136,.8)';fctx.lineWidth=1;
          fctx.beginPath();fctx.moveTo(m.vitX+k-6,m.vitY);
          fctx.lineTo(m.vitX+k-3,m.vitY-4);fctx.lineTo(m.vitX+k,m.vitY+3);fctx.lineTo(m.vitX+k+3,m.vitY);fctx.stroke();}
        if(m.ringCx){const an=t*0.8;
          fctx.fillStyle='rgba(255,77,109,.8)';
          fctx.beginPath();fctx.arc(m.ringCx+Math.cos(an)*m.ringW,m.ringCy+Math.sin(an)*m.ringH,2,0,7);fctx.fill();}
        break;}
      case 'japanese':{
        if(m.lanY)for(const lx of [m.lanL,m.lanR]){
          const sw=Math.sin(t*1.7+lx)*2;
          fctx.fillStyle='#e07040';fctx.fillRect(lx+sw-2.5,m.lanY,5,7);
          fctx.fillStyle='#3a2a1c';fctx.fillRect(lx+sw-1,m.lanY-2,2,2);
          fctx.fillStyle='rgba(255,160,90,.15)';fctx.beginPath();fctx.arc(lx+sw,m.lanY+4,7,0,7);fctx.fill();}
        break;}
      case 'coding':{
        if(m.curX&&Math.sin(t*6)>0)R(fctx,m.curX+((t*10)%14),m.curY,2.5,2.5,'#39ffb4');
        if(m.reacX){const pl=0.5+0.3*Math.sin(t*3);
          fctx.save();fctx.shadowColor='#39ffb4';fctx.shadowBlur=12;
          fctx.fillStyle=`rgba(57,255,180,${pl})`;
          fctx.beginPath();fctx.arc(m.reacX,m.reacY,m.reacR*(0.8+0.15*Math.sin(t*3)),0,7);fctx.fill();fctx.restore();}
        if(m.nozzles)for(const[nx,ny] of m.nozzles){
          const fl=0.5+0.4*Math.sin(t*11+nx);
          fctx.fillStyle=`rgba(45,226,230,${0.5*fl})`;
          fctx.beginPath();fctx.moveTo(nx-5,ny);fctx.lineTo(nx+5,ny);fctx.lineTo(nx,ny+9+5*fl);fctx.closePath();fctx.fill();
          fctx.fillStyle=`rgba(255,255,255,${0.5*fl})`;
          fctx.beginPath();fctx.moveTo(nx-2,ny);fctx.lineTo(nx+2,ny);fctx.lineTo(nx,ny+5+3*fl);fctx.closePath();fctx.fill();}
        break;}
    }
  });
}

/* ============ frame loop ============ */
let lastT=0;
function loop(ts){
  const time=ts/1000, dt=Math.min(0.05,(ts-lastT)/1000||0.016); lastT=ts;
  fctx.clearRect(0,0,W,H);
  const s=Math.max(2.6,W*0.0078);

  drawAmbient(time,s);

  const visiting=(walker.state==='visit')?walker.task&&walker.task.to:null;
  AGENTS.forEach(a=>{
    if(a.id==='general')return;
    const info=byId[a.id]||{}, st=info.status||'offline';
    const o=actors[a.id], r=rooms[a.id]; if(!o||!r)return;
    stepActor(a,o,dt);
    const working=o.working&&o.atStation;
    const moving=!o.working&&o.targetX!=null;
    const bob=(moving?Math.abs(Math.sin(time*9+o.seed))*1.4:0)+(working?Math.sin(time*4+o.seed)*0.6:0);
    if(st==='offline')fctx.globalAlpha=0.55;
    drawChar(fctx,o.x,r.feetY-bob,s,a.id,moving,time*11+o.seed,o.dir,st==='working',time,o.seed);
    if(working)drawTask(fctx,a.id,o.x,r.feetY-bob,s,time,o.dir);
    nameTag(fctx,o.x,r.feetY-bob,s,a.name,info.statusLabel||'',DOT_HEX[st]);
    fctx.globalAlpha=1;
  });

  stepWalker(dt);
  const moving=walker.state==='out'||walker.state==='back';
  const inSpine=moving&&Math.abs(walker.x-W/2)<spineW;
  const wbob=inSpine?Math.sin(time*3)*2.2:(moving?Math.abs(Math.sin(time*10))*1.5:0);
  if(inSpine){ // hover platform + thruster sparks
    fctx.save();fctx.shadowColor='#2de2e6';fctx.shadowBlur=8;
    fctx.fillStyle='rgba(45,226,230,.85)';
    fctx.beginPath();fctx.ellipse(walker.x,walker.y-wbob+3,s*4,s*1.1,0,0,7);fctx.fill();fctx.restore();
    fctx.fillStyle=`rgba(45,226,230,${0.4+0.3*Math.sin(time*14)})`;
    fctx.fillRect(walker.x-s*2.4,walker.y-wbob+5,2,4+2*Math.sin(time*17));
    fctx.fillRect(walker.x+s*2.4,walker.y-wbob+5,2,4+2*Math.sin(time*15));
  }
  drawChar(fctx,walker.x,walker.y-wbob,s*1.1,'general',moving&&!inSpine,time*11,walker.facing,true,time,0.3);
  {const gi=byId.general||{};nameTag(fctx,walker.x,walker.y-wbob,s*1.1,'General',gi.statusLabel||'',DOT_HEX[gi.status||'active']);}

  if(arriveFx){arriveFx.t+=dt;const k=arriveFx.t/0.6;
    if(k<1){fctx.strokeStyle=`rgba(233,53,193,${1-k})`;fctx.lineWidth=2;
      fctx.beginPath();fctx.arc(arriveFx.x,arriveFx.y-6*s,k*28,0,7);fctx.stroke();}
    else arriveFx=null;}

  // General's task bubble (while travelling / delivering)
  if(walker.task&&walker.state!=='home'){
    bubble.textContent=walker.task.reason||('→ '+((byId[walker.task.to]||{}).name||walker.task.to));
    bubble.classList.add('show');
    bubble.style.left=walker.x+'px';bubble.style.top=(walker.y-wbob-15*s)+'px';
  } else bubble.classList.remove('show');

  // Target agent's reply bubble — appears shortly after General arrives
  if(walker.state==='visit'&&walker.task){
    const to=walker.task.to, tr=rooms[to], toInfo=byId[to]||{};
    const dwell=1.7-walker.t;                 // seconds since arrival
    if(tr&&dwell>0.45){
      const txt=replyByAgent[to]||toInfo.currentTask||'On it…';
      const ax=(actors[to]&&actors[to].x)||tr.cx;
      rbubble.textContent=txt;
      rbubble.style.background=toInfo.neon||'#39ff88';
      rbubble.style.color='#0a0614';
      rbubble.classList.add('show');
      rbubble.style.left=ax+'px';rbubble.style.top=(tr.feetY-16*s)+'px';
      if(!replyByAgent[to]&&!walker._fetchedReply){walker._fetchedReply=true;loadFeed();}
    } else rbubble.classList.remove('show');
  } else {rbubble.classList.remove('show');if(walker.state!=='visit')walker._fetchedReply=false;}

  requestAnimationFrame(loop);
}

/* ============ data / SSE ============ */
function applyAgents(list){list.forEach(a=>{byId[a.id]={...byId[a.id],...a};});drawBackground();}
function handleDelegations(list){let fresh=false;
  list.forEach(d=>{if(seenDeleg.has(d.id))return;seenDeleg.add(d.id);walkQueue.push(d);fresh=true;});
  if(fresh)loadFeed();
}
function connectSSE(){
  const es=new EventSource('api/agents/stream');
  es.addEventListener('open',()=>setConn(true));
  es.addEventListener('error',()=>setConn(false));
  es.addEventListener('agents',e=>applyAgents(JSON.parse(e.data).agents));
  es.addEventListener('delegations',e=>handleDelegations(JSON.parse(e.data).delegations));
}
function setConn(l){connEl.classList.toggle('live',l);connText.textContent=l?'live':'reconnecting…';}

/* ============ village feed dock ============ */
const dock=document.getElementById('dock'), feedEl=document.getElementById('feed'), dockLast=document.getElementById('dockLast');
document.getElementById('dockBar').addEventListener('click',()=>dock.classList.toggle('open'));
function rel(ts){if(!ts)return'';const d=Date.now()/1000-ts;
  if(d<60)return'now';if(d<3600)return `${d/60|0}m ago`;if(d<86400)return `${d/3600|0}h ago`;return `${d/86400|0}d ago`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function loadFeed(){
  try{
    const d=await fetch('api/feed').then(r=>r.json());
    const feed=d.feed||[];
    if(!feed.length){feedEl.innerHTML='<div class="empty-feed">no delegations yet</div>';return;}
    feed.forEach(ev=>{seenDeleg.add(ev.id); if(ev.reply)replyByAgent[ev.to]=ev.reply.content;});
    feedEl.innerHTML=feed.map(ev=>{
      const to=byId[ev.to]||{name:ev.to,emoji:'',neon:'#e935c1'};
      let html=`<div class="msg general"><div class="who">⚙️ GENERAL → ${to.emoji} ${esc((to.name||'').toUpperCase())} <span class="when">${rel(ev.ts)}</span></div>${esc(ev.reason||'delegated a task')}</div>`;
      if(ev.reply) html+=`<div class="msg agent" style="border-color:${to.neon}66"><div class="who" style="color:${to.neon}">${to.emoji} ${esc((to.name||'').toUpperCase())} <span class="when">${rel(ev.reply.ts)}</span></div>${esc(ev.reply.content)}</div>`;
      return html;
    }).join('');
    const last=feed[feed.length-1];
    dockLast.textContent=`General → ${(byId[last.to]||{}).name||last.to}: ${last.reason||''}`;
    feedEl.scrollTop=feedEl.scrollHeight;
  }catch(e){}
}

/* ============ room sheet ============ */
const sheet=document.getElementById('sheet'), sheetBack=document.getElementById('sheetBack');
const sheetHd=document.getElementById('sheetHd'), sheetDesc=document.getElementById('sheetDesc'), sheetChat=document.getElementById('sheetChat');
function onStageClick(e){
  const rect=stage.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  for(const a of AGENTS){const r=rooms[a.id];if(!r)continue;
    if(x>=r.x-4&&x<=r.x+r.w+4&&y>=r.y-6&&y<=r.y+r.h+6){openSheet(a.id);return;}}
}
async function openSheet(id){
  const a=byId[id]||{};
  const last=a.lastActive?new Date(a.lastActive*1000).toLocaleString():'—';
  sheetHd.innerHTML=`<span class="em">${a.emoji||''}</span>
    <div><h2>${esc(a.name||id)}</h2>
    <div class="st"><span class="dot" style="background:${DOT_HEX[a.status]||'#4a4560'};box-shadow:0 0 6px ${DOT_HEX[a.status]||'transparent'}"></span>${esc(a.statusLabel||'')} · last: ${esc(last)}</div></div>
    <button class="x" onclick="closeSheet()">✕</button>`;
  const working=a.status==='working';
  const doing=working
    ? (a.currentTask?`Working on: ${esc(a.currentTask)}`:'Working on a task')
    : (a.status==='active'?'Coordinating the village':`Nothing right now — ${esc(a.statusLabel||'idle')}`);
  sheetDesc.innerHTML=`<div style="display:flex;gap:7px;align-items:center;margin-bottom:5px">
      <span style="width:6px;height:6px;border-radius:50%;background:${DOT_HEX[a.status]||'#4a4560'};box-shadow:0 0 6px ${DOT_HEX[a.status]||'transparent'};flex:none"></span>
      <b style="color:${a.neon||'#efeaff'};letter-spacing:1px;font-size:10px">CURRENTLY</b>
      <span style="color:#cfc8e8">${doing}</span></div>
    <div style="opacity:.65">${esc(a.description||'')}</div>`;
  sheetChat.innerHTML='<div class="lbl">LOADING…</div>';
  sheet.classList.add('open');sheetBack.classList.add('open');
  try{
    const d=await fetch(`api/messages/${a.thread}`).then(r=>r.json());
    const msgs=d.messages||[];
    sheetChat.innerHTML='<div class="lbl">INTERNAL CHAT</div>'+(msgs.length?
      msgs.map(m=>`<div class="cmsg ${m.role==='user'?'user':'assistant'}" style="--acc:${a.neon||'#332552'}66">${esc(m.content)}<span class="when">${rel(m.ts)}</span></div>`).join('')
      :'<div class="lbl">NO MESSAGES YET</div>');
    sheetChat.scrollTop=sheetChat.scrollHeight;
  }catch(err){sheetChat.innerHTML='<div class="lbl">FAILED TO LOAD</div>';}
}
function closeSheet(){sheet.classList.remove('open');sheetBack.classList.remove('open');}
sheetBack.addEventListener('click',closeSheet);

boot();
</script>
