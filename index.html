<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Agent Village</title>
<style>
  :root{
    --bg0:#07040f; --bg1:#170c2b; --ink:#efeaff; --muted:#8f86ad;
    --panel:#150f26; --panel2:#1e1536; --line:#332552;
    --pink:#e935c1; --purple:#b026ff; --cyan:#2de2e6; --gold:#ffd52e;
    --ok:#39ff88; --idle:#ff9e3d; --afk:#4dc9ff; --off:#4a4560;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:
    radial-gradient(120% 60% at 50% -5%,#241242 0%,transparent 60%),
    radial-gradient(130% 90% at 50% 100%,#1b0e33 0%,var(--bg0) 60%),var(--bg0);
    color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:none}
  .wrap{max-width:520px;margin:0 auto;padding:12px 10px calc(64px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:10px}
  h1{font-size:19px;margin:0;letter-spacing:6px;color:var(--gold);font-weight:800;
    text-shadow:0 0 14px rgba(255,213,46,.65),2px 2px 0 #000}
  .conn{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;gap:6px;align-items:center;font-size:10px;color:var(--muted)}
  .conn .led{width:8px;height:8px;border-radius:50%;background:var(--off)}
  .conn.live .led{background:var(--ok);box-shadow:0 0 9px var(--ok)}

  .stage{position:relative;width:100%}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #bg{z-index:1}#fg{z-index:2}
  /* CRT scanlines + vignette */
  .stage::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:4px;
    background:
      repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),
      radial-gradient(120% 100% at 50% 45%,transparent 55%,rgba(4,2,12,.55) 100%)}
  .bubble{position:absolute;transform:translate(-50%,-100%);background:#f8f4ff;color:#17102b;
    font-size:11px;font-weight:700;padding:5px 9px;border-radius:9px;white-space:nowrap;max-width:230px;
    overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 16px rgba(233,53,193,.6);opacity:0;transition:opacity .2s;
    pointer-events:none;z-index:6}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:#f8f4ff;border-bottom:0}
  .bubble.show{opacity:1}

  /* ---------- village feed dock ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:520px;margin:0 auto;
    background:rgba(13,8,26,.97);border-top:1px solid var(--pink);
    box-shadow:0 -4px 26px rgba(233,53,193,.28);backdrop-filter:blur(6px);
    padding-bottom:env(safe-area-inset-bottom)}
  .dock .bar{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;cursor:pointer;user-select:none}
  .dock .bar .t{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--pink);text-shadow:0 0 9px rgba(233,53,193,.75)}
  .dock .bar .last{flex:1;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock .bar .chev{transition:transform .25s;color:var(--muted);font-size:12px}
  .dock.open .bar .chev{transform:rotate(180deg)}
  .dock .body{height:0;overflow:hidden;transition:height .28s ease}
  .dock.open .body{height:44vh}
  .feed{height:100%;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:88%;padding:7px 10px;border-radius:11px;font-size:11.5px;line-height:1.45;border:1px solid var(--line);background:var(--panel2)}
  .msg .who{font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:3px;display:flex;gap:6px;align-items:center}
  .msg .when{font-weight:400;color:var(--muted);letter-spacing:0}
  .msg.general{align-self:flex-start;border-color:rgba(255,213,46,.5)}
  .msg.general .who{color:var(--gold)}
  .msg.agent{align-self:flex-end}
  .empty-feed{color:var(--muted);font-size:11px;text-align:center;margin-top:16px}

  /* ---------- room sheet ---------- */
  .sheet-back{position:fixed;inset:0;background:rgba(4,2,10,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-back.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:520px;margin:0 auto;
    background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;
    transform:translateY(102%);transition:transform .28s ease,visibility .28s;height:74vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);visibility:hidden}
  .sheet.open{transform:translateY(0);visibility:visible}
  .sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px}
  .sheet .hd{display:flex;align-items:center;gap:12px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
  .sheet .hd .em{font-size:32px;filter:drop-shadow(0 0 8px rgba(233,53,193,.5))}
  .sheet .hd h2{margin:0;font-size:16px;letter-spacing:1px}
  .sheet .hd .st{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
  .sheet .hd .st .dot{width:7px;height:7px;border-radius:50%;background:var(--off)}
  .sheet .hd .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    width:30px;height:30px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px}
  .sheet .desc{padding:8px 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
  .sheet .chat{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  .sheet .chat .lbl{text-align:center;color:var(--muted);font-size:10px;letter-spacing:2px;margin:4px 0}
  .cmsg{max-width:86%;padding:7px 10px;border-radius:11px;font-size:11.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .cmsg.user{align-self:flex-end;background:#241a42;border:1px solid var(--line)}
  .cmsg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--acc,var(--line))}
  .cmsg .when{display:block;font-size:9px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AGENT VILLAGE</h1>
    <div class="conn" id="conn"><span class="led"></span><span id="connText">connecting…</span></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>
    <div class="bubble" id="bubble"></div>
  </div>
</div>

<div class="dock" id="dock">
  <div class="bar" id="dockBar">
    <span class="t">▮ VILLAGE FEED</span>
    <span class="last" id="dockLast">no delegations yet</span>
    <span class="chev">▲</span>
  </div>
  <div class="body"><div class="feed" id="feed"><div class="empty-feed">no delegations yet</div></div></div>
</div>

<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="hd" id="sheetHd"></div>
  <div class="desc" id="sheetDesc"></div>
  <div class="chat" id="sheetChat"></div>
</div>

<script>
'use strict';
const stage=document.getElementById('stage');
const bg=document.getElementById('bg'), fg=document.getElementById('fg');
const bctx=bg.getContext('2d'), fctx=fg.getContext('2d');
const bubble=document.getElementById('bubble');
const connEl=document.getElementById('conn'), connText=document.getElementById('connText');

let AGENTS=[], byId={}, rooms={};
let W=0,H=0,dpr=1, floorH=0, shaftX=0, shaftW=0, roofH=34, groundH=20, slabH=12;
const FLOORS=5;
const seenDeleg=new Set();
const DOT_HEX={working:'#39ff88',active:'#39ff88',idle:'#ff9e3d',afk:'#4dc9ff',offline:'#4a4560'};

/* ============ boot ============ */
async function boot(){
  const cfg=await fetch('agents.json').then(r=>r.json()).catch(()=>null);
  AGENTS=cfg?cfg.agents:[]; byId=Object.fromEntries(AGENTS.map(a=>[a.id,{...a}]));
  try{const d=await fetch('api/agents').then(r=>r.json()); d.agents.forEach(a=>byId[a.id]={...byId[a.id],...a});}catch(e){}
  layout(); initActors();
  window.addEventListener('resize',()=>{layout();placeActors();});
  stage.addEventListener('click',onStageClick);
  await loadFeed();
  connectSSE();
  requestAnimationFrame(loop);
}

/* ============ layout ============ */
function layout(){
  W=stage.clientWidth;
  floorH=Math.max(150,Math.min(235,Math.round(W*0.45)));
  H=roofH+FLOORS*floorH+groundH;
  stage.style.height=H+'px';
  dpr=Math.min(window.devicePixelRatio||1,2);
  for(const c of [bg,fg]){c.width=W*dpr;c.height=H*dpr;}
  bctx.setTransform(dpr,0,0,dpr,0,0); fctx.setTransform(dpr,0,0,dpr,0,0);
  shaftW=Math.round(W*0.12); shaftX=Math.round(W/2-shaftW/2);
  rooms={};
  AGENTS.forEach(a=>{
    const top=roofH+(FLOORS-a.floor)*floorH, h=floorH-slabH;
    let x,w;
    if(a.slot==='full'){x=9;w=W-18;}
    else if(a.slot==='left'){x=9;w=shaftX-9;}
    else {x=shaftX+shaftW;w=W-9-x;}
    const feetY=top+h-5;
    rooms[a.id]={x,y:top,w,h,feetY,cx:x+w/2,walkMin:x+w*0.13,walkMax:x+w*0.87};
  });
  drawBackground();
}

/* ============ paint helpers ============ */
function R(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
function vgrad(ctx,x,y,w,h,c0,c1){const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,c0);g.addColorStop(1,c1);
  ctx.fillStyle=g;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
function hexRGB(hex){const n=parseInt(hex.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function dim(hex,f){const[r,g,b]=hexRGB(hex);return `rgb(${r*f|0},${g*f|0},${b*f|0})`;}
function rgba(hex,a){const[r,g,b]=hexRGB(hex);return `rgba(${r},${g},${b},${a})`;}
function neonText(ctx,s,x,y,size,color,blur){
  ctx.save();ctx.font=`800 ${size}px ui-monospace,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=color;ctx.shadowBlur=blur;ctx.fillStyle=color;ctx.fillText(s,x,y);ctx.fillText(s,x,y);ctx.restore();
}
function litFactor(st){return st==='working'||st==='active'?1:st==='idle'?0.72:st==='afk'?0.5:0.14;}

/* ============ background: the building ============ */
function drawBackground(){
  bctx.clearRect(0,0,W,H);
  // distant stars
  for(let i=0;i<46;i++){const sx=(i*97)%W,sy=(i*61)%H;R(bctx,sx,sy,1,1,'rgba(190,170,255,.16)');}
  // building body
  vgrad(bctx,5,roofH-4,W-10,H-roofH-groundH+8,'#160d28','#0e0819');
  drawRoof(); drawShaft();
  AGENTS.forEach(a=>drawRoom(a));
  drawSlabs(); drawFrame(); drawGround();
}

function drawRoof(){
  R(bctx,5,roofH-8,W-10,6,'#241638'); R(bctx,5,roofH-8,W-10,1,'#b026ff');
  bctx.save();bctx.shadowColor='#b026ff';bctx.shadowBlur=6;R(bctx,5,roofH-8,W-10,1,'#d06bff');bctx.restore();
  // water tank
  R(bctx,W*0.12,roofH-26,26,18,'#1c1330');R(bctx,W*0.12-3,roofH-26,32,3,'#2b1c47');
  R(bctx,W*0.12+4,roofH-8,3,2,'#2b1c47');R(bctx,W*0.12+19,roofH-8,3,2,'#2b1c47');
  // antennas
  R(bctx,W*0.68,roofH-30,2,22,'#4a3a6a');R(bctx,W*0.68-4,roofH-31,10,2,'#4a3a6a');
  R(bctx,W*0.86,roofH-20,2,14,'#4a3a6a');
  // AC units
  R(bctx,W*0.42,roofH-14,18,6,'#1e1433');R(bctx,W*0.44,roofH-12,3,3,'#2de2e6');
}

function drawShaft(){
  vgrad(bctx,shaftX,roofH-2,shaftW,H-roofH-groundH+2,'#0c0716','#080511');
  R(bctx,shaftX,roofH-2,1.5,H-roofH-groundH,'rgba(45,226,230,.4)');
  R(bctx,shaftX+shaftW-1.5,roofH-2,1.5,H-roofH-groundH,'rgba(45,226,230,.4)');
  // guide rails + cables
  R(bctx,shaftX+4,roofH,1,H-roofH-groundH,'#1c1330');
  R(bctx,shaftX+shaftW-5,roofH,1,H-roofH-groundH,'#1c1330');
  R(bctx,shaftX+shaftW/2-2,roofH,1,H-roofH-groundH,'#241a3d');
  R(bctx,shaftX+shaftW/2+1,roofH,1,H-roofH-groundH,'#241a3d');
  // landing doors per floor
  for(let f=1;f<=FLOORS;f++){
    const top=roofH+(FLOORS-f)*floorH, dy=top+(floorH-slabH)*0.52, dh=(floorH-slabH)*0.44;
    R(bctx,shaftX+2,dy,shaftW-4,dh,'#0f0a1d');
    R(bctx,shaftX+2,dy,shaftW-4,1,'#2b1c47');
    R(bctx,shaftX+shaftW/2-0.5,dy,1,dh,'#2b1c47');
    R(bctx,shaftX+2,dy-4,shaftW-4,2,'rgba(45,226,230,.25)');
  }
}

function drawSlabs(){
  for(let f=1;f<=FLOORS;f++){
    const y=roofH+f*floorH-slabH;
    vgrad(bctx,5,y,W-10,slabH,'#261741','#1a1030');
    R(bctx,5,y,W-10,1.5,'#e935c1');
    bctx.save();bctx.shadowColor='#e935c1';bctx.shadowBlur=8;R(bctx,5,y,W-10,1.5,'#ff5fd8');bctx.restore();
    R(bctx,5,y+slabH-1,W-10,1,'rgba(0,0,0,.5)');
    // vents / bolts along slab
    for(let x=18;x<W-24;x+=44){R(bctx,x,y+4,10,4,'#130c22');R(bctx,x+1,y+5,8,1,'#2b1c47');}
    for(let x=38;x<W-24;x+=44){R(bctx,x,y+5,2,2,'#3a2a5e');}
  }
}

function drawFrame(){
  vgrad(bctx,3,roofH-8,6,H-roofH-groundH+8,'#2b1c47','#1a1030');
  vgrad(bctx,W-9,roofH-8,6,H-roofH-groundH+8,'#2b1c47','#1a1030');
  for(let y=roofH+16;y<H-groundH;y+=34){
    R(bctx,4.5,y,3,8,'rgba(45,226,230,.35)');R(bctx,W-7.5,y,3,8,'rgba(233,53,193,.3)');
  }
}

function drawGround(){
  vgrad(bctx,0,H-groundH,W,groundH,'#120b22','#0a0614');
  R(bctx,0,H-groundH,W,1.5,'#2de2e6');
  bctx.save();bctx.shadowColor='#2de2e6';bctx.shadowBlur=9;R(bctx,0,H-groundH,W,1.5,'#7df6f8');bctx.restore();
  // sidewalk seams + neon puddles
  for(let x=14;x<W;x+=38)R(bctx,x,H-groundH+3,1,groundH-6,'rgba(255,255,255,.05)');
  R(bctx,W*0.2,H-groundH+9,26,2,'rgba(233,53,193,.28)');
  R(bctx,W*0.65,H-groundH+12,34,2,'rgba(45,226,230,.25)');
}

/* ---------- one room: pseudo-3D box + furniture ---------- */
function drawRoom(a){
  const r=rooms[a.id], st=(byId[a.id]&&byId[a.id].status)||'offline';
  const lit=litFactor(st), neon=a.neon||'#e935c1';
  const floorTop=r.y+r.h*0.66, inset=r.w*0.055;

  // back wall
  vgrad(bctx,r.x,r.y,r.w,floorTop-r.y,dim(neon,0.10+0.06*lit),dim(neon,0.05+0.03*lit));
  for(let x=r.x+22;x<r.x+r.w-8;x+=26)R(bctx,x,r.y+4,1,floorTop-r.y-6,'rgba(0,0,0,.16)'); // panel seams

  // window band with skyline
  const wy=r.y+r.h*0.13, wh=r.h*0.25;
  const wins=Math.max(2,Math.round(r.w/78));
  const winw=r.w/(wins*1.5), wgap=(r.w-wins*winw)/(wins+1);
  for(let i=0;i<wins;i++){
    const wx=r.x+wgap+i*(winw+wgap);
    vgrad(bctx,wx,wy,winw,wh,'#0d1030','#141c4a');
    // skyline silhouettes + lit dots
    R(bctx,wx+winw*0.1,wy+wh*0.45,winw*0.18,wh*0.55,'#0a0c26');
    R(bctx,wx+winw*0.42,wy+wh*0.3,winw*0.2,wh*0.7,'#0b0e2b');
    R(bctx,wx+winw*0.7,wy+wh*0.55,winw*0.16,wh*0.45,'#0a0c26');
    for(let d=0;d<5;d++){R(bctx,wx+winw*(0.15+d*0.16),wy+wh*(0.38+(d%3)*0.18),1.5,1.5,d%2?'rgba(255,213,46,.5)':'rgba(45,226,230,.5)');}
    R(bctx,wx-1.5,wy-1.5,winw+3,1.5,'#241a3d');R(bctx,wx-1.5,wy+wh,winw+3,1.5,'#241a3d');
    R(bctx,wx-1.5,wy-1.5,1.5,wh+3,'#241a3d');R(bctx,wx+winw,wy-1.5,1.5,wh+3,'#241a3d');
    if(lit>0.3)vgrad(bctx,wx,wy+wh,winw,r.h*0.1,'rgba(90,140,255,.07)','transparent'); // moon spill
  }

  // ceiling + light fixture
  R(bctx,r.x,r.y,r.w,4,'#0c0818');
  if(lit>0.3){
    const lw=r.w*0.34, lx=r.cx-lw/2;
    R(bctx,lx,r.y+4,lw,2.5,neon);
    bctx.save();bctx.shadowColor=neon;bctx.shadowBlur=10;R(bctx,lx,r.y+4,lw,2.5,neon);bctx.restore();
    // light cone
    const g=bctx.createLinearGradient(0,r.y+6,0,r.y+r.h);
    g.addColorStop(0,rgba(neon,0.10*lit));g.addColorStop(1,'transparent');
    bctx.fillStyle=g;bctx.beginPath();
    bctx.moveTo(lx,r.y+7);bctx.lineTo(lx+lw,r.y+7);
    bctx.lineTo(lx+lw+r.w*0.12,r.y+r.h);bctx.lineTo(lx-r.w*0.12,r.y+r.h);
    bctx.closePath();bctx.fill();
  }

  // perspective floor
  const fg2=bctx.createLinearGradient(0,floorTop,0,r.y+r.h);
  fg2.addColorStop(0,dim(neon,0.13+0.10*lit));fg2.addColorStop(1,dim(neon,0.05+0.05*lit));
  bctx.fillStyle=fg2;bctx.beginPath();
  bctx.moveTo(r.x+inset,floorTop);bctx.lineTo(r.x+r.w-inset,floorTop);
  bctx.lineTo(r.x+r.w,r.y+r.h);bctx.lineTo(r.x,r.y+r.h);bctx.closePath();bctx.fill();
  // floor grid
  bctx.strokeStyle=`rgba(255,255,255,${0.035+0.045*lit})`;bctx.lineWidth=1;
  for(let i=1;i<5;i++){const t=i/5;
    bctx.beginPath();
    bctx.moveTo(r.x+inset*(1-t),floorTop+(r.y+r.h-floorTop)*t);
    bctx.lineTo(r.x+r.w-inset*(1-t),floorTop+(r.y+r.h-floorTop)*t);bctx.stroke();}
  for(let i=1;i<6;i++){const fx=r.x+inset+((r.w-2*inset)/6)*i;
    const bx=r.x+(r.w/6)*i;
    bctx.beginPath();bctx.moveTo(fx,floorTop);bctx.lineTo(bx,r.y+r.h);bctx.stroke();}
  R(bctx,r.x,floorTop-1,r.w,1,'rgba(0,0,0,.35)'); // wall/floor junction
  // side wall shading
  vgrad(bctx,r.x,r.y,7,r.h,'rgba(0,0,0,.4)','rgba(0,0,0,.2)');
  vgrad(bctx,r.x+r.w-7,r.y,7,r.h,'rgba(0,0,0,.4)','rgba(0,0,0,.2)');

  drawFurniture(a,r,lit,neon,floorTop);

  if(lit<0.3){bctx.fillStyle='rgba(4,2,10,.6)';bctx.fillRect(r.x,r.y,r.w,r.h);}

  // neon sign
  const label=a.name.toUpperCase(), fs=Math.max(9,Math.min(12,r.w*0.06));
  bctx.font=`800 ${fs}px ui-monospace,monospace`;
  const tw=bctx.measureText(label).width, sw=tw+30, sx=r.cx-sw/2, sy=r.y+8;
  R(bctx,sx,sy,sw,fs+10,'rgba(5,2,12,.88)');
  R(bctx,sx,sy,sw,1,dim(neon,lit>0.3?0.95:0.3));
  R(bctx,sx,sy+fs+9,sw,1,'rgba(0,0,0,.6)');

/* ============ ambient animation (fg, cheap per-frame) ============ */
function drawAmbient(t){
  AGENTS.forEach(a=>{
    const r=rooms[a.id], st=(byId[a.id]&&byId[a.id].status)||'offline';
    if(litFactor(st)<0.3)return;
    const X=r.x, Y=r.y, fw=r.w, fh=r.h;
    const floorTop=Y+fh*0.66, midY=floorTop+(Y+fh-floorTop)*0.35;
    switch(a.id){
      case 'general':{ // holo ring rotation + blinking leds
        fctx.strokeStyle=`rgba(255,213,46,${0.35+0.25*Math.sin(t*2)})`;fctx.lineWidth=1;
        fctx.beginPath();fctx.ellipse(X+fw*0.76,midY-6,fw*0.07,4,0,t*1.4,t*1.4+4.4);fctx.stroke();
        if(Math.sin(t*3.1)>0)R(fctx,X+fw*0.42,Y+fh*0.42,2,2,'#39ff88');
        if(Math.sin(t*2.3+1)>0)R(fctx,X+fw*0.52,Y+fh*0.42,2,2,'#2de2e6');
        break;}
      case 'coding':{ // typing cursor + scroll line
        if(Math.sin(t*6)>0)R(fctx,X+fw*0.36+((t*10)%(fw*0.07)),midY-10,2.5,2.5,'#39ffb4');
        R(fctx,X+fw*0.335,midY-13+((t*7)%8),fw*0.10,1,'rgba(57,255,180,.5)');
        break;}
      case 'predictions':{ // orb swirl
        const ang=t*1.8;
        fctx.fillStyle='rgba(159,224,255,.8)';
        fctx.beginPath();fctx.arc(X+fw*0.31+Math.cos(ang)*fw*0.045,midY-6+Math.sin(ang)*3,1.6,0,7);fctx.fill();
        fctx.beginPath();fctx.arc(X+fw*0.31+Math.cos(ang+2.1)*fw*0.03,midY-7+Math.sin(ang+2.1)*2.4,1.2,0,7);fctx.fill();
        break;}
      case 'reminders':{ // clock hands
        const cx=X+fw*0.22, cy=Y+fh*0.42, rad=fw*0.085;
        fctx.strokeStyle='#241a3d';fctx.lineWidth=2;
        fctx.beginPath();fctx.moveTo(cx,cy);fctx.lineTo(cx+Math.cos(t*0.05)*rad*0.5,cy+Math.sin(t*0.05)*rad*0.5);fctx.stroke();
        fctx.strokeStyle='#ff4d6d';fctx.lineWidth=1;
        fctx.beginPath();fctx.moveTo(cx,cy);fctx.lineTo(cx+Math.cos(t*1.05-1.57)*rad*0.72,cy+Math.sin(t*1.05-1.57)*rad*0.72);fctx.stroke();
        break;}
      case 'health':{ // treadmill belt dashes + tv pulse
        const bx=X+fw*0.10, bw=fw*0.26;
        for(let i=0;i<3;i++){const off=((t*26)+i*bw/3)%bw;R(fctx,bx+off,midY+8.5,4,1.5,'rgba(255,255,255,.35)');}
        fctx.fillStyle=`rgba(57,255,136,${0.25+0.2*Math.sin(t*2.5)})`;
        fctx.fillRect(X+fw*0.39,Y+fh*0.36,fw*0.06,2);
        break;}
      case 'finance':{ // chart pulse on monitor
        const mh=3+2*Math.sin(t*2.2);
        R(fctx,X+fw*0.165,midY-8-mh,2,mh+4,'#39ff88');
        R(fctx,X+fw*0.195,midY-6-mh*0.7,2,mh*0.7+2,'#2de2e6');
        break;}
      case 'memory':{ // scrolling data
        R(fctx,X+fw*0.63,midY-13+((t*9)%7),fw*0.09,1,'rgba(199,125,255,.55)');
        break;}
      case 'books':{ // lamp flicker glow
        fctx.fillStyle=`rgba(255,213,46,${0.10+0.05*Math.sin(t*7)+0.03*Math.sin(t*13)})`;
        fctx.beginPath();fctx.arc(X+fw*0.50,midY-17,fw*0.09,0,7);fctx.fill();
        break;}
      case 'japanese':{ // lantern sway
        for(const px of [0.30,0.66]){
          const sw=Math.sin(t*1.6+px*9)*2;
          R(fctx,X+fw*px+sw,Y+fh*0.26,6,8,'#ff9e5f');
          R(fctx,X+fw*px+1.5+sw,Y+fh*0.24,3,2,'#a8642a');
          fctx.fillStyle='rgba(255,158,95,.12)';fctx.beginPath();fctx.arc(X+fw*px+3+sw,Y+fh*0.30,7,0,7);fctx.fill();}
        break;}
    }
  });
  // roof beacon
  if(Math.sin(t*2.6)>0.3){fctx.save();fctx.shadowColor='#ff4d6d';fctx.shadowBlur=8;
    R(fctx,W*0.68,roofH-31,3,3,'#ff4d6d');fctx.restore();}
}

/* ============ actors ============ */
const actors={};
let walker=null, walkQueue=[], arriveFx=null;
const SKIN='#efc9a8';
const HAIR={general:'#3a2a1a',finance:'#20321f',memory:'#57406e',reminders:'#1e2c4e',
  predictions:'#12233a',books:'#4e2c18',health:'#3c1420',japanese:'#151520',coding:'#123326'};
const SHIRT={general:'#ffd52e',finance:'#39ff88',memory:'#c77dff',reminders:'#ff9e3d',
  predictions:'#4dc9ff',books:'#ff7847',health:'#ff4d6d',japanese:'#ff5fa2',coding:'#39ffb4'};
const HAIRSTYLE={general:'flat',finance:'side',memory:'puff',reminders:'flat',
  predictions:'hood',books:'side',health:'band',japanese:'spiky',coding:'cap'};

function initActors(){
  AGENTS.forEach((a,i)=>{
    const r=rooms[a.id];
    actors[a.id]={x:r.cx+(a.id==='general'?0:(Math.random()*2-1)*r.w*0.2),dir:1,pauseT:1+Math.random()*2,targetX:null,seed:i*1.7};
  });
  walker={state:'home',x:rooms.general.cx,y:rooms.general.feetY,path:[],seg:0,task:null,facing:1};
}
function placeActors(){
  AGENTS.forEach(a=>{const r=rooms[a.id],o=actors[a.id];o.x=Math.min(Math.max(o.x,r.walkMin),r.walkMax);});
  if(walker.state==='home'){walker.x=rooms.general.cx;walker.y=rooms.general.feetY;}
}

function drawChar(ctx,cx,feetY,s,id,walking,phase,facing,glow,time,seed){
  const shirt=SHIRT[id]||'#888', hair=HAIR[id]||'#222', style=HAIRSTYLE[id]||'flat';
  // ground shadow
  ctx.fillStyle='rgba(0,0,0,.42)';ctx.beginPath();ctx.ellipse(cx,feetY+1.5,s*3.2,s*1.05,0,0,7);ctx.fill();
  const P=(gx,gy,gw,gh,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(cx+gx*s),Math.round(feetY+gy*s),Math.ceil(gw*s),Math.ceil(gh*s));};
  const legA=walking?Math.sin(phase)*1.1:0, armA=walking?Math.sin(phase)*0.9:0;
  if(glow){ctx.save();ctx.shadowColor=shirt;ctx.shadowBlur=9;}
  // legs + shoes
  P(-2.0,-3.2-Math.max(0,legA),1.7,3.2,'#232338');P(0.4,-3.2-Math.max(0,-legA),1.7,3.2,'#232338');
  P(-2.1,-0.8-Math.max(0,legA),1.9,0.8,'#11131c');P(0.3,-0.8-Math.max(0,-legA),1.9,0.8,'#11131c');
  // torso
  P(-2.5,-7.0,5,4,shirt);
  P(-2.5,-7.0,5,0.8,dim(shirt,0.75));
  // arms
  P(-3.3,-6.8+armA,1.0,3.4,shirt);P(2.3,-6.8-armA,1.0,3.4,shirt);
  P(-3.3,-3.6+armA,1.0,0.9,SKIN);P(2.3,-3.6-armA,1.0,0.9,SKIN);
  // head
  P(-2.1,-10.6,4.2,3.6,SKIN);
  // hair styles
  if(style==='flat')P(-2.3,-11.2,4.6,1.6,hair);
  else if(style==='side'){P(-2.3,-11.2,4.6,1.4,hair);P(-2.3,-10.2,1.2,1.6,hair);}
  else if(style==='puff'){P(-2.5,-11.6,5,2,hair);P(-2.7,-10.4,0.8,1.4,hair);P(1.9,-10.4,0.8,1.4,hair);}
  else if(style==='spiky'){P(-2.3,-11,4.6,1.3,hair);P(-2,-11.8,1,0.9,hair);P(-0.4,-12,1,1.1,hair);P(1.2,-11.7,1,0.8,hair);}
  else if(style==='band'){P(-2.3,-11.2,4.6,1.4,hair);P(-2.2,-10.9,4.4,0.7,'#ff4d6d');}
  else if(style==='hood'){P(-2.5,-11.4,5,2.2,dim(shirt,0.5));P(-2.5,-9.4,0.9,2.4,dim(shirt,0.5));P(1.6,-9.4,0.9,2.4,dim(shirt,0.5));}
  else if(style==='cap'){P(-2.3,-11.3,4.6,1.5,hair);P(facing>0?0.4:-3.4,-11,3,0.8,hair);}
  // eyes (blink)
  const blink=Math.sin(time*1.1+seed*7)>0.984;
  if(!blink){P(facing>0?-1.1:-1.5,-9.6,0.85,0.9,'#17102b');P(facing>0?0.7:0.3,-9.6,0.85,0.9,'#17102b');}
  else {P(-1.3,-9.3,0.9,0.3,'#8a6a50');P(0.5,-9.3,0.9,0.3,'#8a6a50');}
  if(glow)ctx.restore();
}
function nameTag(ctx,cx,feetY,s,name,stHex){
  ctx.font='700 8px ui-monospace,monospace';
  const tw=ctx.measureText(name).width, w=tw+14, x=Math.round(cx-w/2), y=Math.round(feetY-13.4*s);
  ctx.fillStyle='rgba(6,3,14,.85)';ctx.fillRect(x,y,w,11);
  ctx.fillStyle=stHex;ctx.fillRect(x+4,y+4,3,3);
  ctx.fillStyle='#efeaff';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(name,x+10,y+2);
}

function stepActor(a,o,dt){
  const r=rooms[a.id], st=(byId[a.id]&&byId[a.id].status)||'offline';
  if(st==='offline'){o.targetX=null;return;}
  const activity=st==='working'||st==='active'?1:st==='idle'?0.5:0.25;
  if(o.pauseT>0){o.pauseT-=dt;return;}
  if(o.targetX==null){
    if(Math.random()<0.9*activity){o.targetX=r.walkMin+Math.random()*(r.walkMax-r.walkMin);o.dir=o.targetX>o.x?1:-1;}
    else o.pauseT=1.5+Math.random()*3;
    return;
  }
  const sp=r.w*0.11*(0.7+0.6*activity);
  o.x+=Math.sign(o.targetX-o.x)*sp*dt;
  if(Math.abs(o.targetX-o.x)<2){o.targetX=null;o.pauseT=1+Math.random()*(4-2.5*activity);}
}

function planWalk(ev){
  const tr=rooms[ev.to]; if(!tr)return false;
  const gr=rooms.general, sx=shaftX+shaftW/2;
  walker.path=[{x:sx,y:gr.feetY},{x:sx,y:tr.feetY},{x:tr.cx,y:tr.feetY}];
  walker.seg=0;walker.state='out';walker.task=ev;
  return true;
}
function stepWalker(dt){
  const speed=W*0.30;
  if(walker.state==='home'){
    const o=actors.general, r=rooms.general;
    stepActor({id:'general'},o,dt);
    walker.x=o.x;walker.y=r.feetY;
    if(walkQueue.length)planWalk(walkQueue.shift());
    return;
  }
  if(walker.state==='visit'){
    walker.t-=dt;
    if(walker.t<=0){
      const gr=rooms.general,sx=shaftX+shaftW/2;
      walker.path=[{x:sx,y:walker.y},{x:sx,y:gr.feetY},{x:rooms.general.cx,y:gr.feetY}];
      walker.seg=0;walker.state='back';
    }
    return;
  }
  const tgt=walker.path[walker.seg];
  const dx=tgt.x-walker.x, dy=tgt.y-walker.y, dist=Math.hypot(dx,dy);
  const step=speed*dt*(Math.abs(dy)>1?1.6:1);
  if(dist<=step){
    walker.x=tgt.x;walker.y=tgt.y;walker.seg++;
    if(walker.seg>=walker.path.length){
      if(walker.state==='out'){walker.state='visit';walker.t=1.7;arriveFx={x:walker.x,y:walker.y,t:0};}
      else{walker.state='home';walker.task=null;actors.general.x=walker.x;}
    }
  }else{
    walker.x+=dx/dist*step;walker.y+=dy/dist*step;
    if(Math.abs(dx)>1)walker.facing=dx>0?1:-1;
  }
}

/* ============ frame loop ============ */
let lastT=0;
function loop(ts){
  const time=ts/1000, dt=Math.min(0.05,(ts-lastT)/1000||0.016); lastT=ts;
  fctx.clearRect(0,0,W,H);
  const s=Math.max(3.2,W*0.0105);

  drawAmbient(time);

  AGENTS.forEach(a=>{
    if(a.id==='general')return;
    const st=(byId[a.id]&&byId[a.id].status)||'offline';
    if(st==='offline')return;
    const o=actors[a.id], r=rooms[a.id];
    stepActor(a,o,dt);
    const walking=o.targetX!=null;
    const bob=walking?Math.abs(Math.sin(time*9+o.seed))*1.4:0;
    drawChar(fctx,o.x,r.feetY-bob,s,a.id,walking,time*11+o.seed,o.dir,st==='working',time,o.seed);
    nameTag(fctx,o.x,r.feetY-bob,s,a.name,DOT_HEX[st]);
  });

  stepWalker(dt);
  const seg=walker.path[walker.seg];
  const inShaft=(walker.state==='out'||walker.state==='back')&&seg&&Math.abs(walker.x-(shaftX+shaftW/2))<3&&Math.abs(seg.y-walker.y)>1;
  if(inShaft){
    // elevator car with doors + cable
    R(fctx,shaftX+shaftW/2-1.5,roofH,1,walker.y-15*3.6-roofH,'rgba(180,160,220,.35)');
    vgrad(fctx,shaftX+3,walker.y-14*s,shaftW-6,14*s+5,'#1d1433','#120c22');
    fctx.strokeStyle='#2de2e6';fctx.lineWidth=1;
    fctx.strokeRect(shaftX+3.5,walker.y-14*s+0.5,shaftW-7,14*s+4);
    R(fctx,shaftX+3,walker.y-14*s,shaftW-6,2,'#2de2e6');
  }
  const moving=walker.state==='out'||walker.state==='back';
  const wbob=moving?Math.abs(Math.sin(time*10))*1.5:0;
  drawChar(fctx,walker.x,walker.y-wbob,s*1.1,'general',moving,time*11,walker.facing,true,time,0.3);
  nameTag(fctx,walker.x,walker.y-wbob,s*1.1,'General',DOT_HEX[(byId.general&&byId.general.status)||'active']);

  if(arriveFx){arriveFx.t+=dt;const k=arriveFx.t/0.6;
    if(k<1){fctx.strokeStyle=`rgba(233,53,193,${1-k})`;fctx.lineWidth=2;
      fctx.beginPath();fctx.arc(arriveFx.x,arriveFx.y-6*s,k*28,0,7);fctx.stroke();}
    else arriveFx=null;}

  if(walker.task&&walker.state!=='home'){
    bubble.textContent=walker.task.reason||('→ '+((byId[walker.task.to]||{}).name||walker.task.to));
    bubble.classList.add('show');
    bubble.style.left=walker.x+'px';bubble.style.top=(walker.y-15*s)+'px';
  } else bubble.classList.remove('show');

  requestAnimationFrame(loop);
}

/* ============ data / SSE ============ */
function applyAgents(list){list.forEach(a=>{byId[a.id]={...byId[a.id],...a};});drawBackground();}
function handleDelegations(list){let fresh=false;
  list.forEach(d=>{if(seenDeleg.has(d.id))return;seenDeleg.add(d.id);walkQueue.push(d);fresh=true;});
  if(fresh)loadFeed();
}
function connectSSE(){
  const es=new EventSource('api/agents/stream');
  es.addEventListener('open',()=>setConn(true));
  es.addEventListener('error',()=>setConn(false));
  es.addEventListener('agents',e=>applyAgents(JSON.parse(e.data).agents));
  es.addEventListener('delegations',e=>handleDelegations(JSON.parse(e.data).delegations));
}
function setConn(l){connEl.classList.toggle('live',l);connText.textContent=l?'live':'reconnecting…';}

/* ============ village feed dock ============ */
const dock=document.getElementById('dock'), feedEl=document.getElementById('feed'), dockLast=document.getElementById('dockLast');
document.getElementById('dockBar').addEventListener('click',()=>dock.classList.toggle('open'));
function rel(ts){if(!ts)return'';const d=Date.now()/1000-ts;
  if(d<60)return'now';if(d<3600)return `${d/60|0}m ago`;if(d<86400)return `${d/3600|0}h ago`;return `${d/86400|0}d ago`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function loadFeed(){
  try{
    const d=await fetch('api/feed').then(r=>r.json());
    const feed=d.feed||[];
    if(!feed.length){feedEl.innerHTML='<div class="empty-feed">no delegations yet</div>';return;}
    feed.forEach(ev=>seenDeleg.add(ev.id));
    feedEl.innerHTML=feed.map(ev=>{
      const to=byId[ev.to]||{name:ev.to,emoji:'',neon:'#e935c1'};
      let html=`<div class="msg general"><div class="who">⚙️ GENERAL → ${to.emoji} ${esc((to.name||'').toUpperCase())} <span class="when">${rel(ev.ts)}</span></div>${esc(ev.reason||'delegated a task')}</div>`;
      if(ev.reply) html+=`<div class="msg agent" style="border-color:${to.neon}66"><div class="who" style="color:${to.neon}">${to.emoji} ${esc((to.name||'').toUpperCase())} <span class="when">${rel(ev.reply.ts)}</span></div>${esc(ev.reply.content)}</div>`;
      return html;
    }).join('');
    const last=feed[feed.length-1];
    dockLast.textContent=`General → ${(byId[last.to]||{}).name||last.to}: ${last.reason||''}`;
    feedEl.scrollTop=feedEl.scrollHeight;
  }catch(e){}
}

/* ============ room sheet ============ */
const sheet=document.getElementById('sheet'), sheetBack=document.getElementById('sheetBack');
const sheetHd=document.getElementById('sheetHd'), sheetDesc=document.getElementById('sheetDesc'), sheetChat=document.getElementById('sheetChat');
function onStageClick(e){
  const rect=stage.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  for(const a of AGENTS){const r=rooms[a.id];
    if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h){openSheet(a.id);return;}}
}
async function openSheet(id){
  const a=byId[id]||{};
  const last=a.lastActive?new Date(a.lastActive*1000).toLocaleString():'—';
  sheetHd.innerHTML=`<span class="em">${a.emoji||''}</span>
    <div><h2>${esc(a.name||id)}</h2>
    <div class="st"><span class="dot" style="background:${DOT_HEX[a.status]||'#4a4560'};box-shadow:0 0 6px ${DOT_HEX[a.status]||'transparent'}"></span>${esc(a.statusLabel||'')} · last: ${esc(last)}</div></div>
    <button class="x" onclick="closeSheet()">✕</button>`;
  sheetDesc.textContent=a.description||'';
  sheetChat.innerHTML='<div class="lbl">LOADING…</div>';
  sheet.classList.add('open');sheetBack.classList.add('open');
  try{
    const d=await fetch(`api/messages/${a.thread}`).then(r=>r.json());
    const msgs=d.messages||[];
    sheetChat.innerHTML='<div class="lbl">INTERNAL CHAT</div>'+(msgs.length?
      msgs.map(m=>`<div class="cmsg ${m.role==='user'?'user':'assistant'}" style="--acc:${a.neon||'#332552'}66">${esc(m.content)}<span class="when">${rel(m.ts)}</span></div>`).join('')
      :'<div class="lbl">NO MESSAGES YET</div>');
    sheetChat.scrollTop=sheetChat.scrollHeight;
  }catch(err){sheetChat.innerHTML='<div class="lbl">FAILED TO LOAD</div>';}
}
function closeSheet(){sheet.classList.remove('open');sheetBack.classList.remove('open');}
sheetBack.addEventListener('click',closeSheet);

boot();
</script>
