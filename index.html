<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Agent Village</title>
<style>
  :root{
    --bg0:#170f0a; --bg1:#241610; --ink:#f5ecd8; --muted:#a89478;
    --panel:#241a10; --panel2:#32251a; --line:#4a3520;
    --amber:#ffb545; --gold:#f2c14e; --cream:#f5ecd8;
    --ok:#63c94f; --idle:#e8973d; --afk:#5aa8e8; --off:#6a5f52;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:
    radial-gradient(120% 70% at 50% -10%,#3a2314 0%,transparent 55%),
    linear-gradient(180deg,#221410,var(--bg0));
    color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-font-smoothing:none}
  .wrap{max-width:520px;margin:0 auto;padding:12px 10px calc(64px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:10px}
  h1{font-size:19px;margin:0;letter-spacing:5px;color:var(--gold);font-weight:800;
    text-shadow:0 0 12px rgba(242,193,78,.45),2px 2px 0 #21140a}
  .conn{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;gap:6px;align-items:center;font-size:10px;color:var(--muted)}
  .conn .led{width:8px;height:8px;border-radius:50%;background:var(--off)}
  .conn.live .led{background:var(--ok);box-shadow:0 0 8px var(--ok)}

  .stage{position:relative;width:100%;border-radius:6px;overflow:hidden}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  #bg{z-index:1}#fg{z-index:2}
  .stage::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(115% 100% at 50% 42%,transparent 60%,rgba(20,8,4,.5) 100%)}
  .bubble{position:absolute;transform:translate(-50%,-100%);background:#fdf6e3;color:#3a2510;
    font-size:11px;font-weight:700;padding:5px 9px;border-radius:9px;white-space:nowrap;max-width:230px;
    overflow:hidden;text-overflow:ellipsis;border:2px solid #8a5f36;box-shadow:0 3px 10px rgba(20,8,4,.5);
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:6}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:#8a5f36;border-bottom:0}
  .bubble.show{opacity:1}

  /* ---------- village feed dock ---------- */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:520px;margin:0 auto;
    background:rgba(30,20,12,.97);border-top:2px solid #8a5f36;
    box-shadow:0 -4px 22px rgba(20,8,4,.6);backdrop-filter:blur(6px);
    padding-bottom:env(safe-area-inset-bottom)}
  .dock .bar{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;cursor:pointer;user-select:none}
  .dock .bar .t{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--amber)}
  .dock .bar .last{flex:1;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dock .bar .chev{transition:transform .25s;color:var(--muted);font-size:12px}
  .dock.open .bar .chev{transform:rotate(180deg)}
  .dock .body{height:0;overflow:hidden;transition:height .28s ease}
  .dock.open .body{height:44vh}
  .feed{height:100%;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:88%;padding:7px 10px;border-radius:11px;font-size:11.5px;line-height:1.45;border:1px solid var(--line);background:var(--panel2)}
  .msg .who{font-size:10px;font-weight:800;letter-spacing:1px;margin-bottom:3px;display:flex;gap:6px;align-items:center}
  .msg .when{font-weight:400;color:var(--muted);letter-spacing:0}
  .msg.general{align-self:flex-start;border-color:rgba(242,193,78,.55)}
  .msg.general .who{color:var(--gold)}
  .msg.agent{align-self:flex-end}
  .empty-feed{color:var(--muted);font-size:11px;text-align:center;margin-top:16px}

  /* ---------- room sheet ---------- */
  .sheet-back{position:fixed;inset:0;background:rgba(15,8,4,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-back.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:520px;margin:0 auto;
    background:var(--panel);border:2px solid #8a5f36;border-bottom:none;border-radius:18px 18px 0 0;
    transform:translateY(102%);transition:transform .28s ease,visibility .28s;height:74vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);visibility:hidden}
  .sheet.open{transform:translateY(0);visibility:visible}
  .sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 2px}
  .sheet .hd{display:flex;align-items:center;gap:12px;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
  .sheet .hd .em{font-size:32px;filter:drop-shadow(0 2px 4px rgba(20,8,4,.6))}
  .sheet .hd h2{margin:0;font-size:16px;letter-spacing:1px}
  .sheet .hd .st{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
  .sheet .hd .st .dot{width:7px;height:7px;border-radius:50%;background:var(--off)}
  .sheet .hd .x{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    width:30px;height:30px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px}
  .sheet .desc{padding:8px 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
  .sheet .chat{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
  .sheet .chat .lbl{text-align:center;color:var(--muted);font-size:10px;letter-spacing:2px;margin:4px 0}
  .cmsg{max-width:86%;padding:7px 10px;border-radius:11px;font-size:11.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .cmsg.user{align-self:flex-end;background:#3a2c1d;border:1px solid var(--line)}
  .cmsg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--acc,var(--line))}
  .cmsg .when{display:block;font-size:9px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AGENT VILLAGE</h1>
    <div class="conn" id="conn"><span class="led"></span><span id="connText">connecting…</span></div>
  </header>
  <div class="stage" id="stage">
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>
    <div class="bubble" id="bubble"></div>
  </div>
</div>

<div class="dock" id="dock">
  <div class="bar" id="dockBar">
    <span class="t">☀ VILLAGE FEED</span>
    <span class="last" id="dockLast">no delegations yet</span>
    <span class="chev">▲</span>
  </div>
  <div class="body"><div class="feed" id="feed"><div class="empty-feed">no delegations yet</div></div></div>
</div>

<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="hd" id="sheetHd"></div>
  <div class="desc" id="sheetDesc"></div>
  <div class="chat" id="sheetChat"></div>
</div>

<script>
'use strict';
const stage=document.getElementById('stage');
const bg=document.getElementById('bg'), fg=document.getElementById('fg');
const bctx=bg.getContext('2d'), fctx=fg.getContext('2d');
const bubble=document.getElementById('bubble');
const connEl=document.getElementById('conn'), connText=document.getElementById('connText');

let AGENTS=[], byId={}, houses={};
let W=0,H=0,dpr=1, cellW=0, cellH=0, mapTop=10;
const seenDeleg=new Set();
const DOT_HEX={working:'#63c94f',active:'#63c94f',idle:'#e8973d',afk:'#5aa8e8',offline:'#6a5f52'};

/* house color themes: wall, roof, trim */
const THEME={
  general:    {wall:'#e8d9b0',roof:'#b5443c',trim:'#8a6a42'},
  finance:    {wall:'#efe6c8',roof:'#3f8f5a',trim:'#8a6a42'},
  memory:     {wall:'#e4d6ee',roof:'#7a4fa8',trim:'#6a5a7a'},
  reminders:  {wall:'#cfc4b0',roof:'#5a6a8a',trim:'#8a7a62'},
  predictions:{wall:'#d8d2f0',roof:'#4a3f8f',trim:'#6a5a8a'},
  books:      {wall:'#e6cfae',roof:'#8a5a34',trim:'#6a4a2c'},
  health:     {wall:'#eed6c8',roof:'#c04848',trim:'#8a5a42'},
  japanese:   {wall:'#caa87a',roof:'#35354a',trim:'#8a3a3a'},
  coding:     {wall:'#cfe0d8',roof:'#2f6a5a',trim:'#4a6a5e'},
};

/* ============ boot ============ */
async function boot(){
  const cfg=await fetch('agents.json').then(r=>r.json()).catch(()=>null);
  AGENTS=cfg?cfg.agents:[]; byId=Object.fromEntries(AGENTS.map(a=>[a.id,{...a}]));
  try{const d=await fetch('api/agents').then(r=>r.json()); d.agents.forEach(a=>byId[a.id]={...byId[a.id],...a});}catch(e){}
  layout(); initActors();
  window.addEventListener('resize',()=>{layout();placeActors();});
  stage.addEventListener('click',onStageClick);
  await loadFeed();
  connectSSE();
  requestAnimationFrame(loop);
}

/* ============ layout ============ */
function rowStreetY(row){return mapTop+row*cellH+cellH*0.78;}
function layout(){
  W=stage.clientWidth;
  cellW=W/3; cellH=Math.max(170,Math.min(295,cellW*1.55));
  H=mapTop+3*cellH+16;
  stage.style.height=H+'px';
  dpr=Math.min(window.devicePixelRatio||1,2);
  for(const c of [bg,fg]){c.width=W*dpr;c.height=H*dpr;}
  bctx.setTransform(dpr,0,0,dpr,0,0); fctx.setTransform(dpr,0,0,dpr,0,0);
  houses={};
  AGENTS.forEach(a=>{
    const cx0=a.col*cellW, cy0=mapTop+a.row*cellH;
    let hw=cellW*0.88, hh=cellW*0.80, extra=0;
    if(a.id==='general'){hw=cellW*0.96;hh=cellW*0.86;}
    if(a.id==='reminders'){hw=cellW*0.74;hh=cellW*0.95;extra=-cellW*0.10;}
    const x=cx0+(cellW-hw)/2, y=cy0+cellH*0.07+extra;
    const doorX=x+hw/2, streetY=rowStreetY(a.row);
    // cutaway interior: side frames 4px, roof band takes top ~28% of h
    const intX=x+4, intW=hw-8, wallTop=y+hh*0.28, floorY=y+hh-6;
    houses[a.id]={x,y,w:hw,h:hh,doorX,doorY:y+hh,streetY,
      cx:doorX, cell:{x:cx0,y:cy0,w:cellW,h:cellH},
      intX,intW,wallTop,floorY,
      walkMin:intX+intW*0.10,walkMax:intX+intW*0.90,
      chimX:x+hw*0.78,chimY:y+2};
  });
  drawBackground();
}

/* ============ paint helpers ============ */
function R(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.ceil(w),Math.ceil(h));}
function hexRGB(hex){const n=parseInt(hex.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function dim(hex,f){const[r,g,b]=hexRGB(hex);return `rgb(${r*f|0},${g*f|0},${b*f|0})`;}
function rgba(hex,a){const[r,g,b]=hexRGB(hex);return `rgba(${r},${g},${b},${a})`;}
function litFactor(st){return st==='working'||st==='active'?1:st==='idle'?0.7:st==='afk'?0.45:0.1;}
function hash(i,j){let h=(i*374761393+j*668265263)^(i<<7)^(j<<3);h=(h^(h>>13))*1274126177;return ((h^(h>>16))>>>0)/4294967295;}

/* ============ background: the village map ============ */
function drawBackground(){
  bctx.clearRect(0,0,W,H);
  drawGrass(); drawPaths(); drawDecor();
  AGENTS.forEach(a=>drawHouse(a));
  // golden-evening tint
  const g=bctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(255,158,64,.10)');g.addColorStop(0.6,'rgba(200,110,70,.07)');g.addColorStop(1,'rgba(70,40,110,.14)');
  bctx.fillStyle=g;bctx.fillRect(0,0,W,H);
}

function drawGrass(){
  R(bctx,0,0,W,H,'#4f8a3e');
  const t=8;
  for(let gy=0;gy<H;gy+=t)for(let gx=0;gx<W;gx+=t){
    const hsh=hash(gx,gy);
    if(hsh<0.16)R(bctx,gx,gy,t,t,'#47803a');
    else if(hsh>0.87)R(bctx,gx,gy,t,t,'#579647');
  }
  // tufts + flowers
  for(let i=0;i<90;i++){
    const x=hash(i,7)*W, y=hash(i,13)*H, hsh=hash(i,29);
    if(hsh<0.6){R(bctx,x,y,2,4,'#3e7233');R(bctx,x+2,y+1,2,3,'#3e7233');}
    else if(hsh<0.75)R(bctx,x,y,3,3,'#e8d05a');
    else if(hsh<0.9)R(bctx,x,y,3,3,'#d86a8a');
    else R(bctx,x,y,3,3,'#f0ead8');
  }
}

function pathRect(x,y,w,h){
  R(bctx,x,y,w,h,'#c9a86a');
  R(bctx,x,y,w,2,'#a8834e');R(bctx,x,y+h-2,w,2,'#a8834e');
  for(let i=0;i<w*h/220;i++){const px=x+hash(i,x|0)*w, py=y+3+hash(i,y|0)*(h-6);
    R(bctx,px,py,3,2,hash(i,5)<0.5?'#b5945a':'#d8bc80');}
}
function drawPaths(){
  for(let row=0;row<3;row++){const sy=rowStreetY(row);pathRect(10,sy-8,W-20,18);}
  // central avenue
  const av=W/2-12;
  R(bctx,av,rowStreetY(0)-8,24,rowStreetY(2)-rowStreetY(0)+18,'#c9a86a');
  R(bctx,av,rowStreetY(0)-8,2,rowStreetY(2)-rowStreetY(0)+18,'#a8834e');
  R(bctx,av+22,rowStreetY(0)-8,2,rowStreetY(2)-rowStreetY(0)+18,'#a8834e');
  // plaza paving around General's front
  const py=rowStreetY(1);
  bctx.fillStyle='#b8a88a';bctx.beginPath();bctx.ellipse(W/2,py+1,cellW*0.34,16,0,0,7);bctx.fill();
  bctx.strokeStyle='#96876b';bctx.lineWidth=2;bctx.beginPath();bctx.ellipse(W/2,py+1,cellW*0.34,16,0,0,7);bctx.stroke();
  for(let i=0;i<10;i++){const a=i/10*6.28;R(bctx,W/2+Math.cos(a)*cellW*0.22,py+Math.sin(a)*9,4,3,'#a3937a');}
}

function tree(x,y,s){
  bctx.fillStyle='rgba(25,45,70,.28)';bctx.beginPath();bctx.ellipse(x+s*0.5,y+s*0.28,s*0.8,s*0.3,0,0,7);bctx.fill();
  R(bctx,x-s*0.14,y-s*0.3,s*0.28,s*0.6,'#6a4a2c');
  bctx.fillStyle='#2f6b33';bctx.beginPath();bctx.arc(x,y-s*0.75,s*0.62,0,7);bctx.fill();
  bctx.fillStyle='#3f8a42';bctx.beginPath();bctx.arc(x-s*0.18,y-s*0.9,s*0.5,0,7);bctx.fill();
  bctx.fillStyle='#57a558';bctx.beginPath();bctx.arc(x-s*0.3,y-s*1.02,s*0.3,0,7);bctx.fill();
  bctx.fillStyle='#7ab060';bctx.beginPath();bctx.arc(x-s*0.36,y-s*1.1,s*0.14,0,7);bctx.fill();
}
function bush(x,y,s){
  bctx.fillStyle='#3f7a3a';bctx.beginPath();bctx.arc(x,y,s,0,7);bctx.fill();
  bctx.fillStyle='#54934a';bctx.beginPath();bctx.arc(x-s*0.3,y-s*0.3,s*0.6,0,7);bctx.fill();
}
const LAMPS=[];
function lamp(x,y){
  LAMPS.push({x,y});
  bctx.fillStyle='rgba(255,180,80,.14)';bctx.beginPath();bctx.arc(x,y-14,26,0,7);bctx.fill();
  R(bctx,x-1.5,y-16,3,16,'#4a3524');R(bctx,x-4,y,8,3,'#4a3524');
  R(bctx,x-4,y-22,8,7,'#3a2a1c');R(bctx,x-3,y-21,6,5,'#ffca5a');
}
function drawDecor(){
  LAMPS.length=0;
  const sX=cellW, s=cellW*0.16;
  tree(14,mapTop+30,s);tree(W-16,mapTop+26,s*0.9);
  tree(12,H-24,s*0.95);tree(W-14,H-30,s);
  tree(W/2-cellW*0.72,mapTop+cellH*2+26,s*0.8);
  tree(W/2+cellW*0.74,mapTop+cellH+24,s*0.75);
  bush(cellW*0.5,rowStreetY(0)+22,7);bush(W-cellW*0.5,rowStreetY(2)+20,7);
  bush(cellW*1.5,rowStreetY(2)+22,6);
  lamp(W/2-cellW*0.40,rowStreetY(1)-14);lamp(W/2+cellW*0.40,rowStreetY(1)-14);
  lamp(W/2-18,rowStreetY(0)-16);lamp(W/2+18,rowStreetY(2)-14);
}

/* ---------- houses: cutaway interiors ---------- */
const WALLPAPER={
  general:['#e8d9b0','#ddcda0'], finance:['#dfe8c8','#d2dcb8'], memory:['#e4d6ee','#d8c8e4'],
  reminders:['#efe6d0','#e2d8be'], predictions:['#3a3560','#332e55'], books:['#e6cfae','#dabf9a'],
  health:['#eed6c8','#e2c8b8'], japanese:['#caa87a','#bd9a6c'], coding:['#d4e4dc','#c6d8ce'],
};
function drawHouse(a){
  const hR=houses[a.id], th=THEME[a.id], st=(byId[a.id]&&byId[a.id].status)||'offline';
  const lit=litFactor(st);
  const {x,y,w,h,intX,intW,wallTop,floorY}=hR, u=w/14;
  // evening shadow
  bctx.fillStyle='rgba(25,45,70,.25)';bctx.beginPath();
  bctx.ellipse(x+w/2+6,y+h+3,w*0.55,7,0,0,7);bctx.fill();
  // outer timber frame
  R(bctx,x,wallTop-3,w,h-(wallTop-y)+3,th.trim);
  // ---- interior ----
  const wp=WALLPAPER[a.id]||['#e8d9b0','#ddcda0'];
  const floorTop=y+h*0.68;
  // wallpaper with vertical stripes
  R(bctx,intX,wallTop,intW,floorTop-wallTop,wp[0]);
  for(let sx2=intX+8;sx2<intX+intW;sx2+=14)R(bctx,sx2,wallTop,7,floorTop-wallTop,wp[1]);
  if(a.id==='predictions')for(let i=0;i<8;i++)R(bctx,intX+6+(i*29)%(intW-10),wallTop+4+(i*17)%(floorTop-wallTop-10),2.5,2.5,'#e8d05a');
  // floorboards (tatami for japanese)
  if(a.id==='japanese'){
    R(bctx,intX,floorTop,intW,floorY-floorTop+6,'#cdbf7a');
    bctx.strokeStyle='#a89a58';bctx.lineWidth=1;
    for(let gx=intX;gx<intX+intW;gx+=intW/3){bctx.beginPath();bctx.moveTo(gx,floorTop);bctx.lineTo(gx,floorY+6);bctx.stroke();}
    R(bctx,intX,floorTop+(floorY-floorTop)/2,intW,1,'#a89a58');
  } else {
    R(bctx,intX,floorTop,intW,floorY-floorTop+6,'#b5854e');
    for(let gy=floorTop+6;gy<floorY+6;gy+=7){R(bctx,intX,gy,intW,1,'#9a6f3e');
      for(let gx=intX+((gy/7|0)%2)*14;gx<intX+intW;gx+=28)R(bctx,gx,gy-6,1,6,'#a3763f');}
  }
  R(bctx,intX,floorTop-1.5,intW,3,dim(wp[0],0.75)); // baseboard
  // back-wall door (dark opening)
  const ddw=u*2.6, ddx=hR.doorX-ddw/2;
  R(bctx,ddx-1.5,floorTop-h*0.26-1.5,ddw+3,h*0.26+1.5,th.trim);
  R(bctx,ddx,floorTop-h*0.26,ddw,h*0.26,'#3a2814');
  // back-wall window, lit by status
  const ww=u*2.8, wwy=wallTop+(floorTop-wallTop)*0.24, wwx=intX+intW*0.12;
  if(lit>0.3){
    bctx.fillStyle=`rgba(255,190,90,${0.10*lit})`;bctx.beginPath();bctx.arc(wwx+ww/2,wwy+ww/2,ww*1.3,0,7);bctx.fill();
    R(bctx,wwx,wwy,ww,ww,'#ffdf9a');
  } else R(bctx,wwx,wwy,ww,ww,'#2c3a55');
  bctx.strokeStyle=th.trim;bctx.lineWidth=1.5;bctx.strokeRect(wwx,wwy,ww,ww);
  R(bctx,wwx+ww/2-0.7,wwy,1.4,ww,th.trim);R(bctx,wwx,wwy+ww/2-0.7,ww,1.4,th.trim);
  // interior warm light wash
  if(lit>0.3){const g=bctx.createLinearGradient(0,wallTop,0,floorY);
    g.addColorStop(0,`rgba(255,200,110,${0.10*lit})`);g.addColorStop(1,'rgba(255,200,110,0)');
    bctx.fillStyle=g;bctx.fillRect(intX,wallTop,intW,floorY-wallTop);}
  drawInterior(a,hR,th,u,lit,floorTop);
  // ---- roof band on top ----
  const steps=4, rh=(wallTop-y)/steps+0.5;
  for(let i=0;i<steps;i++){
    const shrink=(steps-1-i)*u*1.1;

function stepActor(a,o,dt){
  const hR=houses[a.id], st=(byId[a.id]&&byId[a.id].status)||'offline';
  if(st==='offline'){o.targetX=null;return;}
  const activity=st==='working'||st==='active'?1:st==='idle'?0.5:0.25;
  if(o.pauseT>0){o.pauseT-=dt;return;}
  if(o.targetX==null){
    if(Math.random()<0.9*activity){o.targetX=hR.walkMin+Math.random()*(hR.walkMax-hR.walkMin);o.dir=o.targetX>o.x?1:-1;}
    else o.pauseT=1.5+Math.random()*3;
    return;
  }
  const sp=cellW*0.10*(0.7+0.6*activity);
  o.x+=Math.sign(o.targetX-o.x)*sp*dt;
  if(Math.abs(o.targetX-o.x)<2){o.targetX=null;o.pauseT=1+Math.random()*(4-2.5*activity);}
}

function planWalk(ev){
  const tH=houses[ev.to]; if(!tH)return false;
  const gH=houses.general, av=W/2;
  // exit hall -> street -> avenue -> target street -> enter target house
  const p=[{x:gH.doorX,y:gH.floorY},{x:gH.doorX,y:gH.streetY}];
  if(gH.streetY!==tH.streetY){p.push({x:av,y:gH.streetY},{x:av,y:tH.streetY});}
  p.push({x:tH.doorX,y:tH.streetY},{x:tH.doorX,y:tH.floorY});
  walker.path=p;walker.seg=0;walker.state='out';walker.task=ev;
  return true;
}
function stepWalker(dt){
  const speed=W*0.26;
  if(walker.state==='home'){
    const o=actors.general;
    stepActor({id:'general'},o,dt);
    walker.x=o.x;walker.y=houses.general.floorY;
    if(walkQueue.length)planWalk(walkQueue.shift());
    return;
  }
  if(walker.state==='visit'){
    walker.t-=dt;
    if(walker.t<=0){
      const gH=houses.general, av=W/2, tH=houses[walker.task.to];
      const p=[{x:tH.doorX,y:tH.streetY}];
      if(gH.streetY!==tH.streetY){p.push({x:av,y:tH.streetY},{x:av,y:gH.streetY});}
      p.push({x:gH.doorX,y:gH.streetY},{x:gH.doorX,y:gH.floorY});
      walker.path=p;walker.seg=0;walker.state='back';
    }
    return;
  }
  const tgt=walker.path[walker.seg];
  const dx=tgt.x-walker.x, dy=tgt.y-walker.y, dist=Math.hypot(dx,dy);
  const step=speed*dt;
  if(dist<=step){
    walker.x=tgt.x;walker.y=tgt.y;walker.seg++;
    if(walker.seg>=walker.path.length){
      if(walker.state==='out'){walker.state='visit';walker.t=1.7;arriveFx={x:walker.x,y:walker.y,t:0};}
      else{walker.state='home';walker.task=null;actors.general.x=walker.x;}
    }
  }else{
    walker.x+=dx/dist*step;walker.y+=dy/dist*step;
    if(Math.abs(dx)>1)walker.facing=dx>0?1:-1;
  }
}

/* ============ ambient (fg) ============ */
const fireflies=Array.from({length:9},(_,i)=>({seed:i*3.3}));
function drawAmbient(t,dt){
  // chimney smoke
  AGENTS.forEach(a=>{
    const st=(byId[a.id]&&byId[a.id].status)||'offline';
    if(!(st==='working'||st==='active'))return;
    if(a.id==='reminders'||a.id==='predictions')return;
    const o=actors[a.id], hR=houses[a.id];
    o.smokeT-=dt;
    if(o.smokeT<=0){o.smokeT=0.8+Math.random()*0.5;
      smoke.push({x:hR.chimX+1,y:hR.chimY-6,r:2.5,a:0.4,vx:(Math.random()-0.3)*3});}
  });
  for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];
    p.y-=10*dt;p.x+=p.vx*dt;p.r+=3.5*dt;p.a-=0.10*dt;
    if(p.a<=0){smoke.splice(i,1);continue;}
    fctx.fillStyle=`rgba(235,228,215,${p.a})`;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill();}
  // clock hands
  const cH=houses.reminders;
  if(cH&&cH.clockX&&litFactor((byId.reminders||{}).status||'offline')>0.05){
    fctx.strokeStyle='#3a2a1c';fctx.lineWidth=1.8;
    fctx.beginPath();fctx.moveTo(cH.clockX,cH.clockY);
    fctx.lineTo(cH.clockX+Math.cos(t*0.04)*cH.clockR*0.5,cH.clockY+Math.sin(t*0.04)*cH.clockR*0.5);fctx.stroke();
    fctx.strokeStyle='#c04848';fctx.lineWidth=1;
    fctx.beginPath();fctx.moveTo(cH.clockX,cH.clockY);
    fctx.lineTo(cH.clockX+Math.cos(t*0.8-1.57)*cH.clockR*0.72,cH.clockY+Math.sin(t*0.8-1.57)*cH.clockR*0.72);fctx.stroke();
  }
  // dojo lanterns sway
  const jH=houses.japanese;
  if(jH&&jH.lanY){
    for(const lx of [jH.lanL,jH.lanR]){
      const sw=Math.sin(t*1.7+lx)*2;
      fctx.fillStyle='#e07040';fctx.fillRect(lx+sw-2.5,jH.lanY,5,7);
      fctx.fillStyle='#3a2a1c';fctx.fillRect(lx+sw-1,jH.lanY-2,2,2);
      fctx.fillStyle='rgba(255,160,90,.16)';fctx.beginPath();fctx.arc(lx+sw,jH.lanY+4,7,0,7);fctx.fill();}
  }
  // orb sparkle (inside Predictions)
  const pH=houses.predictions;
  if(pH&&pH.orbX&&litFactor((byId.predictions||{}).status||'offline')>0.3){
    const ang=t*2;
    fctx.fillStyle='rgba(190,220,255,.9)';
    fctx.beginPath();fctx.arc(pH.orbX+Math.cos(ang)*3,pH.orbY+Math.sin(ang)*2.2,1.3,0,7);fctx.fill();
  }
  // server LED blink (inside Coding)
  const cdH=houses.coding;
  if(cdH&&cdH.ledX&&litFactor((byId.coding||{}).status||'offline')>0.3){
    if(Math.sin(t*4)>0)fctx.fillStyle='#63c94f';else fctx.fillStyle='#e05555';
    fctx.fillRect(cdH.ledX,cdH.ledY,2.5,2.5);
    if(Math.sin(t*6+1)>0.2){fctx.fillStyle='#3fbf9a';fctx.fillRect(cdH.ledX+5,cdH.ledY,2.5,2.5);}
  }
  // lamp flicker pools
  LAMPS.forEach((L,i)=>{
    fctx.fillStyle=`rgba(255,190,90,${0.05+0.03*Math.sin(t*6+i*2)})`;
    fctx.beginPath();fctx.arc(L.x,L.y-14,22,0,7);fctx.fill();
  });
  // fireflies
  fireflies.forEach(f=>{
    const fx=(hash(f.seed|0,3)*W+Math.sin(t*0.5+f.seed)*30+W)%W;
    const fy=(hash(f.seed|0,11)*H+Math.cos(t*0.4+f.seed*2)*22+H)%H;
    const a=0.25+0.35*Math.max(0,Math.sin(t*2.1+f.seed*5));
    fctx.fillStyle=`rgba(240,230,140,${a})`;fctx.beginPath();fctx.arc(fx,fy,1.6,0,7);fctx.fill();
  });
}

/* ============ frame loop ============ */
let lastT=0;
function loop(ts){
  const time=ts/1000, dt=Math.min(0.05,(ts-lastT)/1000||0.016); lastT=ts;
  fctx.clearRect(0,0,W,H);
  const s=Math.max(3.0,W*0.0098);

  drawAmbient(time,dt);

  AGENTS.forEach(a=>{
    if(a.id==='general')return;
    const st=(byId[a.id]&&byId[a.id].status)||'offline';
    if(st==='offline')return;
    const o=actors[a.id], hR=houses[a.id];
    stepActor(a,o,dt);
    const walking=o.targetX!=null;
    const bob=walking?Math.abs(Math.sin(time*9+o.seed))*1.3:0;
    drawChar(fctx,o.x,hR.floorY-bob,s,a.id,walking,time*11+o.seed,o.dir,st==='working',time,o.seed);
    nameTag(fctx,o.x,hR.floorY-bob,s,a.name,DOT_HEX[st]);
  });

  stepWalker(dt);
  const moving=walker.state==='out'||walker.state==='back';
  const wbob=moving?Math.abs(Math.sin(time*10))*1.4:0;
  drawChar(fctx,walker.x,walker.y-wbob,s*1.08,'general',moving,time*11,walker.facing,true,time,0.3);
  nameTag(fctx,walker.x,walker.y-wbob,s*1.08,'General',DOT_HEX[(byId.general&&byId.general.status)||'active']);

  if(arriveFx){arriveFx.t+=dt;const k=arriveFx.t/0.6;
    if(k<1){fctx.strokeStyle=`rgba(242,193,78,${1-k})`;fctx.lineWidth=2;
      fctx.beginPath();fctx.arc(arriveFx.x,arriveFx.y-6*s,k*26,0,7);fctx.stroke();}
    else arriveFx=null;}

  if(walker.task&&walker.state!=='home'){
    bubble.textContent=walker.task.reason||('→ '+((byId[walker.task.to]||{}).name||walker.task.to));
    bubble.classList.add('show');
    bubble.style.left=walker.x+'px';bubble.style.top=(walker.y-15*s)+'px';
  } else bubble.classList.remove('show');

  requestAnimationFrame(loop);
}

/* ============ data / SSE ============ */
function applyAgents(list){list.forEach(a=>{byId[a.id]={...byId[a.id],...a};});drawBackground();}
function handleDelegations(list){let fresh=false;
  list.forEach(d=>{if(seenDeleg.has(d.id))return;seenDeleg.add(d.id);walkQueue.push(d);fresh=true;});
  if(fresh)loadFeed();
}
function connectSSE(){
  const es=new EventSource('api/agents/stream');
  es.addEventListener('open',()=>setConn(true));
  es.addEventListener('error',()=>setConn(false));
  es.addEventListener('agents',e=>applyAgents(JSON.parse(e.data).agents));
  es.addEventListener('delegations',e=>handleDelegations(JSON.parse(e.data).delegations));
}
function setConn(l){connEl.classList.toggle('live',l);connText.textContent=l?'live':'reconnecting…';}

/* ============ village feed dock ============ */
const dock=document.getElementById('dock'), feedEl=document.getElementById('feed'), dockLast=document.getElementById('dockLast');
document.getElementById('dockBar').addEventListener('click',()=>dock.classList.toggle('open'));
function rel(ts){if(!ts)return'';const d=Date.now()/1000-ts;
  if(d<60)return'now';if(d<3600)return `${d/60|0}m ago`;if(d<86400)return `${d/3600|0}h ago`;return `${d/86400|0}d ago`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function loadFeed(){
  try{
    const d=await fetch('api/feed').then(r=>r.json());
    const feed=d.feed||[];
    if(!feed.length){feedEl.innerHTML='<div class="empty-feed">no delegations yet</div>';return;}
    feed.forEach(ev=>seenDeleg.add(ev.id));
    feedEl.innerHTML=feed.map(ev=>{
      const to=byId[ev.to]||{name:ev.to,emoji:'',neon:'#e8973d'};
      let html=`<div class="msg general"><div class="who">⚙️ GENERAL → ${to.emoji} ${esc((to.name||'').toUpperCase())} <span class="when">${rel(ev.ts)}</span></div>${esc(ev.reason||'delegated a task')}</div>`;
      if(ev.reply) html+=`<div class="msg agent" style="border-color:${to.neon}88"><div class="who" style="color:${to.neon}">${to.emoji} ${esc((to.name||'').toUpperCase())} <span class="when">${rel(ev.reply.ts)}</span></div>${esc(ev.reply.content)}</div>`;
      return html;
    }).join('');
    const last=feed[feed.length-1];
    dockLast.textContent=`General → ${(byId[last.to]||{}).name||last.to}: ${last.reason||''}`;
    feedEl.scrollTop=feedEl.scrollHeight;
  }catch(e){}
}

/* ============ room sheet ============ */
const sheet=document.getElementById('sheet'), sheetBack=document.getElementById('sheetBack');
const sheetHd=document.getElementById('sheetHd'), sheetDesc=document.getElementById('sheetDesc'), sheetChat=document.getElementById('sheetChat');
function onStageClick(e){
  const rect=stage.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;
  for(const a of AGENTS){const c=houses[a.id].cell;
    if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){openSheet(a.id);return;}}
}
async function openSheet(id){
  const a=byId[id]||{};
  const last=a.lastActive?new Date(a.lastActive*1000).toLocaleString():'—';
  sheetHd.innerHTML=`<span class="em">${a.emoji||''}</span>
    <div><h2>${esc(a.name||id)}</h2>
    <div class="st"><span class="dot" style="background:${DOT_HEX[a.status]||'#6a5f52'};box-shadow:0 0 6px ${DOT_HEX[a.status]||'transparent'}"></span>${esc(a.statusLabel||'')} · last: ${esc(last)}</div></div>
    <button class="x" onclick="closeSheet()">✕</button>`;
  sheetDesc.textContent=a.description||'';
  sheetChat.innerHTML='<div class="lbl">LOADING…</div>';
  sheet.classList.add('open');sheetBack.classList.add('open');
  try{
    const d=await fetch(`api/messages/${a.thread}`).then(r=>r.json());
    const msgs=d.messages||[];
    sheetChat.innerHTML='<div class="lbl">INTERNAL CHAT</div>'+(msgs.length?
      msgs.map(m=>`<div class="cmsg ${m.role==='user'?'user':'assistant'}" style="--acc:${a.neon||'#4a3520'}88">${esc(m.content)}<span class="when">${rel(m.ts)}</span></div>`).join('')
      :'<div class="lbl">NO MESSAGES YET</div>');
    sheetChat.scrollTop=sheetChat.scrollHeight;
  }catch(err){sheetChat.innerHTML='<div class="lbl">FAILED TO LOAD</div>';}
}
function closeSheet(){sheet.classList.remove('open');sheetBack.classList.remove('open');}
sheetBack.addEventListener('click',closeSheet);

boot();
</script>
